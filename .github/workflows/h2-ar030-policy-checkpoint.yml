name: AR-030 policy-only documentation checkpoint
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/h2-ar030-policy-checkpoint.yml']
permissions:
  contents: read
concurrency:
  group: h2-ar030-policy-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    env:
      CHECKED_HEAD: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Record verified policy subfix and unfulfilled evidence repair in three docs only
        shell: python
        run: |
          """Documentation-only AR-030 policy subfix checkpoint; never writes application source."""
          import datetime,hashlib,io,json,os,re,subprocess,urllib.request,urllib.error,urllib.parse,zipfile
          from pathlib import Path
          REPO='HoangHung997/NotePad';BRANCH='feature/h2-agent-reliability-ar-000'
          CODE='c9162ad7422b58dc8475d711e9b6fc3b2c3a1980';MAIN='1283bc13e07c3cd47d04886166de3dfc595422c0'
          TRACKER='docs/H2_AGENT_RELIABILITY_IMPLEMENTATION_TASKS.md'
          REPORT='docs/agent-reliability/AR-030/mutation-policy-review.md'
          MANIFEST='docs/agent-reliability/AR-030/mutation-policy-evidence.json'
          WORKFLOW='.github/workflows/h2-ar030-policy-checkpoint.yml'
          OUTPUTS=[TRACKER,REPORT,MANIFEST]
          out=Path(os.environ['RUNNER_TEMP'])/'ar030-policy-checkpoint';out.mkdir(exist_ok=True)
          def require(ok,msg):
              if not ok:raise RuntimeError(msg)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          def read(path,limit=8_000_000):
              require(path.startswith(('/actions/runs/','/actions/jobs/','/actions/artifacts/')),'Only same-repository evidence reads allowed')
              request=urllib.request.Request('https://api.github.com/repos/'+REPO+path,headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28','User-Agent':'H2-AR030-policy-docs'})
              try:response=urllib.request.build_opener(NoRedirect()).open(request,timeout=30)
              except urllib.error.HTTPError as e:
                  require(e.code in (301,302,303,307,308),'Evidence read failed')
                  location=e.headers['Location'];uri=urllib.parse.urlparse(location)
                  require(uri.scheme=='https' and uri.hostname and (uri.hostname.endswith('.blob.core.windows.net') or uri.hostname.endswith('.actions.githubusercontent.com')),'Unexpected evidence redirect')
                  # Never forward GitHub credentials to an artifact/log storage host.
                  response=urllib.request.urlopen(urllib.request.Request(location,headers={'User-Agent':'H2-AR030-policy-docs'}),timeout=30)
              with response:data=response.read(limit+1)
              require(len(data)<=limit,'Evidence read exceeds bound');return data
          def api(path):return json.loads(read(path))
          head=os.environ['CHECKED_HEAD']
          require(git('rev-parse','HEAD')==head and not git('status','--porcelain'),'Unexpected or dirty checkout')
          require(git('rev-parse','HEAD^')==CODE and git('diff','--name-only',CODE,head)==WORKFLOW,'Other work appeared; reconcile instead of overwriting')
          require(git('ls-remote','origin','refs/heads/main').split()[0]==MAIN,'Main advanced')
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'Branch advanced')
          require(git('hash-object',TRACKER)=='900ea01a3a8f4aec0b1242f9a787b23c142edff4','Tracker changed')
          require(not Path(REPORT).exists() and not Path(MANIFEST).exists(),'Checkpoint already exists')
          # The evidence resolver is deliberately not part of the independently completed policy fix.
          require(git('rev-parse','HEAD:experiments/H2AgentLab/Tasking/AgentGoalState.cs')=='244a6590737c2c61cdc7c15d4207e8400d35268f','Evidence resolver changed; inspect before recording pending debt')
          runs=[]
          for run_id,job_id in [(35771775587,106894985151),(35771775450,106894991292)]:
              run=api('/actions/runs/'+str(run_id));jobs=api('/actions/runs/'+str(run_id)+'/jobs?per_page=100')
              require(run['head_sha']==CODE and run['status']=='completed' and run['conclusion']=='success','Required exact-SHA run is not complete/successful')
              require(jobs['total_count']==len(jobs['jobs'])==1 and jobs['jobs'][0]['id']==job_id,'Incomplete job inventory')
              require(all(s['conclusion']=='success' for s in jobs['jobs'][0]['steps']),'Skipped/failed steps cannot count as PASS')
              runs.append({'id':run_id,'job_id':job_id,'head_sha':CODE,'conclusion':'success','steps':jobs['jobs'][0]['steps']})
          items=api('/actions/runs/35771775587/artifacts?per_page=100')
          require(items['total_count']==len(items['artifacts'])==1,'Focused artifact inventory differs')
          a=items['artifacts'][0];require(a['name']=='AR030-E1-E2-Evidence' and not a['expired'],'Wrong/expired evidence')
          raw=read('/actions/artifacts/'+str(a['id'])+'/zip',12_000_000)
          digest=hashlib.sha256(raw).hexdigest();require(a['digest']=='sha256:'+digest,'Artifact download hash differs')
          z=zipfile.ZipFile(io.BytesIO(raw));require(sum(i.file_size for i in z.infolist())<50_000_000,'Expanded evidence exceeds bound');require(z.testzip() is None,'Evidence CRC mismatch')
          def text(name):return z.read(name).decode('utf-8-sig')
          identity=json.loads(text('identity.json'));require(identity['code_sha']==CODE and identity['working_tree']=='CLEAN','Wrong focused checkout')
          results={}
          for name,count in [('AR-030-1',33),('AR-030-2',33),('AR-030-3',33),('AR-020',36),('AR-012',44),('AR-011',25),('AR-010',11),('AR-001',13)]:
              require(re.findall(r'RESULT: (\d+) passed, (\d+) failed',text(name+'.log'))==[(str(count),'0')],'Unexpected corpus result '+name)
              results[name]={'passed':count,'failed':0}
          negative=text('policy-negative.log')
          require('RESULT: 0 passed, 3 failed' in negative,'Missing three old-contract failures')
          for message in ['Mutation promotion dropped a host-required verifier.','Declared mutation criterion was duplicated.','Valid mutation promotion cannot pass the host policy guard.']:
              require(message in negative,'Missing policy counterexample')
          require('RESULT: 0 passed, 2 failed' in text('negative.log'),'Prior extraction control missing')
          require('CLEAN:' in text('policy-restored.txt'),'Restore receipt missing')
          suites=json.loads(text('all-agent-suites/suite-results.json'))
          require(suites['code_sha']==CODE and len(suites['suites'])==74 and all(s['exit_code']==0 for s in suites['suites']),'Agent regression failed')
          receipt=json.loads(text('validated-text-source.json'));source=z.read('validated-text-source.zip')
          require(receipt['code_sha']==CODE and hashlib.sha256(source).hexdigest()==receipt['zip_sha256'],'Wrong source receipt')
          sz=zipfile.ZipFile(io.BytesIO(source));require(sz.testzip() is None,'Source CRC failed')
          for item in receipt['entries']:
              d=sz.read(item['path']);require(hashlib.sha256(d).hexdigest()==item['sha256'],'Source SHA256 failed')
              require(hashlib.sha1(b'blob '+str(len(d)).encode()+b'\0'+d).hexdigest()==item['blob_sha'],'Source blob failed')
          log=read('/actions/jobs/106894991292/logs');(out/'full-ci.log').write_bytes(log)
          clean=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',log.decode('utf-8-sig'));lines=clean.splitlines();checkout=None
          for i,line in enumerate(lines):
              if '[command]' in line and 'log -1 --format=%H' in line:
                  for nxt in lines[i+1:i+5]:
                      m=re.search(r'\b([0-9a-f]{40})\b',nxt)
                      if m:checkout=m.group(1);break
                  if checkout:break
          require(checkout is not None,'Actual full-CI checkout missing')
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',checkout],check=True,stdout=subprocess.DEVNULL)
          require(not git('diff','--name-only',CODE,checkout,'--','src','experiments','tests','.github/workflows/avalonia-ci.yml'),'Full-CI source differs')
          full_counts=re.findall(r'RESULT: (\d+) passed, (\d+) failed',clean)
          require(full_counts and full_counts[0]==('752','0'),'Unexpected H2 result')
          runs[1].update({'actual_checkout_sha':checkout,'H2_passed':752,'H2_failed':0,'log_sha256':hashlib.sha256(log).hexdigest()})
          packages=api('/actions/runs/35771775450/artifacts?per_page=100')
          require(packages['total_count']==len(packages['artifacts']) and any(p['name']=='H2Notes-Avalonia-Portable-win-x64' and p['size_in_bytes']>0 for p in packages['artifacts']),'Missing nonempty portable artifact')
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          remaining=['LOCAL_ONLY: experiments/H2AgentLab/Tasking/AgentGoalState.cs','LOCAL_ONLY: tests/H2Notes.Tests/H2AgentGoalProposalBoundaryTests.cs','LOCAL_ONLY: tests/H2Notes.Tests/H2AgentGoalProofIntegrityTests.cs','LOCAL_ONLY: .github/workflows/h2-ar030-validation.yml']
          next_action='Keep AR-030 ACTIVE/REPAIR_REQUIRED on the existing branch and PR #3. The mutation-policy fix is committed and tested; do not reapply the original five-file ZIP. Review the four-file H2_AR030_Remaining_Evidence_Repair patch against c9162ad7422b58dc8475d711e9b6fc3b2c3a1980. Resolve the outstanding source-write restriction before publishing the evidence-resolver change; do not bypass it via encoding, another endpoint or an in-CI source writer. Then compile, run the six evidence cases and prior-goal-state counterexamples, retain the three policy tests/RC-11/12/regressions and full CI on the actual new SHA. The current green CI is not evidence that missing/ambiguous references are fixed. Do not advance AR-031 or close AR-020/E3 or AR-083/E5.'
          evidence={'task':'AR-030','task_done':False,'implementation_status':'ACTIVE','acceptance_status':'REPAIR_REQUIRED','subfix':'host mutation-policy preservation only','subfix_status':'IMPLEMENTED_E1_PASS_WITH_E2_REGRESSION','code_sha':CODE,'branch':BRANCH,'pr':3,'captured_at_utc':now,'runs':runs,'focused_artifact':{'id':a['id'],'size':len(raw),'sha256':digest,'zip_entries':len(z.infolist()),'source_receipt_entries':len(receipt['entries'])},'identity':identity,'positive_results':results,'prior_contract_control':{'old_source':'bf1470ce047afc8a06260f51cd3a736d984e80a8','passed':0,'expected_failures':3,'new_tests_with_one_old_class':True},'restored':text('policy-restored.txt').strip(),'Agent_suites':{'passed':74,'failed':0},'remaining_evidence_resolver':{'blob_unchanged':'244a6590737c2c61cdc7c15d4207e8400d35268f','status':'NOT_PUSHED_NOT_RUN','six_cases':'NOT_RUN','remaining_patch_sha256':'56e76a571223ce4040805065780d0602372c90161755dff25343a286162f9426'},'E3':'NOT_RUN','E4':'NOT_RUN','AR083':'DEFERRED_BY_USER','next_exact_action':next_action}
          original=Path(TRACKER).read_text(encoding='utf-8');start=original.index('```yaml\n',original.index('## 7. SESSION HANDOFF'))+len('```yaml\n');end=original.index('\n```',start);state=json.loads(original[start:end])
          require(state['active_task']=='AR-030','Another worker changed active task')
          state.update({'phase':'AR-030_ACTIVE_POLICY_REPAIRED_EVIDENCE_PENDING','implementation_status':'ACTIVE','acceptance_status':'REPAIR_REQUIRED','owner_session':'chatgpt-ar030-policy-continuation-2026-09-23','last_code_commit':CODE,'last_runtime_source_commit':CODE,'last_validated_code_commit':CODE,'last_full_ci_checkout_sha':checkout,'last_validation_result':'POLICY_SUBFIX_AND_CURRENT_REGRESSIONS_PASS; EVIDENCE_RESOLVER_REPAIR_NOT_RUN','checkpoint_saved_at_utc':now,'working_tree':'Exact Windows CI checkout clean and restored after controls; source receipt checked. Independent four-file remainder is LOCAL_ONLY, not committed. User-PC working tree NOT_ACCESSIBLE. Documentation commit stages only three approved docs.','uncommitted_files':remaining,'completed_this_session':[],'implemented_this_session':[{'part':'AR-030 first-mutation verifier/criterion preservation','code_sha':CODE,'validation':'3 policy tests plus 33/33 AR030 x3 and full CI','task_done':False}],'remaining_in_active_task':['Publish and test complete/unambiguous evidence resolution only after the outstanding source-write restriction is resolved.','Six remaining CSharp evidence cases are NOT_RUN; original nine-case aggregate is superseded by three policy cases tested here plus six pending cases.','Review RC-11/12 and full acceptance on the final repaired SHA; AR-031 not started.'],'known_failures':['PENDING: partial evidence-ID resolution may still become Verified.','PENDING: conflicting material identities sharing an evidence ID are not yet rejected by the current goal-state resolver.'],'resolved_in_this_session':['First mutation no longer drops host-required verifiers.','An existing mutation criterion keeps exact meaning/evidence without duplicate insertion.','Strengthened mutation contract passes existing orchestrator guard.'],'external_blockers':['Previous tool-safety denial for evidence source update remains unresolved; that blocked file was not retried or routed through a writer.','Local container has no SDK/PowerShell and DNS unavailable; Windows CI is the tested environment for the independent allowed fix.'],'pending_user_decisions':[],'last_test_commands':[{'command':'H2Notes.Tests --filter AR-030 (3 repetitions)','run_id':35771775587,'code_sha':CODE,'result':'33/33 x3 including three new policy tests'},{'command':'Prior AgentTaskContract control with AR-030 policy tests','run_id':35771775587,'result':'0 pass / 3 expected failures; positive source restored clean'},{'command':'Retained AR-020/012/011/010/001 and all independent Agent suites','run_id':35771775587,'result':'36/44/25/11/13 and 74/74 suites PASS'},{'command':'Full Avalonia CI build/test/publish/helper IPC','run_id':35771775450,'actual_checkout_sha':checkout,'result':'752/752 H2; all mandatory steps PASS'},{'command':'Remaining six evidence integrity tests','result':'NOT_RUN / source not pushed'}],'next_exact_action':next_action,'next_task_if_active_done':'AR-031'})
          state.setdefault('ci_runs',[]).extend([{'id':r['id'],'job_id':r['job_id'],'head_sha':CODE,'result':'SUCCESS','applies_to':'POLICY_SUBFIX_ONLY_EVIDENCE_REPAIR_PENDING'} for r in runs])
          state['evidence_locations']=list(dict.fromkeys(state.get('evidence_locations',[])+[REPORT,MANIFEST,'conversation: H2_AR030_Remaining_Evidence_Repair.zip (LOCAL_ONLY)']))
          revised=original[:start]+json.dumps(state,ensure_ascii=False,indent=2)+original[end:]
          require('### [x] AR-030' not in revised and '| E5 | DEFERRED_BY_USER |' in revised,'Acceptance boundary was changed')
          Path(TRACKER).write_text(revised,encoding='utf-8')
          Path(MANIFEST).write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          report=f'''# AR-030 — independent host-policy repair\n\nStatus: **ACTIVE / REPAIR_REQUIRED, not DONE**. Only the first-mutation host-policy defect is repaired and tested. The separate incomplete/ambiguous evidence defect remains in AgentGoalState.\n\n## Scope\n\nCode `{CODE}` preserves every pre-existing required verifier, and keeps a predeclared mutation criterion's exact meaning/evidence instead of duplicating it. Three cases are registered through H2AgentGoalProposalBoundaryTests. No engine/store/permissions/UI redesign. AgentGoalState has not changed; the earlier safety-denied source write was not retried through a different encoding, endpoint or source-writing workflow.\n\n## Actual execution\n\nFocused run **35771775587** on `{CODE}`: **33/33 AR-030 x3**, including the three new policy cases. A one-class prior-contract control compiles and reproduces **0 passed / 3 expected failures**, then restores exact bytes/hash and a clean checkout. Existing extraction-only control also remains. Retained AR-020/012/011/010/001: **36/44/25/11/13**, and **74/74** Agent suites.\n\nFull CI **35771775450** tested checkout `{checkout}` (GitHub test merge, not merged main), source equal to `{CODE}`: **752 H2 tests / 0 failures**, all mandatory steps, Windows publish and helper startup/IPC pass. This is not a claim that unresolved evidence handling is correct. E1 policy fixtures and E2 existing concrete/file-runtime regression are not E3/E4 native Office/model acceptance.\n\n## Remaining work and authoritative handoff\n\n{next_action}\n\nThe remaining local patch has four files and six unexecuted evidence-reference cases. Original five-file delivery is stale after this split; do not overwrite the new registration/workflow. Original sources/review and previous CI remain historical evidence for their own SHAs. [Exact execution manifest](mutation-policy-evidence.json). The canonical tracker records both committed policy fix and LOCAL_ONLY remainder. AR-020 native E3 remains pending; E4 NOT_RUN; AR-083 DEFERRED_BY_USER.\n'''
          Path(REPORT).write_text(report,encoding='utf-8')
          subprocess.run(['git','add','--',*OUTPUTS],check=True)
          require(set(git('diff','--cached','--name-only').splitlines())==set(OUTPUTS),'Unexpected staged files')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          (out/'documentation.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          for p in OUTPUTS:(out/Path(p).name).write_bytes(Path(p).read_bytes())
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'Concurrent branch advance; saved patch only')
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','commit','-m','docs(AR-030): record verified policy subfix and retain evidence repair debt'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+BRANCH],check=True)
          saved=git('rev-parse','HEAD');require(not git('status','--porcelain') and git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==saved,'Saved checkpoint not verified')
          (out/'saved.json').write_text(json.dumps({'checkpoint_sha':saved,'code_sha':CODE,'actual_full_ci_checkout':checkout,'task_done':False,'remaining_source_pushed':False},indent=2))
          print('Saved policy-only checkpoint:',saved,'; AR-030 remains REPAIR_REQUIRED.')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR030-Policy-Saved-Checkpoint
          path: ${{ runner.temp }}/ar030-policy-checkpoint/
          if-no-files-found: error
          retention-days: 14
