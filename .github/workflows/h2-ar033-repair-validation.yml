name: AR-033 target proof repair and validation
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: ['.github/workflows/h2-ar033-repair-validation.yml']
permissions:
  contents: read
concurrency:
  group: h2-ar033-repair
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'HoangHung997/NotePad' && github.ref == 'refs/heads/feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    outputs:
      code: ${{ steps.save.outputs.code }}
    env:
      GH_TOKEN: ${{ github.token }}
      CHECKED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply reviewed ten-file repair with exact preimages
        id: save
        shell: python
        run: |
          import base64,gzip,hashlib,io,json,os,pathlib,subprocess
          REPO='HoangHung997/NotePad';BRANCH='feature/h2-agent-reliability-ar-000'
          BASE='6412ad388ac5ebe0c637cb1ca5c8cd1718499136';MAIN='1283bc13e07c3cd47d04886166de3dfc595422c0'
          WF='.github/workflows/h2-ar033-repair-validation.yml'
          def require(ok,msg):
              if not ok: raise RuntimeError(msg)
          def git(*a): return subprocess.check_output(['git',*a],text=True,timeout=90).strip()
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          head=os.environ['CHECKED_HEAD']
          require(git('rev-parse','HEAD')==head and not git('status','--porcelain'),'Wrong or dirty checkout')
          require(git('rev-parse','HEAD^')==BASE and git('diff','--name-only',BASE,head)==WF,'Other work appeared')
          require(git('ls-remote','origin','refs/heads/main').split()[0]==MAIN,'Main advanced')
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'Branch advanced')
          chunks=[]
          for sha in ['bef51adbdc3e6b27e5203236b4cd206fa6109499','14546b057578610476d92929be8123542af0c281']:
              r=json.loads(subprocess.check_output(['gh','api','repos/'+REPO+'/git/blobs/'+sha],timeout=60))
              b=base64.b64decode(r['content']);require(blob(b)==sha and len(b)<=4800,'Transfer mismatch');chunks.append(b)
          c=base64.b64decode(b''.join(chunks),validate=True);require(len(c)==7162,'Transfer length')
          with gzip.GzipFile(fileobj=io.BytesIO(c)) as f:
              patch=f.read(30157);require(len(patch)==30156 and f.read(1)==b'','Patch size')
          require(hashlib.sha256(patch).hexdigest()=='df535653e34450f3f615bb873044d3431bee38cce3a6730fede4537bef22e89a','Reviewed patch hash')
          entries=[
              ('experiments/H2AgentLab/Acceptance/MbNormalUiV2PathTests.cs','8bbbb4c27be5559315edb9f340ac7214ccf2b488','08bb55d98d43f64e6905c503c22210e2000c5a10'),
              ('experiments/H2AgentLab/Capabilities/MbEndToEndInstallContinueTests.cs','0db3060334fe672f8ae2e32b960026c8288dad9b','abd21463392d21b07f65697b91e3dd5e45d7c4c2'),
              ('experiments/H2AgentLab/Integration/AgentIntegrationTaskArchive.cs','753b4624cb94a80e8c169940be75172b6fb7ce87','757b2b954f7beafa75e604e6b42d872723f9ba20'),
              ('experiments/H2AgentLab/Runtime/AgentCompletionAssessment.cs','38c6d5d2848ed4fd9d1685d06feedd1cba0a42e9','89f615718cbb82f9f7a16dfd3a6c087230e526d5'),
              ('experiments/H2AgentLab/Runtime/AgentRuntime.cs','c928d3aeecd40a878a916128e32fbc6f09216c70','462db94d63076e330bce41dfce7a32502e10f166'),
              ('experiments/H2AgentLab/Runtime/MbAgentRuntimeTests.cs','2d98387a5391964bc3e0ea3488882859f4905625','804c998ae1f1328b2c4925a37809af6da26ce9cd'),
              ('experiments/H2AgentLab/Runtime/MbRepairRuntimeTests.cs','f88c5831c06bd951483fd1f8e3997540879078b4','d314fcf1855dccaddd7caf39f8cdde13bdbdba41'),
              ('experiments/H2AgentLab/Runtime/MbSchedulerRuntimeTests.cs','0cf8e6a6c6414bee4f4d6a57f396cf492da2766b','c9f22f104fc78d41b6b133f22b3022591f1c8ede'),
              ('src/H2Notes.Core/H2AgentCompletionAssessment.cs','65f560a619aac2b3a029a853fb0540ca03697f75','b4ee182659cdc44db4aec5e69fb87b98a9f27e33'),
              ('tests/H2Notes.Tests/H2AgentCompletionTests.cs','0dbdc21bbd55794d551ddca3d178779e0c69781a','3397a23b30ef23650899f3f65d302f5a3d357530')]
          for p,old,new in entries: require(blob(pathlib.Path(p).read_bytes())==old,'Preimage '+p)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ar033-repair';out.mkdir()
          pf=out/'reviewed.patch';pf.write_bytes(patch)
          subprocess.run(['git','apply','--index','--check',str(pf)],check=True)
          subprocess.run(['git','apply','--index',str(pf)],check=True)
          for p,old,new in entries: require(blob(pathlib.Path(p).read_bytes())==new,'Postimage '+p)
          require(set(git('diff','--cached','--name-only').splitlines())=={e[0] for e in entries},'Stage mismatch')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'Concurrent branch work')
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','commit','-m','fix(AR-033): isolate target proofs and preserve verified failed-only repairs'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+BRANCH],check=True,timeout=120)
          code=git('rev-parse','HEAD');require(not git('status','--porcelain') and git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==code,'Save not verified')
          (out/'saved.json').write_text(json.dumps({'code_sha':code,'base':BASE,'entries':entries,'tests':'NOT_RUN_AT_SAVE'},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('code='+code+'\n')
      - name: Dispatch unchanged full CI
        run: gh api -X POST repos/HoangHung997/NotePad/actions/workflows/avalonia-ci.yml/dispatches -f ref=feature/h2-agent-reliability-ar-000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR033-Repair-Source
          path: ${{ runner.temp }}/ar033-repair/
          if-no-files-found: error
          retention-days: 14
  validation:
    needs: integrate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.code }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Exact source receipt and build
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar033 | Out-Null
          if (git status --porcelain) { throw 'Dirty checkout' }
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';E1='Target proof policy';E2='Production file fixtures and explicit test verifiers; no real model';E3='NOT_RUN';E4='NOT_RUN';E5='AR-083 DEFERRED_BY_USER'} | ConvertTo-Json | Set-Content artifacts/ar033/identity.json
          python -c "import hashlib,json,pathlib,subprocess,zipfile; paths=subprocess.check_output(['git','ls-files'],text=True).splitlines(); selected=[p for p in paths if pathlib.Path(p).suffix.lower() in ['.cs','.csproj','.props','.targets','.md','.json','.yml','.yaml','.ps1','.slnx']]; z=zipfile.ZipFile('artifacts/ar033/committed-source.zip','w',zipfile.ZIP_DEFLATED); rows=[]; [(z.writestr(p,b),rows.append({'path':p,'sha256':hashlib.sha256(b).hexdigest(),'blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()})) for p in selected for b in [subprocess.check_output(['git','show','HEAD:'+p])]]; z.close(); pathlib.Path('artifacts/ar033/source-receipt.json').write_text(json.dumps(rows,indent=2))"
          if ($LASTEXITCODE) { throw 'Source receipt failed' }
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE) { throw 'Restore failed' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar033/build.log
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Repeat AR-033 and retained regressions
        id: corpora
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$failed=@()
          foreach($name in 'AR-033-1','AR-033-2','AR-033-3','AR-032','AR-031','AR-030','AR-020','AR-012','AR-011','AR-010','AR-001') {
            $env:H2_AR033_EVIDENCE_DIR=Join-Path $PWD "artifacts/ar033/$name"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $name.Substring(0,6) 2>&1 | Tee-Object "artifacts/ar033/$name.log"
            if ($LASTEXITCODE -ne 0 -or (Get-Content "artifacts/ar033/$name.log" -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed') { $failed+=$name }
          }
          @{failed=$failed} | ConvertTo-Json | Set-Content artifacts/ar033/corpora-result.json
          if ($failed.Count) { throw ('Failed corpora: '+($failed -join ',')) }
      - name: Independent Agent suites
        if: success() || steps.corpora.outcome == 'failure'
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar033/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR033-Repair-Evidence
          path: artifacts/ar033/
          if-no-files-found: error
          retention-days: 14
