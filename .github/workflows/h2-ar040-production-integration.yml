name: AR-040 production job integration and validation
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: [.github/workflows/h2-ar040-production-integration.yml]
permissions:
  contents: read
concurrency:
  group: h2-ar040-production-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'HoangHung997/NotePad'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    outputs:
      code_sha: ${{ steps.save.outputs.code_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Integrate only reviewed source on unchanged branch
        id: save
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, datetime, hashlib, json, os, pathlib, subprocess, tempfile, urllib.request
          repo='HoangHung997/NotePad'; branch='feature/h2-agent-reliability-ar-000'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def blob(sha):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r: obj=json.load(r)
              b=base64.b64decode(obj['content']); assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha
              return b
          manifest=json.loads(blob('f4e2c714c673f2ba3f009b5573fcf5baf0685910'))
          head=git('rev-parse','HEAD')
          assert git('rev-parse','HEAD^')==manifest['base'], 'Intervening source: reconcile; do not overwrite'
          assert git('diff','--name-only','HEAD^','HEAD')=='.github/workflows/h2-ar040-production-integration.yml'
          assert not git('status','--porcelain')
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==head
          for f in manifest['files']:
              p=pathlib.Path(f['path'])
              assert not p.is_symlink()
              assert (hashlib.sha256(p.read_bytes()).hexdigest()==f['before']) if f['before'] else not p.exists(), 'Preimage mismatch: '+str(p)
          patch=blob(manifest['patch_blob']); assert hashlib.sha256(patch).hexdigest()==manifest['patch_sha256']
          with tempfile.NamedTemporaryFile(suffix='.patch') as tmp:
              tmp.write(patch); tmp.flush()
              subprocess.run(['git','apply','--check',tmp.name],check=True)
              subprocess.run(['git','apply',tmp.name],check=True)
          for path,sha in manifest['new_blobs'].items():
              p=pathlib.Path(path); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(blob(sha))
          for f in manifest['files']:
              assert hashlib.sha256(pathlib.Path(f['path']).read_bytes()).hexdigest()==f['after'], 'Postimage mismatch: '+f['path']
          tracker=pathlib.Path('docs/H2_AGENT_RELIABILITY_IMPLEMENTATION_TASKS.md'); text=tracker.read_text()
          section=text.index('## 7. SESSION HANDOFF'); start=text.index('{',section)
          handoff,n=json.JSONDecoder().raw_decode(text[start:]); assert handoff['active_task']=='AR-040'
          handoff.update(phase='AR-040_ACTIVE_PRODUCTION_VALIDATION',implementation_status='ACTIVE',acceptance_status='NOT_RUN',owner_session='chatgpt-ar040-production-2026-09-23',working_tree='Reviewed exact source committed by bounded integration; user-PC working tree NOT_ACCESSIBLE.',uncommitted_files=[],checkpoint_saved_at_utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),completed_this_session=['Integrated reviewed production job descriptors, host terminal observations, ownership journal and registered tests; not yet accepted.'],remaining_in_active_task=['Build and run AR-040 three times, every retained AR regression and all mandatory Agent/full-CI steps; repair any failures.','Verify production Global/Project jobs with actual owned processes and archive/output readback; retain native AR-020/033 debt.'],next_exact_action='Inspect Windows validation and full CI on saved.json code_sha. Fix compiler/runtime/test failures without weakening assertions; AR-040 is ACTIVE, not DONE. Preserve AR-083 DEFERRED_BY_USER and all native one-PC gates.')
          tracker.write_text(text[:start]+json.dumps(handoff,ensure_ascii=False,indent=2)+text[start+n:])
          review=pathlib.Path('docs/agent-reliability/AR-040/production-integration.md')
          review.write_text('# AR-040 production job lifecycle — under validation\n\nStatus ACTIVE / NOT_RUN. Source integration is not acceptance.\n\nThe existing process service is registered in the ordinary Global/Project tool session. Host-owned task/revision/permission and native job handles bind start, poll, output, result, stdin and cancel. Suspended process identity is journaled before Resume; terminal observations advance the original invocation and are re-verified through the existing router. Running/Unknown and missing user outcomes remain blockers. ArtifactStore retains bounded stdout/stderr; no parallel engine/database or PID adoption. Full-access only; scripts are not filesystem/network sandboxes. CancelOnHostExit is explicit; restart replay remains AR-041.\n\nTests are registered in the existing runner: E1 identity/policy; E2 production adapter with real disposable PowerShell processes/files/archive and scripted model transport. Native Office/model E3/E4 and E5 are not claimed. AR-020/033 native debt and AR-083 DEFERRED_BY_USER remain.\n')
          paths=[f['path'] for f in manifest['files']]+[str(tracker),str(review)]
          git('add','--',*paths); assert set(git('diff','--cached','--name-only').splitlines())==set(paths)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          git('config','user.name','github-actions[bot]'); git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','feat(AR-040): integrate owned jobs into production runtime and Agent journal')
          code=git('rev-parse','HEAD'); assert not git('status','--porcelain')
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==head, 'Remote moved; source kept as artifact, no overwrite'
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==code
          pathlib.Path('artifacts').mkdir(exist_ok=True)
          pathlib.Path('artifacts/saved.json').write_text(json.dumps({'code_sha':code,'parent':head,'review_base':manifest['base'],'working_tree':'CLEAN','acceptance':'NOT_RUN','files':manifest['files']},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('code_sha='+code+'\n')
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/workflows/avalonia-ci.yml/dispatches',data=json.dumps({'ref':branch}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: assert r.status==204
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR040-Production-Delivery
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  validate:
    needs: integrate
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.code_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Exact source receipt and build
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar040 | Out-Null
          if (git status --porcelain) { throw 'Dirty checkout' }
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';E1='Host job policy';E2='Production runtime with scripted transport, actual owned processes, files and Agent journal';E3='NOT_RUN';E4='NOT_RUN';E5='AR-083 DEFERRED_BY_USER'} | ConvertTo-Json | Set-Content artifacts/ar040/identity.json
          python -c "import hashlib,json,pathlib,subprocess,zipfile; paths=subprocess.check_output(['git','ls-files'],text=True).splitlines(); selected=[p for p in paths if pathlib.Path(p).suffix.lower() in ['.cs','.csproj','.props','.targets','.md','.json','.yml','.yaml','.ps1','.slnx','.py']]; z=zipfile.ZipFile('artifacts/ar040/committed-source.zip','w',zipfile.ZIP_DEFLATED); rows=[]; [(z.writestr(p,b),rows.append({'path':p,'sha256':hashlib.sha256(b).hexdigest(),'blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()})) for p in selected for b in [subprocess.check_output(['git','show','HEAD:'+p])]]; z.close(); pathlib.Path('artifacts/ar040/source-receipt.json').write_text(json.dumps(rows,indent=2))"
          if ($LASTEXITCODE) { throw 'Source receipt failed' }
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE) { throw 'Restore failed' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar040/build.log
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Repeat production corpus and retain every AR regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$failed=@()
          foreach($name in 'AR-040-1','AR-040-2','AR-040-3','AR-033','AR-032','AR-031','AR-030','AR-020','AR-012','AR-011','AR-010','AR-001') {
            $env:H2_AR040_EVIDENCE_DIR=Join-Path $PWD "artifacts/ar040/$name"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $name.Substring(0,6) 2>&1 | Tee-Object "artifacts/ar040/$name.log"
            if ($LASTEXITCODE -ne 0 -or (Get-Content "artifacts/ar040/$name.log" -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed') { $failed+=$name }
          }
          @{failed=$failed} | ConvertTo-Json | Set-Content artifacts/ar040/corpora-result.json
          if ($failed.Count) { throw ('Failed corpora: '+($failed -join ',')) }
      - name: Independent mandatory Agent suites
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar040/agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR040-Production-Evidence
          path: artifacts/ar040/
          if-no-files-found: error
          retention-days: 14
