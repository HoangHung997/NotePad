name: AR-020 native discovery implementation validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h2-ar020-validation.yml'
      - 'experiments/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/agent-reliability/Invoke-Ar020NativeProbe.ps1'
permissions:
  contents: read
concurrency:
  group: h2-ar020-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  discovery:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record real environment without starting Office or a model
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar020 | Out-Null
          if (git status --porcelain) { throw 'Dirty checkout' }
          $office=@()
          foreach($id in 'Excel.Application','Word.Application') {
            $registered=$false
            try { $registered=($null -ne [Type]::GetTypeFromProgID($id,$false)) } catch {}
            $office+=@{prog_id=$id;registered=$registered;activation='NOT_RUN';native_markers='NOT_RUN'}
          }
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';os=[Environment]::OSVersion.VersionString;interactive=[Environment]::UserInteractive;office=$office;E3='AWAITING_ENVIRONMENT: no native marker corpus run';E4='NOT_RUN';E5='AR-083 DEFERRED_BY_USER'} | ConvertTo-Json -Depth 6 | Set-Content artifacts/ar020/identity.json
          $tokens=$null;$errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path tools/agent-reliability/Invoke-Ar020NativeProbe.ps1),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { throw 'Native wrapper PowerShell syntax failed' }
          'PASS: syntax only; native helper not invoked.' | Set-Content artifacts/ar020/native-wrapper-syntax.txt
          dotnet --info | Set-Content artifacts/ar020/dotnet-info.txt
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE) { throw 'Restore failed' }
      - name: Prove old lifetime-cache failures with exact negative controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=@('experiments/H2AgentLab.OfficeHost/OfficeWindowCatalog.cs','experiments/H2AgentLab/Integration/H2ProductionAgentAdapter.Context.cs')
          $old='0827e036264bd4884f17a778e36b63b15d10f35c'
          $backup=Join-Path $env:RUNNER_TEMP 'ar020-negative-originals'
          New-Item -ItemType Directory -Force $backup | Out-Null
          if (git status --porcelain) { throw 'Negative control must begin clean' }
          foreach($path in $files) {
            $copy=Join-Path $backup ([IO.Path]::GetFileName($path))
            [IO.File]::WriteAllBytes($copy,[IO.File]::ReadAllBytes((Resolve-Path $path)))
          }
          git ls-files --eol -- $files | Set-Content artifacts/ar020/pre-control-eol.txt
          try {
            foreach($path in $files) {
              python -c "import subprocess,pathlib,sys;pathlib.Path(sys.argv[2]).write_bytes(subprocess.check_output(['git','show',sys.argv[1]+':'+sys.argv[2]]))" $old $path
              if ($LASTEXITCODE) { throw 'Cannot create old-runtime negative control' }
            }
            @{new_test_sha=(git rev-parse HEAD);old_runtime_sha=$old;working_tree='INTENTIONALLY_DIRTY_NEGATIVE_CONTROL';substituted=$files} | ConvertTo-Json -Depth 4 | Set-Content artifacts/ar020/negative-identity.json
            dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar020/negative-build.log
            if ($LASTEXITCODE) { throw 'A compile failure is not a valid negative control' }
            $checks=@(
              @{filter='AR-020 retained view cap';error='Expected preflight session_capacity';name='negative-cap'},
              @{filter='AR-020 exhausted capture cache';error='Capacity error leaked its owned helper or retried automatically.';name='negative-retirement'}
            )
            foreach($check in $checks) {
              $log='artifacts/ar020/'+$check.name+'.log'
              dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $check.filter 2>&1 | Tee-Object $log
              $exit=$LASTEXITCODE;$text=Get-Content $log -Raw
              if ($exit -eq 0 -or $text -notmatch 'RESULT: 0 passed, 1 failed' -or -not $text.Contains($check.error)) { throw 'Expected old-runtime failure was not reproduced' }
            }
          } finally {
            foreach($path in $files) {
              # Restore the original checkout bytes, including its Windows line endings.
              # The backup was captured only after the clean HEAD check above.
              $copy=Join-Path $backup ([IO.Path]::GetFileName($path))
              [IO.File]::WriteAllBytes((Join-Path $PWD $path),[IO.File]::ReadAllBytes($copy))
              if ((Get-FileHash $path).Hash -ne (Get-FileHash $copy).Hash) { throw 'Exact pre-control bytes were not restored' }
            }
          }
          $status=@(git status --porcelain)
          $status | Set-Content artifacts/ar020/post-control-status.txt
          git diff --name-status | Set-Content artifacts/ar020/post-control-diff.txt
          git ls-files --eol -- $files | Set-Content artifacts/ar020/post-control-eol.txt
          if ($status.Count) { throw 'Positive checkout was not restored clean; inspect saved status/diff evidence' }
      - name: Build exact current source and repeat retained production regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (git status --porcelain) { throw 'Dirty positive checkout' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar020/build.log
          if ($LASTEXITCODE) { throw 'Build failed' }
          $failures=@()
          foreach($name in 'AR-020-1','AR-020-2','AR-020-3','AR-012','AR-011','AR-010','AR-001') {
            $task=$name.Substring(0,6);$log="artifacts/ar020/$name.log"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $task 2>&1 | Tee-Object $log
            if ($LASTEXITCODE -ne 0 -or (Get-Content $log -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed') { $failures+=$name }
          }
          if ($failures.Count) { throw ('Failed: '+($failures -join ', ')) }
      - name: Run all required independent Agent suites with aggregate failure
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar020/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR020-E1-E2-Environment-Evidence
          path: artifacts/ar020/
          if-no-files-found: error
          retention-days: 14
