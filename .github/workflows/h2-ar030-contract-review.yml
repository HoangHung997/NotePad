name: AR-030 host contract boundary review
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: ['.github/workflows/h2-ar030-contract-review.yml']
permissions:
  contents: read
concurrency:
  group: h2-ar030-contract-review
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'HoangHung997/NotePad' && github.ref == 'refs/heads/feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    outputs:
      code: ${{ steps.save.outputs.code }}
    env:
      GH_TOKEN: ${{ github.token }}
      AR_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Preserve host criteria and accepted history in exactly three CSharp files
        id: save
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          BASE='7651530251c4d11c1d05bb862707d7e13844d87a';BRANCH='feature/h2-agent-reliability-ar-000'
          def git(*a):return subprocess.check_output(['git',*a],text=True).strip()
          def require(ok,msg):
              if not ok: raise RuntimeError(msg)
          def digest(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def blob(sha):
              obj=json.loads(subprocess.check_output(['gh','api','repos/HoangHung997/NotePad/git/blobs/'+sha]))
              data=base64.b64decode(obj['content']);require(len(data)<30000 and digest(data)==sha,'Source hash differs');return data
          head=os.environ['AR_HEAD']
          require(git('rev-parse','HEAD')==head and not git('status','--porcelain'),'Wrong/dirty checkout')
          require(git('rev-parse','HEAD^')==BASE and git('diff','--name-only',BASE,head)=='.github/workflows/h2-ar030-contract-review.yml','Other work appeared')
          require(git('ls-remote','origin','refs/heads/main').split()[0]=='1283bc13e07c3cd47d04886166de3dfc595422c0','Main advanced')
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'Branch advanced')
          contract='experiments/H2AgentLab/Tasking/AgentTaskContract.cs';host='experiments/H2AgentLab/Tasking/AgentOrchestrator.cs';test='tests/H2Notes.Tests/H2AgentGoalProposalBoundaryTests.cs'
          for path,sha in [(contract,'4a756b7a97533fca39bf92f7f6c9d7c0a88b6da6'),(host,'a17351d7cf6c660c9626e6b155224ba51c60d109'),(test,'93977dd308a36c5cf58988fbe2d745fd2130275a')]:
              require(digest(Path(path).read_bytes())==sha,'Preimage differs: '+path)
          out=Path(os.environ['RUNNER_TEMP'])/'ar030-contract';out.mkdir()
          patch=out/'contract.patch';patch.write_bytes(blob('f5fbfb74a7c7a85fc730da3c6d0c52817c5d3b51'))
          subprocess.run(['git','apply','--index','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          Path(test).write_bytes(blob('97bfe9dfb953c4f396589aa2516b265df3f3a352'))
          for path,sha in [(contract,'9b52de8ffe5075924345d1c4d335441fd83c9e91'),(host,'8b566ec6f0423c218d59ab936f43014cc90a7943')]:
              require(digest(Path(path).read_bytes())==sha,'Postimage differs')
          paths=[contract,host,test];subprocess.run(['git','add','--',*paths],check=True)
          require(set(git('diff','--cached','--name-only').splitlines())==set(paths),'Unexpected staged changes')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          (out/'repair.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'Concurrent work; no push')
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','commit','-m','fix(AR-030): retain host-owned criteria and monotonic goal evidence'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+BRANCH],check=True)
          saved=git('rev-parse','HEAD');require(not git('status','--porcelain') and git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==saved,'Saved source not verified')
          (out/'saved.json').write_text(json.dumps({'code_sha':saved,'base_sha':BASE,'paths':paths,'working_tree':'CLEAN','app_tests':'NOT_RUN_YET'},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a')as f:f.write('code='+saved+'\n')
          print('Saved contract repair source:',saved)
          PY
      - name: Dispatch unchanged full CI on saved source
        run: gh api -X POST repos/HoangHung997/NotePad/actions/workflows/avalonia-ci.yml/dispatches -f ref=feature/h2-agent-reliability-ar-000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR030-Contract-Repair
          path: ${{ runner.temp }}/ar030-contract/
          if-no-files-found: error
          retention-days: 14
  validation:
    needs: repair
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair.outputs.code }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record exact source identity and build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar030-contract | Out-Null
          if (git status --porcelain) { throw 'Dirty source' }
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';os=[Environment]::OSVersion.VersionString;E1='Immutable source and host contract boundaries';E2='Concrete production file runtime / scripted transport and explicitly injected criterion verifier';E3='NOT_RUN';E4='NOT_RUN';E5='AR-083 DEFERRED_BY_USER'} | ConvertTo-Json | Set-Content artifacts/ar030-contract/identity.json
          dotnet --info | Set-Content artifacts/ar030-contract/dotnet-info.txt
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE) { throw 'Restore failed' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar030-contract/build.log
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Reproduce exact prior host contract defects
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $paths=@('experiments/H2AgentLab/Tasking/AgentTaskContract.cs','experiments/H2AgentLab/Tasking/AgentOrchestrator.cs')
          $saved=@{};foreach($p in $paths){$saved[$p]=[IO.File]::ReadAllBytes((Resolve-Path $p))}
          try {
            foreach($p in $paths) {
              python -c "import pathlib,subprocess,sys;p=sys.argv[1];pathlib.Path(p).write_bytes(subprocess.check_output(['git','show','7651530251c4d11c1d05bb862707d7e13844d87a:'+p]))" $p
              if ($LASTEXITCODE) { throw 'Prior source missing' }
            }
            @{test_sha=(git rev-parse HEAD);old_contract_source='7651530251c4d11c1d05bb862707d7e13844d87a';substituted=$paths} | ConvertTo-Json | Set-Content artifacts/ar030-contract/negative-identity.json
            dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar030-contract/negative-build.log
            if ($LASTEXITCODE) { throw 'Compile failure is not a valid counterexample' }
            $checks=@(
              @{name='negative-host-prefix';filter='AR-030 host criterion';error='User revision deleted a host-owned'},
              @{name='negative-proposal-history';filter='AR-030 prior same-revision';error='Expected host contract rejection'},
              @{name='negative-proof-history';filter='AR-030 history update';error='Expected host contract rejection'},
              @{name='negative-host-goal-removal';filter='AR-030 orchestrator cannot discard';error='Expected host contract rejection'}
            )
            foreach($c in $checks) {
              $log='artifacts/ar030-contract/'+$c.name+'.log'
              dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $c.filter 2>&1 | Tee-Object $log
              $exit=$LASTEXITCODE;$text=Get-Content $log -Raw
              if ($exit -eq 0 -or $text -notmatch 'RESULT: 0 passed, 1 failed' -or -not $text.Contains($c.error)) { throw 'Expected old contract failure missing' }
            }
          } finally {foreach($p in $paths){[IO.File]::WriteAllBytes((Join-Path $PWD $p),$saved[$p])}}
          if (git status --porcelain) { throw 'Positive source not restored clean' }
          'CLEAN: exact pre-control checkout restored' | Set-Content artifacts/ar030-contract/restored.txt
      - name: Rebuild and repeat exact source with retained regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar030-contract/positive-build.log
          if ($LASTEXITCODE) { throw 'Positive build failed' }
          $failed=@()
          foreach($name in 'AR-030-1','AR-030-2','AR-030-3','AR-020','AR-012','AR-011','AR-010','AR-001') {
            $env:H2_AR030_EVIDENCE_DIR=Join-Path $PWD "artifacts/ar030-contract/$name"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $name.Substring(0,6) 2>&1 | Tee-Object "artifacts/ar030-contract/$name.log"
            if ($LASTEXITCODE -ne 0 -or (Get-Content "artifacts/ar030-contract/$name.log" -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed') { $failed+=$name }
          }
          if ($failed.Count) { throw ('Failed: '+($failed -join ',')) }
      - name: Run all mandatory independent Agent suites
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar030-contract/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR030-Final-E1-E2-Evidence
          path: artifacts/ar030-contract/
          if-no-files-found: error
          retention-days: 14
