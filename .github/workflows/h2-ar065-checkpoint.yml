name: AR-065 verified docs checkpoint
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: [.github/workflows/h2-ar065-checkpoint.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: h2-ar065-verified-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify completed exact-SHA evidence before docs-only checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: python .github/ar065-checkpoint/checkpoint.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR065-Verified-Checkpoint
          path: artifacts/ar065-checkpoint/
          if-no-files-found: error
          retention-days: 14
