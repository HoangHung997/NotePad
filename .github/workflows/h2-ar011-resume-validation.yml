name: AR-011 resumed review and negative controls
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h2-ar011-resume-validation.yml'
      - 'tools/agent-reliability/ar011-resume.patch.b64'
permissions:
  contents: read
concurrency:
  group: h2-ar011-resume-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  delivery:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    outputs:
      code_sha: ${{ steps.apply.outputs.code_sha }}
    env:
      AR_HEAD: ${{ github.event.pull_request.head.sha }}
      AR_BRANCH: feature/h2-agent-reliability-ar-000
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply the exact reviewed six-file patch or stop on concurrent work
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, os, subprocess
          from pathlib import Path
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          def require(value, message):
              if not value: raise RuntimeError(message)
          require(not git('status', '--porcelain'), 'Dirty checkout')
          require(git('rev-parse', 'HEAD') == os.environ['AR_HEAD'], 'Wrong checkout')
          require(git('ls-remote', 'origin', 'refs/heads/main').split()[0] == '1283bc13e07c3cd47d04886166de3dfc595422c0', 'Main advanced; reconcile')
          require(git('ls-remote', 'origin', 'refs/heads/' + os.environ['AR_BRANCH']).split()[0] == os.environ['AR_HEAD'], 'Branch advanced; preserve work')
          out = Path(os.environ['RUNNER_TEMP']) / 'ar011-delivery'; out.mkdir()
          raw = gzip.decompress(base64.b64decode(Path('tools/agent-reliability/ar011-resume.patch.b64').read_text(), validate=False))
          require(hashlib.sha256(raw).hexdigest() == '6c3982d9e32ec306b7d6899fea7561cb787faa2f5bb3a93ad03d3a0ac62bd72f', 'Patch hash differs')
          patch = out / 'reviewed.patch'; patch.write_bytes(raw)
          expected = {
            'docs/H2_AGENT_RELIABILITY_IMPLEMENTATION_TASKS.md': '2154f134436c113510052ab7d644b45eaf49a391862d102a2cddf1fbde6c809d',
            'docs/agent-reliability/AR-011/implementation.md': '452226801fcf58a666b197cc3c1482dec356e67771f1eacf93c6081e13bfc7ca',
            'experiments/H2AgentLab/Runtime/AgentRuntime.cs': '2493dbcf195638d56a23032ed8378818aeb516941316c47893c1bc7535affc54',
            'experiments/H2AgentLab/Runtime/AgentRuntimeEvidence.cs': 'e64c2547f69efbec9ca90033be7bf30c6143edd82c769db77cbad6e95b8636d5',
            'experiments/H2AgentLab/Tools/ToolExecutionScheduler.cs': '0e6b40e9468796a97922e73bd2cb134eb7ca6e183e4029556e8232aff3da9e25',
            'tests/H2Notes.Tests/H2AgentToolOutcomeTests.cs': '9ae23ed9f58d8f5a23df208e2b6fd57f21bdd548336ac6e109a88165b78cb9f1'}
          changed = False
          if subprocess.run(['git', 'apply', '--reverse', '--check', str(patch)], capture_output=True).returncode != 0:
              require(all(hashlib.sha256(Path(p).read_bytes()).hexdigest() == digest for p, digest in expected.items()), 'A source/checkpoint preimage changed; reconcile instead of overwriting')
              subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
              subprocess.run(['git', 'apply', str(patch)], check=True)
              require(set(git('diff', '--name-only').splitlines()) == set(expected), 'Unexpected patch paths')
              subprocess.run(['git', 'add', '--', *expected], check=True)
              subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
              require(set(git('diff', '--cached', '--name-only').splitlines()) == set(expected), 'Unexpected staged files')
              git('config', 'user.name', 'github-actions[bot]')
              git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              git('commit', '-m', 'fix(AR-011): fence cancelled writes and preserve bounded model-visible controls')
              subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + os.environ['AR_BRANCH']], check=True)
              changed = True
          saved = git('rev-parse', 'HEAD')
          require(not git('status', '--porcelain'), 'Uncommitted patch remains')
          require(git('ls-remote', 'origin', 'refs/heads/' + os.environ['AR_BRANCH']).split()[0] == saved, 'Saved ref not verified')
          (out / 'saved.txt').write_text(saved + '\nCLEAN\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('code_sha=' + saved + '\nchanged=' + str(changed).lower() + '\n')
          PY
      - name: Dispatch unchanged full required CI on the saved source
        if: steps.apply.outputs.changed == 'true'
        run: gh api --method POST repos/HoangHung997/NotePad/actions/workflows/avalonia-ci.yml/dispatches -f ref="$AR_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR011-Resume-Delivery
          path: ${{ runner.temp }}/ar011-delivery/
          if-no-files-found: error
          retention-days: 14
  regressions:
    needs: delivery
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.delivery.outputs.code_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Reproduce the four gaps using new tests with the pre-repair runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out='artifacts/ar011-resume'
          New-Item -ItemType Directory -Force $out | Out-Null
          if (git status --porcelain) { throw 'Dirty initial checkout' }
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';negative_control='new tests with three old runtime files; intentionally dirty test-only checkout';evidence='E1/E2 fixtures; no native model/Office'} | ConvertTo-Json | Set-Content "$out/identity.json"
          $files=@('experiments/H2AgentLab/Runtime/AgentRuntime.cs','experiments/H2AgentLab/Runtime/AgentRuntimeEvidence.cs','experiments/H2AgentLab/Tools/ToolExecutionScheduler.cs')
          $saved=@{}
          try {
            foreach ($file in $files) {
              $saved[$file]=[IO.File]::ReadAllBytes((Join-Path $pwd $file))
              $text = git show "49660c82c8758dfe54e8c53909d3706c96c601df:$file"
              if ($LASTEXITCODE) { throw 'Negative-control preimage missing' }
              [IO.File]::WriteAllText((Join-Path $pwd $file), ($text -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
            }
            dotnet restore H2Notes.Avalonia.slnx
            if ($LASTEXITCODE) { throw 'Restore failed' }
            dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object "$out/negative-build.log"
            if ($LASTEXITCODE) { throw 'Negative control did not compile' }
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter AR-011 2>&1 | Tee-Object "$out/negative-outcomes.log"
            $exit=$LASTEXITCODE
            $text=Get-Content "$out/negative-outcomes.log" -Raw
            if ($exit -eq 0) { throw 'Negative control unexpectedly passed' }
            foreach ($label in @('paged output preserves exact cursor','provider-local cancellation fences','pending control metadata stays complete','large paged result retains exact escaped cursor')) {
              if ($text -notmatch ('FAIL AR-011 ' + [regex]::Escape($label))) { throw "Expected old-runtime failure not reproduced: $label" }
            }
          } finally {
            foreach ($file in $saved.Keys) { [IO.File]::WriteAllBytes((Join-Path $pwd $file), $saved[$file]) }
          }
          if (git status --porcelain) { throw 'Repaired source was not restored cleanly' }
      - name: Build and repeat the exact repaired corpus and retained regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out='artifacts/ar011-resume'
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object "$out/build.log"
          if ($LASTEXITCODE) { throw 'Repaired build failed' }
          foreach ($iteration in 1..3) {
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter AR-011 2>&1 | Tee-Object "$out/outcomes-$iteration.log"
            if ($LASTEXITCODE) { throw "Repaired corpus failed: $iteration" }
          }
          foreach ($task in 'AR-010','AR-001') {
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $task 2>&1 | Tee-Object "$out/$task.log"
            if ($LASTEXITCODE) { throw "$task regression failed" }
          }
      - name: Aggregate every existing mandatory Agent suite
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar011-resume/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR011-Resume-E1-E2-Evidence
          path: artifacts/ar011-resume/
          if-no-files-found: error
          retention-days: 14
