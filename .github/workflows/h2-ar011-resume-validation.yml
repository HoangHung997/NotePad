name: AR-011 one-time acceptance checkpoint
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/h2-ar011-resume-validation.yml']
permissions:
  contents: read
concurrency:
  group: h2-ar011-resume-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      AR_HEAD: ${{ github.event.pull_request.head.sha }}
      AR_BRANCH: feature/h2-agent-reliability-ar-000
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact CI and save only three acceptance documents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          CODE='38a29aa6ed8b4a2d7d717b22fa7d6b93e22c22a7'
          MAIN='1283bc13e07c3cd47d04886166de3dfc595422c0'
          TRACKER=Path('docs/H2_AGENT_RELIABILITY_IMPLEMENTATION_TASKS.md')
          REPORT=Path('docs/agent-reliability/AR-011/implementation.md')
          ACCEPTANCE=Path('docs/agent-reliability/AR-011/acceptance.json')
          out=Path(os.environ['RUNNER_TEMP'])/'ar011-handoff'; out.mkdir()
          git=lambda *a: subprocess.check_output(['git',*a],text=True).strip()
          def require(v,m):
              if not v: raise RuntimeError(m)
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  require(newurl.startswith('https://'), 'Unsafe API redirect')
                  redirected=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if redirected is not None: redirected.remove_header('Authorization')
                  return redirected
          def raw(path):
              require(path.startswith('/actions/'), 'Only CI inventory reads are permitted')
              request=urllib.request.Request('https://api.github.com/repos/HoangHung997/NotePad'+path,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'H2-AR011-checkpoint'})
              with urllib.request.build_opener(SafeRedirect()).open(request,timeout=30) as response:
                  data=response.read(4000001)
              require(len(data)<=4000000,'API evidence exceeds bound')
              return data
          api=lambda p: json.loads(raw(p))
          require(git('rev-parse','HEAD')==os.environ['AR_HEAD'] and not git('status','--porcelain'),'Wrong or dirty checkout')
          require(git('ls-remote','origin','refs/heads/main').split()[0]==MAIN,'Main changed; reconcile')
          require(git('ls-remote','origin','refs/heads/'+os.environ['AR_BRANCH']).split()[0]==os.environ['AR_HEAD'],'Branch changed; preserve work')
          require(not git('diff','--name-only',CODE,'HEAD','--','src','experiments','tests'),'Runtime differs from validated code')
          require(hashlib.sha256(TRACKER.read_bytes()).hexdigest()=='e1993a04d53a74cdd965159c284c9171ecf0e36564fdf48ac9f07b648025f790','Tracker changed')
          require(hashlib.sha256(REPORT.read_bytes()).hexdigest()=='183a162594534192b2e8c837eeb9f1095219b5a64165b0e6d3047b3c0e7623ee','Report changed')
          require(not ACCEPTANCE.exists(),'Acceptance already exists; do not rewrite')
          full=api('/actions/runs/35709818021')
          require(full['head_sha']==CODE and full['status']=='completed' and full['conclusion']=='success','Exact-source full CI not successful')
          jobs=api('/actions/runs/35709818021/jobs?per_page=100')
          require(jobs['total_count']==len(jobs['jobs'])==1,'Unexpected full-CI inventory')
          job=jobs['jobs'][0]
          require(job['id']==106687418149 and all(s['status']=='completed' and s['conclusion']=='success' for s in job['steps']),'A required step did not pass')
          focused=api('/actions/runs/35709753515')
          require(focused['status']=='completed' and focused['conclusion']=='success','Negative/positive control run not successful')
          corpus=api('/actions/artifacts/10686570321')
          require(corpus['digest']=='sha256:d7a957e7b17b3a0b052252d664265a557502eb0c4fa3b917967c9d853464d91f' and not corpus['expired'],'Corpus artifact differs')
          package=api('/actions/artifacts/10686465858')
          require(package['workflow_run']['head_sha']==CODE and package['size_in_bytes']==109984499 and package['digest']=='sha256:91b332e65331b68600bf29bfed9f68c798e78dd36af7a27928a1edce78355fef','Portable package differs')
          log=raw('/actions/jobs/106687418149/logs')
          text=log.decode('utf-8-sig'); require(CODE in text,'Executed checkout SHA missing from job log')
          results=re.findall(r'RESULT: (\d+) passed, (\d+) failed',text)
          require(results and results[0][1]=='0','H2 test summary missing or failing')
          (out/'full-ci.log').write_bytes(log)  # Never emit terminal-control bytes or credentials.
          now=datetime.now(timezone.utc).isoformat()
          next_action='On existing feature/h2-agent-reliability-ar-000 and PR #3, reconcile main/ref/working tree and SESSION HANDOFF. Execute AR-012 only: read SPEC section 5 and AR-012 acceptance, bind exact resource/target identity independently of permission, test Global explicit targets and Project implicit/explicit boundaries, ambiguous and stale active targets, path-prefix/junction/alias fail-closed cases. Retain AR-011/010/001 and all required suites. No second engine/store, new model endpoint or NAS certification.'
          limitations=['E1/E2 concrete production runtime, fixture executors and injected no-network transport handlers only. Model budget used: 0.', 'E3 native Office/provider/model and E4 actual H2 UI/model/tools remain NOT_RUN / AWAITING_ENVIRONMENT.', 'AR-083 remains DEFERRED_BY_USER. NAS probe package/local harness are not E5; one-PC native tests remain mandatory.', 'Runtime job/status metadata and in-memory fences do not implement durable jobs, semantic memory, restart reconciliation or cross-PC locking. AR-012 and AR-030+ remain open.', 'AR-000/001/010 acceptance history and MB-124–127/H2M-133 debts are unchanged. User-PC working tree is NOT_ACCESSIBLE.']
          manifest={'task':'AR-011','spec_version':'H2-AR-SPEC-1.0','status':'DONE','implementation_status':'IMPLEMENTED','acceptance_status':'E2_PASS','branch':os.environ['AR_BRANCH'],'pr':3,'main_sha':MAIN,'tested_code_sha':CODE,'captured_at_utc':now,'working_tree_at_positive_test':'CLEAN',
              'full_ci':{'id':full['id'],'head_sha':full['head_sha'],'conclusion':full['conclusion'],'started_at':full['run_started_at'],'updated_at':full['updated_at'],'job_id':job['id'],'steps':job['steps'],'h2_tests':{'passed':int(results[0][0]),'failed':0},'log_sha256':hashlib.sha256(log).hexdigest()},
              'focused':{'run_id':35709753515,'trigger_head':'1ef2d62985f8765c02fd8ed8fc94efea64d8aab8','tested_code_sha':CODE,'artifact_id':10686570321,'sha256':corpus['digest'][7:],'archive_entries':618,'negative_control':{'runtime_baseline':'49660c82c8758dfe54e8c53909d3706c96c601df','tests_source':CODE,'working_tree':'INTENTIONALLY_DIRTY_TEST_ONLY; only three old runtime files substituted, then restored','passed':21,'failed':4,'expected_failures':['missing model-wire paging control','queued write after provider-local cancellation','pending control exceeds output limit','large projection drops escaped cursor']},'positive_AR011':[{'passed':25,'failed':0} for _ in range(3)],'AR010':{'passed':11,'failed':0},'AR001':{'passed':13,'failed':0},'Agent_suites':{'passed':74,'failed':0},'review':'Assistant downloaded archive and independently checked digest, every ZIP CRC, identity.json, all result summaries and expected negative failure messages.'},
              'package':{'artifact_id':10686465858,'size_bytes':109984499,'sha256':package['digest'][7:],'entries':482,'review':'Downloaded exact archive, verified SHA256/all ZIP CRCs and nonempty application, Office/Desktop helper DLL/runtime files. Full CI executed startup/IPC smoke; no native document acceptance claimed.'},
              'changes':['Typed status/effect/verification/completeness/job/error metadata in existing descriptors/executors/runtime/product projection; cached readiness and explicit unavailable capabilities.', 'Provider-local cancelled mutations fence same-resource queued/future writes before releasing gate; cancellation remains observable, unrelated resources not globally fenced.', 'Actual model wire retains cursors and bounded control metadata, uses existing ArtifactStore for oversized escaped metadata, preserves raw domain bytes; no metadata suffix truncation.', 'Existing denial, malformed payload, false completion, pending job, partial/unknown effects and retained regression gates stay strict.'],
              'commands':['dotnet restore H2Notes.Avalonia.slnx','dotnet build H2Notes.Avalonia.slnx -c Release --no-restore','dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build','dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter AR-011','dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter AR-010','dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter AR-001','tools/agent-reliability/run_agent_suites.ps1','All required Avalonia CI suite/publish/packaged helper smoke commands'],
              'earlier_evidence':{'pre_review_code':'4eef57a1a6fc4c0014516c1215fd1d5fd22945b3','run_id':35704689725,'AR011':'22/22 x3','Agent_suites':'74/74','qualification':'Passed old corpus; new four-gap negative control shows why this was not final acceptance.'},
              'tooling_failure':{'run_id':35708120249,'job_id':106681876740,'cause':'Full tracked-source review archive exceeded the 20MB bound; corrected to bounded UTF-8 text with explicit omitted-file manifest, not a complete build checkout.'},'limitations':limitations,'next_task':'AR-012 NOT_STARTED','next_exact_action':next_action}
          source=TRACKER.read_text();start=source.index('```yaml\n',source.index('## 7. SESSION HANDOFF'))+8;end=source.index('\n```',start)
          state=json.loads(source[start:end]);require(state['active_task']=='AR-011' and state['implementation_status']=='ACTIVE','Another active task appeared')
          accepted={'id':'AR-011','implementation_status':'IMPLEMENTED','acceptance_status':'E2_PASS','code_sha':CODE,'full_ci_run':35709818021}
          state['previous_completed_task']=state.get('last_completed_task')
          state.update(phase='AR-011_ACCEPTED_NEXT_AR-012',active_task='AR-012',implementation_status='NOT_STARTED',acceptance_status='NOT_RUN',last_code_commit=CODE,last_runtime_source_commit=CODE,last_validated_code_commit=CODE,last_validation_result='FULL_REQUIRED_CI_E2_AND_NEGATIVE_CONTROLS_PASS',last_completed_task=accepted,completed_this_session=[accepted],checkpoint_saved_at_utc=now,finalization_checked_head=os.environ['AR_HEAD'],previous_saved_checkpoint_commit=CODE,uncommitted_files=[],pending_user_decisions=[],next_exact_action=next_action,next_task_if_active_done='AR-020',known_failures=['No remaining observed AR-011/010/001 or required-suite failure at accepted source.',*limitations[1:]],remaining_in_active_task=['AR-012 has not started. Resource binding/target grounding remains a separate scope from permissions.'],working_tree='Exact-source positive CI restored and verified CLEAN after negative control. This checkpoint writes only three declared docs and verifies non-force push/remote HEAD. Offline text review matches delivered source; user-PC tree NOT_ACCESSIBLE.',additional_ci_after_recorded_run='Finalization and removal of temporary delivery files are docs/workflow-only relative to accepted runtime. Any later automatically triggered CI is separate; do not transfer the accepted result to an unobserved SHA.')
          state['ci_runs'].append({'id':35709818021,'tested_code_sha':CODE,'result':'SUCCESS','h2_tests':manifest['full_ci']['h2_tests'],'all_required_steps':'PASS','publish_and_helper_IPC':'PASS'})
          state['ci_runs'].append({'id':35709753515,'tested_code_sha':CODE,'result':'SUCCESS','negative_control':'21 passed, 4 expected failures on old runtime + new tests','positive':'25/25 x3, AR010 11/11, AR001 13/13, Agent 74/74','artifact_id':10686570321})
          state['last_test_commands']=[{'command':c,'code_sha':CODE,'result':'PASS','evidence':'Full CI 35709818021 or focused positive run 35709753515; see AR-011 acceptance.json'} for c in manifest['commands']]
          state['evidence_locations'].extend([str(ACCEPTANCE),str(REPORT)])
          source=source[:start]+json.dumps(state,ensure_ascii=False,indent=2)+source[end:]
          row='| AR-011 | Tool outcome/error/readiness contract | 010 | E1/E2 | ACTIVE |'
          require(source.count(row)==1 and source.count('### [~] AR-011')==1,'Task table/heading changed')
          source=source.replace(row,row.replace('ACTIVE','DONE'),1).replace('### [~] AR-011','### [x] AR-011',1)
          note='\n**AR-011 accepted 2026-09-22:** IMPLEMENTED / E2_PASS on `'+CODE+'`; full CI `35709818021`, H2 '+str(results[0][0])+'/0, AR-011 25/25 x3, AR-010 11/11, AR-001 13/13 and Agent 74/74. Four old-runtime failures reproduced and repaired. [Evidence](agent-reliability/AR-011/acceptance.json). E3/E4 NOT_RUN; AR-083 DEFERRED_BY_USER. No other task closed.\n\n'
          source=source.replace('### [ ] AR-012',note+'### [ ] AR-012',1);TRACKER.write_text(source)
          REPORT.write_text(REPORT.read_text()+'\n## Accepted exact-source result\n\n**AR-011 = IMPLEMENTED / E2_PASS / DONE** on `'+CODE+'`. Full CI **35709818021**: all required steps passed, including H2 tests **'+str(results[0][0])+' passed / 0 failed**, Windows publish and packaged Office/Desktop helper startup/IPC. Focused run **35709753515** reproduced the four old-runtime gaps (**21 passed / 4 expected failures**), restored clean repaired source, then passed **25/25 AR-011 x3**, **11/11 AR-010**, **13/13 AR-001**, and **74/74 Agent suites**. Archive hashes, raw result summaries, old failure messages and exact identities were read back. Actual Ollama/Chat Completions wire serialization is exercised with no-network handlers; native model/Office is not certified.\n\nThe downloaded portable package has **109,984,499 bytes / 482 ZIP entries** with verified SHA256/CRC/nonempty helpers. Detailed steps, code identity, artifact hashes, scope and limits are in [acceptance.json](acceptance.json). The canonical handoff advances only to **AR-012 NOT_STARTED** on the same branch/PR. Native E3/E4 remain AWAITING_ENVIRONMENT; AR-083 remains DEFERRED_BY_USER. No merge authorized.\n')
          ACCEPTANCE.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          paths=[str(TRACKER),str(REPORT),str(ACCEPTANCE)]
          subprocess.run(['git','add','--',*paths],check=True)
          require(set(git('diff','--cached','--name-only').splitlines())==set(paths),'Unexpected staged files')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          (out/'documentation.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          require(git('ls-remote','origin','refs/heads/'+os.environ['AR_BRANCH']).split()[0]==os.environ['AR_HEAD'],'Concurrent ref changed; retain patch')
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','docs(AR-011): accept exact-source E2 controls and hand off AR-012')
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+os.environ['AR_BRANCH']],check=True)
          saved=git('rev-parse','HEAD');require(not git('status','--porcelain'),'Dirty checkpoint tree')
          require(git('ls-remote','origin','refs/heads/'+os.environ['AR_BRANCH']).split()[0]==saved,'Saved ref not verified')
          (out/'saved.json').write_text(json.dumps({'checkpoint_sha':saved,'tested_code_sha':CODE,'working_tree':'CLEAN','h2_tests':manifest['full_ci']['h2_tests']},indent=2))
          print('Saved AR-011 acceptance:',saved,'; H2 result:',results[0],'; AR-012 NOT_STARTED.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR011-Saved-Acceptance
          path: ${{ runner.temp }}/ar011-handoff/
          if-no-files-found: error
          retention-days: 14
