name: AR-050 reviewed source delivery
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: [.github/workflows/h2-ar050-implement.yml]
permissions:
  contents: write
concurrency:
  group: h2-ar050-delivery
  cancel-in-progress: false
jobs:
  delivery:
    if: github.repository == 'HoangHung997/NotePad'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Verify reviewed source, preserve checkpoint history, and normal-push one implementation commit
        shell: python
        env:
          SOURCE: |
            
        run: |
          import os, subprocess, pathlib, json, hashlib, base64, zlib, re, datetime
          def git(*args): return subprocess.check_output(['git',*args], text=True).strip()
          branch='feature/h2-agent-reliability-ar-000'
          assert os.environ['GITHUB_REF_NAME']==branch and git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')=='f939cc510c29e655775f973bfb5030758d49ba44', 'Concurrent source change: reconcile, never reset'
          assert not git('status','--porcelain')
          data=zlib.decompress(base64.b64decode(''.join(os.environ['SOURCE'].split())))
          assert len(data)==58203 and hashlib.sha256(data).hexdigest()=='1a8bdf4ca3ca853c2d1632cb1d92802c5bbd663b01a8b839b41d352f790ea99a'
          changes=json.loads(data); assert len(changes)==11
          pending={}
          for c in changes:
            path=c['path']; p=pathlib.Path(path)
            assert not p.is_absolute() and '..' not in p.parts and path.startswith(('src/','tests/','experiments/'))
            if c['before'] is None:
              assert not p.exists(); content=c['content'].encode()
            else:
              original=subprocess.check_output(['git','show','HEAD:'+path]); assert hashlib.sha256(original).hexdigest()==c['before'], path
              text=original.decode()
              for e in c['edits']:
                assert text.count(e['old'])==1, path
                text=text.replace(e['old'],e['new'])
              content=text.encode()
            assert hashlib.sha256(content).hexdigest()==c['after'], path
            pending[path]=content
          tracker='docs/H2_AGENT_RELIABILITY_IMPLEMENTATION_TASKS.md'
          text=subprocess.check_output(['git','show','HEAD:'+tracker]).decode()
          pos=text.index('```yaml\n',text.index('## 7. SESSION HANDOFF'))+len('```yaml\n')
          state,end=json.JSONDecoder().raw_decode(text[pos:]); assert state['active_task']=='AR-050' and state['implementation_status']=='NOT_STARTED'
          state.update(phase='AR-050_ACTIVE_SERIALIZED_REQUEST_VALIDATION',implementation_status='ACTIVE',acceptance_status='NOT_RUN',owner_session='chatgpt-ar050-2026-09-23',working_tree='Reviewed source committed on existing branch; user-PC tree NOT_ACCESSIBLE.',uncommitted_files=[],completed_this_session=[],checkpoint_saved_at_utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),remaining_in_active_task=['Run registered AR-050 actual serializers, 205-cycle corpora, all retained regressions and full CI on delivery code SHA; repair failures.','Verify exact bytes versus estimated tokens, server-held context, prewarm/fallback, native media limitations and source-backed limits.'],next_exact_action='Continue only AR-050. Read source delivery code_sha and Windows CI. Fix failures, then verify receipts and save evidence. AR-020/033 E3 and E4 remain NOT_RUN; AR-083 DEFERRED_BY_USER. No automatic compaction (AR-051) or model/endpoint switch.')
          pending[tracker]=(text[:pos]+json.dumps(state,ensure_ascii=False,indent=2)+text[pos+end:]).encode()
          pending['docs/agent-reliability/AR-050/implementation.md']=b'# AR-050 serialized request budgets\n\nACTIVE / NOT_RUN. Every concrete Agent transport has a final serializer guard; bytes/hash are exact, token/media/retained-context counts are labelled estimates. Provider context limits require source-backed profile configuration; fallback is a local policy, not an advertised model limit. Stored Responses and WebSocket prewarm/continuation retain context counters; cached tokens never remove context. Output reserves are sent in provider dialect. Guard failures block without trimming source or switching providers. No new engine/state store. E1/E2 tests use intercepted actual serializers, not live API/Office/model calls. Native gates and deferred AR-083 remain.\n'
          for path,content in pending.items():
            p=pathlib.Path(path); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(content)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*pending],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(pending)
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==os.environ['GITHUB_SHA'], 'Concurrent update'
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','feat(AR-050): guard actual serialized model requests and register bounded wire tests'],check=True)
          code=git('rev-parse','HEAD'); assert not git('status','--porcelain')
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==code
          out=pathlib.Path('artifacts/ar050-delivery');out.mkdir(parents=True,exist_ok=True)
          (out/'saved.json').write_text(json.dumps({'code_sha':code,'branch':branch,'files':list(pending),'status':'ACTIVE / NOT_RUN'},indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR050-Source-Delivery
          path: artifacts/ar050-delivery/
          if-no-files-found: error
