name: AR-050 reviewed source delivery
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: [.github/workflows/h2-ar050-implement.yml]
permissions:
  contents: write
concurrency:
  group: h2-ar050-delivery
  cancel-in-progress: false
jobs:
  delivery:
    if: github.repository == 'HoangHung997/NotePad'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply only reviewed settings preservation and three registered persistence tests
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os,subprocess,pathlib,json,hashlib,base64,urllib.request
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          branch='feature/h2-agent-reliability-ar-000'
          assert os.environ['GITHUB_REF_NAME']==branch and git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')=='33fc0a09346dd8816860d48e9ec01369c60d6dc9','Concurrent update: reconcile without reset'
          assert not git('status','--porcelain')
          pending={}
          changes=[
            ('src/H2Notes.Avalonia/AiSettingsWindow.cs','17a09364521398ccc898c5752139db7c84e2ccb6','                ReasoningEffort = selected.ReasoningEffort,','                ReasoningEffort = selected.ReasoningEffort,\n                RequestBudget = selected.RequestBudget,'),
            ('tests/H2Notes.Tests/H2AgentRequestBudgetTests.cs','79bebe831cc1fa82529e6a7c6c2edd3c01c208f8','    public static void Run(Action<string, Action> test)\n    {','    public static void Run(Action<string, Action> test)\n    {\n        H2AgentRequestBudgetPersistenceTests.Run(test);')]
          for path,sha,old,new in changes:
            original=subprocess.check_output(['git','show','HEAD:'+path]);assert hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest()==sha,path
            text=original.decode();assert text.count(old)==1,path;pending[path]=text.replace(old,new).encode()
          path='tests/H2Notes.Tests/H2AgentRequestBudgetPersistenceTests.cs';sha='a847d102fca0172a1476e94ec6bb0b13e80d4509'
          assert not pathlib.Path(path).exists()
          req=urllib.request.Request('https://api.github.com/repos/HoangHung997/NotePad/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response:obj=json.load(response)
          assert obj['encoding']=='base64' and obj['sha']==sha
          data=base64.b64decode(obj['content']);assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          data.decode('utf-8');pending[path]=data
          for path,data in pending.items():p=pathlib.Path(path);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          subprocess.run(['git','diff','--check'],check=True);subprocess.run(['git','add','--',*pending],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(pending)
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==os.environ['GITHUB_SHA'],'Concurrent update'
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix(AR-050): preserve request budgets in settings and test post-effect overflow'],check=True)
          code=git('rev-parse','HEAD');assert not git('status','--porcelain')
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==code
          out=pathlib.Path('artifacts/ar050-delivery');out.mkdir(parents=True,exist_ok=True)
          (out/'saved.json').write_text(json.dumps({'code_sha':code,'branch':branch,'files':list(pending),'status':'ACTIVE / ADDITIONAL_TESTS_NOT_RUN'},indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR050-Persistence-Delivery
          path: artifacts/ar050-delivery/
          if-no-files-found: error
