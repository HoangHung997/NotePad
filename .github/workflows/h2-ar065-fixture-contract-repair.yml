name: AR-065 exact fixture contract repair
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: [.github/workflows/h2-ar065-fixture-contract-repair.yml]
permissions:
  contents: write
concurrency:
  group: h2-ar065-fixture-contract-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Repair reviewed test preimages without changing runtime or weakening assertions
        shell: python
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          import hashlib,json,os,pathlib,subprocess
          branch='feature/h2-agent-reliability-ar-000'
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          expected=os.environ['EXPECTED_HEAD']
          assert git('rev-parse','HEAD')==expected and not git('status','--porcelain'), 'Unexpected or dirty checkout'
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==expected, 'Branch advanced; reconcile'
          edits=[]
          def prepare(path,blob,replacements):
              data=pathlib.Path(path).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==blob, 'Changed preimage: '+path
              text=data.decode('utf-8')
              for old,new in replacements:
                  assert text.count(old)==1, 'Ambiguous fixture edit: '+path
                  text=text.replace(old,new)
              edits.append((path,text))
          prepare('tests/H2Notes.Tests/H2AgentOpenAiProductionTests.cs','458150e407d137884974078b3d808edeb315fbd5',[
            ('new { path = "source.txt" }','new { path = "source.txt", offset = "0" }'),
            ('                Check(observed.Contains(Sentinel, StringComparison.Ordinal) || observed.Contains(JsonSerializer.Serialize(Sentinel)[1..^1], StringComparison.Ordinal), "Read observation did not reach the actual model continuation.");','                CheckReadObservation(observed, source);'),
            ('        private static object Call(string name, string id, object args) => new', '''        private static void CheckReadObservation(string observed, string source)
                  {
                      // The domain result is JSON followed by the existing host evidence suffix.
                      // Decode the leading value rather than matching differently escaped JSON text.
                      var reader = new Utf8JsonReader(Encoding.UTF8.GetBytes(observed));
                      using var json = JsonDocument.ParseValue(ref reader);
                      var value = json.RootElement;
                      Check(value.GetProperty("content").GetString() == Sentinel
                          && string.Equals(value.GetProperty("hash").GetString(), Hash(source), StringComparison.OrdinalIgnoreCase)
                          && value.GetProperty("offset").GetInt32() == 0
                          && !value.GetProperty("truncated").GetBoolean(), "Exact read content/hash did not reach the model continuation.");
                  }
                  private static object Call(string name, string id, object args) => new'''.replace('\n          ','\n'))])
          prepare('tests/H2Notes.Tests/H2AgentJobProductionTests.cs','53c746e025168d0efe26289174c4f41ff7c5601c',[
            ('''                var wire = new Wire("[IO.File]::AppendAllText('count.txt','ONE'); [Console]::Write('READY'); Start-Sleep -Seconds 2; [Console]::Write('ĐÃ XONG')");''', '''                // A fixed sleep cannot guarantee two polls on a loaded runner. The disposable
                          // child waits for two observed polls of its own job, with an independent deadline.
                          var wire = new Wire("[IO.File]::AppendAllText('count.txt','ONE'); [Console]::Write('READY'); "
                              + "$deadline=[DateTime]::UtcNow.AddSeconds(20); while(-not [IO.File]::Exists('release-polls.flag')) { "
                              + "if([DateTime]::UtcNow -gt $deadline) { exit 9 }; Start-Sleep -Milliseconds 25 }; [Console]::Write('ĐÃ XONG')");
                          wire.PollObserved = polls => { if (polls == 2) File.WriteAllText(Path.Combine(root, "release-polls.flag"), "RELEASE"); };'''.replace('\n          ','\n')),
            ('        public Action? BeforeStart { get; set; }','        public Action? BeforeStart { get; set; }\n        public Action<int>? PollObserved { get; set; }\n        private int _observedPolls;'),
            ('                if (result.ToolName == "cancel_command_job") _lastStatus = Read(result).GetProperty("Status").GetString()!;', '''                if (result.ToolName == "poll_command_job")
                          {
                              Check(Read(result).GetProperty("job").GetProperty("JobId").GetString() == JobId, "Observed poll changed the owned job.");
                              PollObserved?.Invoke(++_observedPolls);
                          }
                          if (result.ToolName == "cancel_command_job") _lastStatus = Read(result).GetProperty("Status").GetString()!;'''.replace('\n          ','\n'))])
          prepare('tools/agent-reliability/validate_ar065.ps1','c96f6b389fc5ee6ed2d0720e38919f23f3cf0b6d',[
            ('  $env:H2_AR065_EVIDENCE_DIR = Join-Path (Resolve-Path artifacts/ar065) ("receipts-" + $case)','  $env:H2_AR065_EVIDENCE_DIR = Join-Path (Resolve-Path artifacts/ar065) ("receipts-" + $case)\n  $env:H2_AR040_EVIDENCE_DIR = Join-Path (Resolve-Path artifacts/ar065) ("job-receipts-" + $case)')])
          for path,text in edits: pathlib.Path(path).write_bytes(text.encode('utf-8'))
          assert set(git('diff','--name-only').splitlines())=={p for p,_ in edits}
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','config','user.name','H2 AR-065 implementation'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','--',*[p for p,_ in edits]],check=True)
          subprocess.run(['git','commit','-m','test(AR-065): satisfy read offset contract and make retained job polling deterministic'],check=True)
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==expected, 'Concurrent branch edit; do not overwrite'
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==git('rev-parse','HEAD')
          pathlib.Path('delivery.json').write_text(json.dumps({'parent':expected,'code_sha':git('rev-parse','HEAD'),'branch':branch,'files':[{ 'path':p,'sha256':hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()} for p,_ in edits],'tests':'NOT_RUN; exact-SHA validation required'},indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR065-Fixture-Repair-Delivery
          path: delivery.json
          retention-days: 14
