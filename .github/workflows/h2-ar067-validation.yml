name: AR-067 Agent recovery validation
run-name: AR-067 structured recovery and blocked-final validation (${{ github.sha }})
on:
  workflow_dispatch:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths:
      - experiments/H2AgentLab/**
      - src/H2Notes.Avalonia/**
      - src/H2Notes.Core/**
      - tests/H2Notes.Tests/**
      - tools/agent-reliability/*ar067*
      - .github/workflows/h2-ar067-validation.yml
permissions:
  contents: read
concurrency:
  group: h2-ar067-validation
  cancel-in-progress: false
jobs:
  validation:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate AR-067 error-to-Agent recovery and final explanation
        shell: pwsh
        run: tools/agent-reliability/validate_ar067.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR067-Recovery-Evidence
          path: artifacts/ar067/
          if-no-files-found: error
          retention-days: 14
