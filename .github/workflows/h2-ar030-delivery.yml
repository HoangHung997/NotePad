name: AR-030 bounded delivery and validation (native gates unchanged)
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: ['.github/workflows/h2-ar030-delivery.yml']
permissions:
  contents: read
concurrency:
  group: h2-ar030-delivery
  cancel-in-progress: false
jobs:
  delivery:
    if: github.repository == 'HoangHung997/NotePad' && github.ref == 'refs/heads/feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    outputs:
      code: ${{ steps.source.outputs.code }}
    env:
      AR_HEAD: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Run pinned source delivery with unchanged concurrent-work and hash checks
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess
          old=subprocess.check_output(['git','show','a86209e8214a8b4b58258aa7e5f612a4800c506a:.github/workflows/h2-ar030-delivery.yml'],text=True)
          start=old.index("          import base64,datetime")
          end=old.index('\n          PY',start)
          script='\n'.join(line[10:] for line in old[start:end].splitlines())
          anchor="require(git('rev-parse','HEAD^')==BASE,'Unexpected source work; reconcile before applying')"
          if script.count(anchor)!=1: raise SystemExit('Pinned delivery anchor differs')
          script=script.replace(anchor,"git('merge-base','--is-ancestor',BASE,head)")
          # The pinned script still requires ONLY this workflow to differ from BASE;
          # tracker blob, source patch, new blobs, clean tree and remote head must match.
          exec(compile(script,'pinned-ar030-delivery','exec'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('code='+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()+'\n')
          PY
      - name: Dispatch unchanged full CI on saved source
        run: gh api -X POST repos/HoangHung997/NotePad/actions/workflows/avalonia-ci.yml/dispatches -f ref=feature/h2-agent-reliability-ar-000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR030-Candidate-Delivery
          path: ${{ runner.temp }}/ar030-delivery/
          if-no-files-found: error
          retention-days: 14
  validation:
    needs: delivery
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.delivery.outputs.code }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record identity and build actual candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar030 | Out-Null
          if (git status --porcelain) { throw 'Dirty checkout' }
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';os=[Environment]::OSVersion.VersionString;E1='Goal contract';E2='Concrete file runtime, scripted transport, explicit criterion fixture';E3='NOT_RUN';E4='NOT_RUN';E5='AR-083 DEFERRED_BY_USER'} | ConvertTo-Json | Set-Content artifacts/ar030/identity.json
          dotnet --info | Set-Content artifacts/ar030/dotnet-info.txt
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE) { throw 'Restore failed' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar030/build.log
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Extraction-only counterexample with exact restore
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='experiments/H2AgentLab/Tasking/AgentGoalState.cs'
          $original=[IO.File]::ReadAllBytes((Resolve-Path $path))
          try {
            $text=[Text.Encoding]::UTF8.GetString($original)
            $anchor='if(HasOutcomes || clauses.Length>1 && WorkVerb.IsMatch(text))'
            if (($text.Split($anchor).Count-1) -ne 1) { throw 'Mutation-control anchor drift' }
            [IO.File]::WriteAllText((Join-Path $PWD $path),$text.Replace($anchor,'if(false && (HasOutcomes || clauses.Length>1 && WorkVerb.IsMatch(text)))'))
            @{source_sha=(git rev-parse HEAD);kind='EXTRACTION_ONLY_MUTATION_CONTROL';path=$path;not_historical_checkout=$true} | ConvertTo-Json | Set-Content artifacts/ar030/negative-identity.json
            dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar030/negative-build.log
            if ($LASTEXITCODE) { throw 'Compile failure is not a valid negative control' }
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter 'AR-030 RC-11 production' 2>&1 | Tee-Object artifacts/ar030/negative.log
            $code=$LASTEXITCODE;$log=Get-Content artifacts/ar030/negative.log -Raw
            if ($code -eq 0 -or $log -notmatch 'RESULT: 0 passed, 2 failed' -or -not $log.Contains('Incomplete request completed.')) { throw 'Expected counterexample missing' }
          } finally { [IO.File]::WriteAllBytes((Join-Path $PWD $path),$original) }
          if (git status --porcelain) { throw 'Positive checkout not restored clean' }
          'CLEAN: original bytes restored' | Set-Content artifacts/ar030/restored.txt
      - name: Repeat candidate and all retained corpora
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar030/positive-build.log
          if ($LASTEXITCODE) { throw 'Positive rebuild failed' }
          $failed=@()
          foreach($name in 'AR-030-1','AR-030-2','AR-030-3','AR-020','AR-012','AR-011','AR-010','AR-001') {
            $task=$name.Substring(0,6)
            $env:H2_AR030_EVIDENCE_DIR=Join-Path $PWD "artifacts/ar030/$name"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $task 2>&1 | Tee-Object "artifacts/ar030/$name.log"
            if ($LASTEXITCODE -ne 0 -or (Get-Content "artifacts/ar030/$name.log" -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed') { $failed+=$name }
          }
          if ($failed.Count) { throw ('Failed: '+($failed -join ',')) }
      - name: Run mandatory independent Agent suites
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar030/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR030-E1-E2-Evidence
          path: artifacts/ar030/
          if-no-files-found: error
          retention-days: 14
