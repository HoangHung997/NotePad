name: AR-030 one-time source delivery (not acceptance)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/h2-ar030-delivery.yml']
permissions:
  contents: read
concurrency:
  group: h2-ar030-delivery
  cancel-in-progress: false
jobs:
  delivery:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      AR_HEAD: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply exact reviewed source without overwriting unrelated work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,datetime,hashlib,json,os,re,subprocess
          from pathlib import Path
          BASE='1e05be0d9a360975f960165ce6a0dc3c6101b4bb'
          MAIN='1283bc13e07c3cd47d04886166de3dfc595422c0'
          BRANCH='feature/h2-agent-reliability-ar-000'
          TRACKER='docs/H2_AGENT_RELIABILITY_IMPLEMENTATION_TASKS.md'
          REPORT='docs/agent-reliability/AR-030/implementation.md'
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def require(ok,message):
              if not ok: raise RuntimeError(message)
          def blob_hash(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def blob(sha):
              value=json.loads(subprocess.check_output(['gh','api','repos/HoangHung997/NotePad/git/blobs/'+sha]))
              data=base64.b64decode(value['content'])
              require(len(data)<100000 and blob_hash(data)==sha,'Pinned source blob mismatch')
              return data
          head=os.environ['AR_HEAD']
          require(git('rev-parse','HEAD')==head and not git('status','--porcelain'),'Dirty or incorrect checkout')
          require(git('rev-parse','HEAD^')==BASE,'Unexpected source work; reconcile before applying')
          require(git('ls-remote','origin','refs/heads/main').split()[0]==MAIN,'Main advanced')
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'Branch advanced')
          require(git('diff','--name-only',BASE,head)=='.github/workflows/h2-ar030-delivery.yml','Unexpected concurrent diff')
          require(git('rev-parse','HEAD:'+TRACKER)=='b7bdd60a9c9b7217996d80e44ea7f53274db524f','Checkpoint changed')
          out=Path(os.environ['RUNNER_TEMP'])/'ar030-delivery';out.mkdir(exist_ok=True)
          one=blob('868b299f2e20639ba11104e371ba7c0f64eceb59')
          two=blob('86f9c02e30522c4ef7813685f8607550c47d98a9')
          # Correct the single transport transcription difference before checking the reviewed hash.
          two=two.replace(b'"Goal state cannot change task identity or permission scope.", nameof(goals));',b'"Goal state cannot change task identity or permission scope.");')
          require(blob_hash(two)=='f085c7fc0f60c9c230c6c20660c782a34afe5497','Reviewed patch part differs')
          patch=one+two
          require(blob_hash(patch)=='0c0fe2b6525c8c6d4a6d39dc042a5fc6b3c93d35','Reviewed source diff differs')
          patch_path=out/'source.patch';patch_path.write_bytes(patch)
          subprocess.run(['git','apply','--index','--check',str(patch_path)],check=True)
          subprocess.run(['git','apply','--index',str(patch_path)],check=True)
          added={
              'experiments/H2AgentLab/Tasking/AgentGoalState.cs':'16ad70d0595012d4f663646137b991c05f59adaa',
              'tests/H2Notes.Tests/H2AgentGoalRevisionTests.cs':'1f88df36a549fa5857862670a94fef24233c2801',
              '.github/workflows/h2-ar030-validation.yml':'7ef114f6de020f5b86e9658985b87992405d70c1',
              REPORT:'32bef3948c3b5109f5830529ec59e46e5c5e73cf'}
          for path,sha in added.items():
              require(not Path(path).exists(),'New path already exists: '+path)
              Path(path).parent.mkdir(parents=True,exist_ok=True);Path(path).write_bytes(blob(sha))
          original=Path(TRACKER).read_text()
          start=original.index('```yaml\n',original.index('## 7. SESSION HANDOFF'))+len('```yaml\n');end=original.index('\n```',start)
          state=json.loads(original[start:end])
          require(state['active_task']=='AR-020','Different task became active')
          state.update({'phase':'AR-030_ACTIVE_IMPLEMENTATION','active_task':'AR-030','implementation_status':'ACTIVE','acceptance_status':'NOT_RUN','owner_session':'chatgpt-ar030-2026-09-22','implementation_branch':BRANCH,'active_pr':3,'candidate_base':BASE,'candidate_commit_lookup':'git log -1 --format=%H -- experiments/H2AgentLab/Tasking/AgentGoalState.cs','working_tree':'CI candidate delivery validates clean checkout and exact source patch, then stages only 13 allowed files and verifies non-force push. User-PC tree NOT_ACCESSIBLE. Local mirror is not remote history.','uncommitted_files':[],'completed_this_session':[],'remaining_in_active_task':['Build actual candidate and repair all regressions; validate RC-11/12 with real temporary file effects and explicitly scripted model transport.','Review full CI/publish/helper IPC and exact-SHA evidence before acceptance.'],'last_test_commands':[{'command':'git diff --check / pinned source hash and git apply --index --check','result':'SOURCE_CHECKS_ONLY_NOT_APPLICATION_TESTS'},{'command':'Windows .NET 10 AR-030 corpus and retained regression/full CI','result':'NOT_RUN_ON_NEW_CANDIDATE'}],'last_validation_result':'AR030_CANDIDATE_NOT_YET_TESTED','checkpoint_saved_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'external_blockers':['Native Office E3/E4 unavailable; does not block independent AR-030 E2 implementation.'],'pending_user_decisions':[],'parked_acceptance':[{'id':'AR-020','implementation_status':'IMPLEMENTED','acceptance_status':'AWAITING_ENVIRONMENT','required_level':'E3','done':False}],'next_exact_action':'Stay on AR-030 and the existing branch/PR. Run the read-only AR-030 validation plus unchanged full CI on actual candidate source, fix compile/test errors, inspect evidence, save checkpoint. Do not start AR-031 or declare native AR-020/E4/E5 passed.','next_task_if_active_done':'AR-031'})
          revised=original[:start]+json.dumps(state,ensure_ascii=False,indent=2)+original[end:]
          row='| AR-030 | Outcome obligations + goal revisions | 010/011 | E2 | NOT_STARTED |'
          require(row in revised and '### [ ] AR-030' in revised,'Task anchor changed')
          revised=revised.replace(row,row.replace('NOT_STARTED','ACTIVE'),1).replace('### [ ] AR-030','### [~] AR-030',1)
          require('| E5 | DEFERRED_BY_USER |' in revised and '### [~] AR-020' in revised,'Parked acceptance changed')
          Path(TRACKER).write_text(revised)
          changed={x for x in re.findall(r'^\+\+\+ b/(.+)$',patch.decode(),re.M)}
          allowed=changed|set(added)|{TRACKER}
          require(len(allowed)==13,'Unexpected candidate scope')
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          require(set(git('diff','--cached','--name-only').splitlines())==allowed,'Unexpected staged files')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          (out/'candidate.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'Concurrent work; do not push')
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','commit','-m','feat(AR-030): retain source-backed outcomes and trusted user goal revisions'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+BRANCH],check=True)
          saved=git('rev-parse','HEAD')
          require(not git('status','--porcelain') and git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==saved,'Saved code not verified')
          (out/'saved.json').write_text(json.dumps({'code_sha':saved,'base_sha':BASE,'paths':sorted(allowed),'working_tree':'CLEAN','application_tests':'NOT_RUN','AR020':'AWAITING_ENVIRONMENT','AR083':'DEFERRED_BY_USER'},indent=2))
          print('Saved untested AR-030 candidate:',saved)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR030-Candidate-Delivery
          path: ${{ runner.temp }}/ar030-delivery/
          if-no-files-found: error
          retention-days: 14
