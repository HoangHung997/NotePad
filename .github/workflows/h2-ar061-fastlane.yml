name: AR-061 fastlane Windows ARM validation
on:
  push:
    branches:
      - feature/h2-agent-reliability-ar-000

permissions:
  contents: read

concurrency:
  group: h2-ar061-fastlane
  cancel-in-progress: true

jobs:
  validate-build:
    if: github.repository == 'HoangHung997/NotePad'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore, build, focused AR-061 and full H2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar061-fastlane | Out-Null
          if (git status --porcelain) { throw 'Dirty checkout before AR-061 fastlane validation.' }
          $sha = git rev-parse HEAD
          @{task='AR-061';code_sha=$sha;runner='windows-latest';working_tree='CLEAN';E1='focused schema/tool/recovery';E2='DesktopHost fixture + MB-112 + full H2 + Agent suites';E3='AWAITING_ENVIRONMENT';E4='AWAITING_ENVIRONMENT';E5='AR-083 DEFERRED_BY_USER'} |
            ConvertTo-Json -Depth 6 | Set-Content artifacts/ar061-fastlane/identity.json

          dotnet restore .\H2Notes.Avalonia.slnx 2>&1 | Tee-Object artifacts/ar061-fastlane/restore.log
          if ($LASTEXITCODE) { throw 'Restore failed' }

          dotnet build .\H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar061-fastlane/build.log
          if ($LASTEXITCODE) { throw 'Build failed' }

          dotnet run --project .\tests\H2Notes.Tests\H2Notes.Tests.csproj -c Release --no-build -- --filter AR-061 2>&1 |
            Tee-Object artifacts/ar061-fastlane/ar061-tests.log
          if ($LASTEXITCODE -ne 0 -or (Get-Content artifacts/ar061-fastlane/ar061-tests.log -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed') {
            throw 'AR-061 focused tests failed'
          }

          $desktop = (Resolve-Path '.\experiments\H2AgentLab.DesktopHost\bin\Release\net10.0-windows\H2AgentLab.DesktopHost.exe').Path
          dotnet run --project .\experiments\H2AgentLab\H2AgentLab.csproj -c Release --no-build -- --v2-desktop-host-test artifacts/ar061-fastlane/desktop-host $desktop 2>&1 |
            Tee-Object artifacts/ar061-fastlane/desktop-host.log
          if ($LASTEXITCODE) { throw 'DesktopHost regression failed' }

          dotnet run --project .\experiments\H2AgentLab\H2AgentLab.csproj -c Release --no-build -- --mb-desktop-computer-use-acceptance-test artifacts/ar061-fastlane/mb112 $desktop 2>&1 |
            Tee-Object artifacts/ar061-fastlane/mb112.log
          if ($LASTEXITCODE) { throw 'MB-112 desktop acceptance failed' }

          dotnet run --project .\tests\H2Notes.Tests\H2Notes.Tests.csproj -c Release --no-build 2>&1 |
            Tee-Object artifacts/ar061-fastlane/full-h2.log
          if ($LASTEXITCODE -ne 0 -or (Get-Content artifacts/ar061-fastlane/full-h2.log -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed') {
            throw 'Full H2 regression failed'
          }

          $nas = Join-Path $env:RUNNER_TEMP 'h2-ar061-nas-self-test'
          dotnet run --project .\tools\H2Notes.NasAcceptance\H2Notes.NasAcceptance.csproj -c Release --no-build -- --self-test $nas 2>&1 |
            Tee-Object artifacts/ar061-fastlane/nas-self-test.log
          if ($LASTEXITCODE) { throw 'NAS harness self-test failed' }

          if (git status --porcelain) { throw 'Dirty checkout after AR-061 tests.' }

      - name: Run all required Agent suites
        shell: pwsh
        run: .\tools\agent-reliability\run_agent_suites.ps1 -OutputDirectory artifacts/ar061-fastlane/all-agent-suites

      - name: Publish self-contained Windows x64
        shell: pwsh
        run: |
          dotnet publish .\src\H2Notes.Avalonia\H2Notes.Avalonia.csproj -c Release -r win-x64 --self-contained true -o .\artifacts\H2Notes-Avalonia-Portable
          @"
          Source branch: ${{ github.ref_name }}
          Source commit: ${{ github.sha }}
          Actions run: ${{ github.run_id }}
          Built UTC: $([DateTime]::UtcNow.ToString('O'))
          Task: AR-061
          Runner: windows-latest
          "@ | Set-Content -LiteralPath .\artifacts\H2Notes-Avalonia-Portable\SOURCE.txt -Encoding UTF8

      - name: Verify packaged Agent helpers start and answer IPC
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'h2-ar061-fastlane-packaged-helpers.json'
          $app = Resolve-Path .\artifacts\H2Notes-Avalonia-Portable\H2Notes.Avalonia.exe
          $process = Start-Process -FilePath $app -ArgumentList @('--verify-agent-helpers', $report) -WindowStyle Hidden -Wait -PassThru
          Get-Content -LiteralPath $report | Tee-Object artifacts/ar061-fastlane/packaged-helpers.json
          if ($process.ExitCode -ne 0) { throw 'Packaged Agent helpers failed startup/IPC verification.' }

      - name: Upload portable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H2Notes-Avalonia-Portable-win-x64-AR061-fastlane
          path: artifacts/H2Notes-Avalonia-Portable/
          if-no-files-found: error
          retention-days: 30

      - name: Upload AR-061 fastlane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AR061-fastlane-evidence
          path: artifacts/ar061-fastlane/
          if-no-files-found: error
          retention-days: 14
