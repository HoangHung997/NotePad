name: AR-022 Excel batch mutation validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h2-ar022-validation.yml'
      - 'experiments/H2AgentLab.OfficeProtocol/**'
      - 'experiments/H2AgentLab.OfficeHost/**'
      - 'experiments/H2AgentLab/Office/**'
      - 'experiments/H2AgentLab/Integration/**'
      - 'experiments/H2AgentLab/Runtime/**'
      - 'experiments/H2AgentLab/Tools/**'
      - 'tests/H2Notes.Tests/**'
      - 'tools/agent-reliability/validate_ar022.ps1'
permissions:
  contents: read
concurrency:
  group: h2-ar022-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  excel-batch:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate AR-022 E1-E2 and retained regressions
        shell: pwsh
        run: tools/agent-reliability/validate_ar022.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR022-E1-E2-Evidence
          path: artifacts/ar022/
          if-no-files-found: error
          retention-days: 14
