name: AR-066 verified partial checkpoint
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: [.github/workflows/h2-ar066-checkpoint.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: h2-ar066-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Read-only wait for the already running exact-source validation
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json,os,time,urllib.request
          deadline=time.monotonic()+480
          while True:
              runs=[]
              for number in [35895544765,35895550449]:
                  request=urllib.request.Request('https://api.github.com/repos/HoangHung997/NotePad/actions/runs/'+str(number),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'H2-AR066-checkpoint'})
                  with urllib.request.urlopen(request,timeout=30) as response: run=json.load(response)
                  assert run['head_sha']=='95d9aa2d0566a8e93d2b2be17a052fbb1182014f' and run['run_attempt']==1
                  runs.append(run)
              if all(run['status']=='completed' for run in runs):
                  assert all(run['conclusion']=='success' for run in runs),'Preserve failed run; no checkpoint acceptance upgrade'
                  break
              assert time.monotonic()<deadline,'Runs still pending; no mutation or rerun performed'
              time.sleep(20)
          print('Existing exact-source runs completed successfully; no jobs were started or retried by this step.')
      - name: Verify logs artifacts source identities and save docs-only handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '06f2b34aafe6b1dd2e3467e71f5e6741f272b61894952c1890fae21523401734  tools/agent-reliability/checkpoint_live_resource.py' | sha256sum --check --strict
          python tools/agent-reliability/checkpoint_live_resource.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR066-Verified-Partial-Checkpoint
          path: artifacts/ar066-checkpoint/
          if-no-files-found: error
          retention-days: 14
