name: AR-033 verdict consistency validation
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths:
      - experiments/H2AgentLab/**
      - tests/H2Notes.Tests/**
      - .github/workflows/h2-ar033-consistency.yml
      - tools/agent-reliability/verify_ar033_retained_control.py
      - tools/agent-reliability/retained-ar033-control/**
permissions:
  contents: read
concurrency:
  group: h2-ar033-consistency
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'HoangHung997/NotePad'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Exact source receipt and initial build
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar033-consistency | Out-Null
          if (git status --porcelain) { throw 'Dirty checkout' }
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';E1='Summary/detail contradiction and valid mixed batch';E2='Existing production registry, real temporary files, scripted transport and labelled fixture verifier';E3='NOT_RUN';E4='NOT_RUN';E5='AR-083 DEFERRED_BY_USER'} | ConvertTo-Json | Set-Content artifacts/ar033-consistency/identity.json
          python -c "import hashlib,json,pathlib,subprocess,zipfile; paths=subprocess.check_output(['git','ls-files'],text=True).splitlines(); selected=[p for p in paths if pathlib.Path(p).suffix.lower() in ['.cs','.csproj','.props','.targets','.md','.json','.yml','.yaml','.ps1','.slnx','.py']]; z=zipfile.ZipFile('artifacts/ar033-consistency/committed-source.zip','w',zipfile.ZIP_DEFLATED); rows=[]; [(z.writestr(p,b),rows.append({'path':p,'sha256':hashlib.sha256(b).hexdigest(),'blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()})) for p in selected for b in [subprocess.check_output(['git','show','HEAD:'+p])]]; z.close(); pathlib.Path('artifacts/ar033-consistency/source-receipt.json').write_text(json.dumps(rows,indent=2))"
          if ($LASTEXITCODE) { throw 'Source receipt failed' }
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE) { throw 'Restore failed' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar033-consistency/build.log
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Verify retained executed contradiction control without replacing evolved source
        id: control
        shell: pwsh
        run: |
          python tools/agent-reliability/verify_ar033_retained_control.py --output artifacts/ar033-consistency/retained-control.json
          if ($LASTEXITCODE) { throw 'Historical control or unchanged regression provenance failed' }
      - name: Rebuild current source and repeat all AR corpora
        id: corpora
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (git status --porcelain) { throw 'Read-only control provenance check changed source' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar033-consistency/rebuild.log
          if ($LASTEXITCODE) { throw 'Positive rebuild failed' }
          $failed=@()
          foreach($name in 'AR-033-1','AR-033-2','AR-033-3','AR-032','AR-031','AR-030','AR-020','AR-012','AR-011','AR-010','AR-001') {
            $env:H2_AR033_EVIDENCE_DIR=Join-Path $PWD "artifacts/ar033-consistency/$name"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $name.Substring(0,6) 2>&1 | Tee-Object "artifacts/ar033-consistency/$name.log"
            if ($LASTEXITCODE -ne 0 -or (Get-Content "artifacts/ar033-consistency/$name.log" -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed') { $failed+=$name }
          }
          @{failed=$failed} | ConvertTo-Json | Set-Content artifacts/ar033-consistency/corpora-result.json
          if ($failed.Count) { throw ('Failed corpora: '+($failed -join ',')) }
          python tools/agent-reliability/verify_ar033_retained_control.py --current-logs artifacts/ar033-consistency --output artifacts/ar033-consistency/retained-control.json
          if ($LASTEXITCODE) { throw 'Current regression no longer covers the exact historical contradiction cases' }
      - name: Independent Agent suites
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar033-consistency/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR033-Consistency-Evidence
          path: artifacts/ar033-consistency/
          if-no-files-found: error
          retention-days: 14
