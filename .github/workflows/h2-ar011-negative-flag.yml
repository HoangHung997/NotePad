name: AR-011 one-time negative-result compatibility repair
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/h2-ar011-negative-flag.yml']
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    env:
      AR_HEAD: ${{ github.event.pull_request.head.sha }}
      AR_BRANCH: feature/h2-agent-reliability-ar-000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply exact three-file reviewed text delta
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, zlib
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def require(ok,message):
              if not ok: raise RuntimeError(message)
          head=os.environ['AR_HEAD'];branch=os.environ['AR_BRANCH'];base='7ea7b0aaace2a0deb415f0bd68909738636c5040'
          require(git('rev-parse','HEAD')==head and not git('status','--porcelain'),'Wrong/dirty checkout')
          if 'MCP tool error keeps domain blocks' in Path('tests/H2Notes.Tests/H2AgentToolOutcomeTests.cs').read_text():
              print('Repair already saved; do not replay.');raise SystemExit(0)
          require(set(git('diff','--name-only',base,'HEAD').splitlines())=={'.github/workflows/h2-ar011-negative-flag.yml'},'Other work appeared')
          require(git('ls-remote','origin','refs/heads/'+branch).split()[0]==head,'Branch advanced')
          require(git('ls-remote','origin','refs/heads/main').split()[0]=='1283bc13e07c3cd47d04886166de3dfc595422c0','Main advanced')
          encoded=''
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          require(len(raw)<12000 and hashlib.sha256(raw).hexdigest()=='147472727043aaaa6919fff3db41fdae134a3e6f139c295a3de06858ec3a9154','Reviewed delta mismatch')
          es=json.loads(raw);require(len(es)==3,'Wrong path inventory');writes={}
          for e in es:
              p=Path(e['path']);require(not p.is_absolute() and '..' not in p.parts and p.suffix in ['.cs','.md'],'Out of scope')
              b=p.read_bytes();require(hashlib.sha256(b).hexdigest()==e['before'],'Source drift '+str(p));lines=b.decode().splitlines(keepends=True)
              for start,end,t in reversed(e['edits']):lines[start:end]=[t]
              a=''.join(lines).encode();require(hashlib.sha256(a).hexdigest()==e['after'],'Postimage mismatch');writes[str(p)]=a
          for p,a in writes.items():Path(p).write_bytes(a)
          subprocess.run(['git','add','--',*writes],check=True);require(set(git('diff','--cached','--name-only').splitlines())==set(writes),'Unexpected staged files');git('diff','--cached','--check')
          out=Path(os.environ['RUNNER_TEMP'])/'ar011-flag';out.mkdir(exist_ok=True);out.joinpath('source.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          require(git('ls-remote','origin','refs/heads/'+branch).split()[0]==head,'Concurrent work; retain patch')
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com');git('commit','-m','fix(AR-011): fail closed on MCP negative result controls');git('push','origin','HEAD:refs/heads/'+branch)
          code=git('rev-parse','HEAD');require(not git('status','--porcelain'),'Dirty tree');require(git('ls-remote','origin','refs/heads/'+branch).split()[0]==code,'Remote not saved')
          out.joinpath('identity.json').write_text(json.dumps({'code_sha':code,'working_tree':'CLEAN','acceptance':'NOT_RUN'},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('code='+code+'\n')
          PY
      - name: Run unchanged full required CI on saved code
        if: steps.repair.outputs.code != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/HoangHung997/NotePad/actions/workflows/avalonia-ci.yml/dispatches -f ref="$AR_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR011-Negative-Flag-Repair
          path: ${{ runner.temp }}/ar011-flag/
          if-no-files-found: warn
          retention-days: 14
