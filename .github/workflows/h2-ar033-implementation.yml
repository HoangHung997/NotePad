name: AR-033 completion implementation and validation
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: ['.github/workflows/h2-ar033-implementation.yml']
permissions:
  contents: read
concurrency:
  group: h2-ar033-implementation
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'HoangHung997/NotePad' && github.ref == 'refs/heads/feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    outputs:
      code: ${{ steps.save.outputs.code }}
    env:
      GH_TOKEN: ${{ github.token }}
      CHECKED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Save reviewed completion source on unchanged owned branch
        id: save
        shell: python
        run: |
          import base64,gzip,hashlib,io,json,os,pathlib,subprocess
          REPO='HoangHung997/NotePad';BRANCH='feature/h2-agent-reliability-ar-000'
          BASE='5465b8f1c1680edecbfe7f1c847460d85f19304a';MAIN='1283bc13e07c3cd47d04886166de3dfc595422c0'
          WORKFLOW='.github/workflows/h2-ar033-implementation.yml'
          def require(ok,msg):
              if not ok: raise RuntimeError(msg)
          def git(*args): return subprocess.check_output(['git',*args],text=True,timeout=90).strip()
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          head=os.environ['CHECKED_HEAD']
          require(git('rev-parse','HEAD')==head and not git('status','--porcelain'),'Wrong or dirty checkout')
          require(git('rev-parse','HEAD^')==BASE and git('diff','--name-only',BASE,head)==WORKFLOW,'Other work appeared; reconcile without reset')
          require(git('ls-remote','origin','refs/heads/main').split()[0]==MAIN,'Main advanced')
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'Branch advanced')
          chunks=[]
          for sha in ['c887230cd291d14ecb8de82b8ad8d6fce40b04d2','669fcd50f364efc412eeefdf7d6c409326401c86','8f0cee16ef8e3b55bb81064cf3bcef0899d9d405','69f3c81b7b6f2864d249437120b473cff5e541a8','5c3b5a9d0d4dc5e62671b19308ffb1d85b877348','583b2a67f5eadc44c6ffc11c0804c4494b5111fa','80875e0d2002a912b86ce192067913a9bb13d316','9c702549f926a97f734adb49337ad1bb82cbf936']:
              response=json.loads(subprocess.check_output(['gh','api','repos/'+REPO+'/git/blobs/'+sha],timeout=60))
              data=base64.b64decode(response['content']);require(blob(data)==sha and len(data)<=3000,'Reviewed transport chunk mismatch');chunks.append(data)
          compressed=base64.b64decode(b''.join(chunks),validate=True);require(len(compressed)==17694,'Compressed size differs')
          with gzip.GzipFile(fileobj=io.BytesIO(compressed)) as source:
              patch=source.read(68472);require(len(patch)==68471 and source.read(1)==b'','Patch size differs')
          require(hashlib.sha256(patch).hexdigest()=='8051b00f00ed3ea0a85db299c08ea9bb02e41702dac38602559e4f73773b2faa','Reviewed patch differs')
          entries=[
              ('docs/H2_AGENT_RELIABILITY_IMPLEMENTATION_TASKS.md','1fc1bf44e7aa205a96081e1ba2da74f4b2e8a681','f18298f4e497512faedb087e34807046f4e0ee17'),
              ('docs/agent-reliability/AR-033/implementation.md',None,'2d24277ff99e8314b3b528a20969177e5ccb4c07'),
              ('experiments/H2AgentLab/Integration/H2ProductionAgentAdapter.cs','c7977adba9e1d2a60d2a4ca5bd1e77a99b065e0f','6ff9046236acad09d588a734311d0b0b9ebabb2d'),
              ('experiments/H2AgentLab/Runtime/AgentCompletionAssessment.cs',None,'38c6d5d2848ed4fd9d1685d06feedd1cba0a42e9'),
              ('experiments/H2AgentLab/Runtime/AgentRuntime.cs','5c49ba8b37215f443b426cc4bd097f1c8c1c9d8e','c928d3aeecd40a878a916128e32fbc6f09216c70'),
              ('experiments/H2AgentLab/Runtime/AgentRuntimeDomainVerification.cs','e32274fbf917de6699fe54b88dfe99cfed784e8c','b475ee1e1a510cd3d9dcaf9b23fc84983ea79734'),
              ('experiments/H2AgentLab/Runtime/AgentRuntimeEvidence.cs','22cc2079d6afac45405285ec42db9d7e1d12b55f','188631820de405dfd3bde54355b73f2479282def'),
              ('experiments/H2AgentLab/Verification/VerificationCompletionGate.cs','2b773ce8537ea8146c08b25df69e037a751fec3c','9fa74abf0d2b408dd04878cafb511c047b659adf'),
              ('experiments/H2AgentLab/Verification/VerificationReport.cs','8fe47f308a93a01d5849e887455224362e3042f2','4b87fa9e1c3ac7b34193f9f6b612422fbb5e6785'),
              ('src/H2Notes.Core/H2AgentAdapter.cs','147ad42cb4c7b7b7d30d8bfd53652956a82ef834','d730b368d0dc9d53f97f67da3780a4f93110ca41'),
              ('src/H2Notes.Core/H2AgentCompletionAssessment.cs',None,'65f560a619aac2b3a029a853fb0540ca03697f75'),
              ('tests/H2Notes.Tests/H2AgentCompletionTests.cs',None,'0dbdc21bbd55794d551ddca3d178779e0c69781a'),
              ('tests/H2Notes.Tests/H2AgentGoalRevisionTests.cs','7f9bf6ba17d118fd7c59a81adb08a756c79b0142','3f7bb825b60d74c0937e79f1c57b631bf00e82f4'),
              ('tests/H2Notes.Tests/Program.cs','02c419ca78f1095c13eb37113921890d110d4d11','e5f3f56b6668c9d0bbd597eb260e74cf3dd4431d')]
          for path,old,new in entries:
              p=pathlib.Path(path);require((blob(p.read_bytes()) if p.exists() else None)==old,'Preimage differs: '+path)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ar033-source';out.mkdir()
          patchfile=out/'reviewed.patch';patchfile.write_bytes(patch)
          subprocess.run(['git','apply','--index','--check',str(patchfile)],check=True)
          subprocess.run(['git','apply','--index',str(patchfile)],check=True)
          for path,old,new in entries: require(blob(pathlib.Path(path).read_bytes())==new,'Postimage differs: '+path)
          require(set(git('diff','--cached','--name-only').splitlines())=={e[0] for e in entries},'Unexpected stage')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'Concurrent branch work')
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','commit','-m','feat(AR-033): preserve whole-goal verification and evidence-bound alternate recovery'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+BRANCH],check=True,timeout=120)
          code=git('rev-parse','HEAD');require(not git('status','--porcelain') and git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==code,'Save not verified')
          (out/'saved.json').write_text(json.dumps({'code_sha':code,'base':BASE,'entries':entries,'working_tree':'CLEAN','tests':'NOT_RUN_AT_SAVE'},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('code='+code+'\n')
          print('Saved AR-033 source:',code)
      - name: Dispatch unchanged full Avalonia workflow
        run: gh api -X POST repos/HoangHung997/NotePad/actions/workflows/avalonia-ci.yml/dispatches -f ref=feature/h2-agent-reliability-ar-000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR033-Source-Delivery
          path: ${{ runner.temp }}/ar033-source/
          if-no-files-found: error
          retention-days: 14
  validation:
    needs: integrate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.code }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record exact source and build
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar033 | Out-Null
          if (git status --porcelain) { throw 'Dirty checkout' }
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';E1='Completion policy proof and isolation';E2='Production registry/local files with scripted transport and labelled criterion verifier';E3='NOT_RUN';E4='NOT_RUN';E5='AR-083 DEFERRED_BY_USER'} | ConvertTo-Json | Set-Content artifacts/ar033/identity.json
          dotnet --info | Set-Content artifacts/ar033/dotnet-info.txt
          python -c "import hashlib,json,pathlib,subprocess,zipfile; paths=subprocess.check_output(['git','ls-files'],text=True).splitlines(); selected=[p for p in paths if pathlib.Path(p).suffix.lower() in ['.cs','.csproj','.props','.targets','.md','.json','.yml','.yaml','.ps1','.slnx']]; z=zipfile.ZipFile('artifacts/ar033/committed-source.zip','w',zipfile.ZIP_DEFLATED); rows=[]; [(z.writestr(p,b),rows.append({'path':p,'sha256':hashlib.sha256(b).hexdigest(),'blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()})) for p in selected for b in [subprocess.check_output(['git','show','HEAD:'+p])]]; z.close(); pathlib.Path('artifacts/ar033/source-receipt.json').write_text(json.dumps(rows,indent=2))"
          if ($LASTEXITCODE) { throw 'Source receipt failed' }
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE) { throw 'Restore failed' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar033/build.log
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Repeat completion and all retained corpora
        id: corpora
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $failed=@()
          foreach($name in 'AR-033-1','AR-033-2','AR-033-3','AR-032','AR-031','AR-030','AR-020','AR-012','AR-011','AR-010','AR-001') {
            $env:H2_AR033_EVIDENCE_DIR=Join-Path $PWD "artifacts/ar033/$name"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $name.Substring(0,6) 2>&1 | Tee-Object "artifacts/ar033/$name.log"
            if ($LASTEXITCODE -ne 0 -or (Get-Content "artifacts/ar033/$name.log" -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed') { $failed+=$name }
          }
          @{failed=$failed} | ConvertTo-Json | Set-Content artifacts/ar033/corpora-result.json
          if ($failed.Count) { throw ('Failed corpora: '+($failed -join ',')) }
      - name: Run mandatory independent Agent suites
        if: success() || steps.corpora.outcome == 'failure'
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar033/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR033-E1-E2-Evidence
          path: artifacts/ar033/
          if-no-files-found: error
          retention-days: 14
