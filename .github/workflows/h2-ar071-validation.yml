name: AR-071 adapter trial validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h2-ar071-validation.yml'
      - 'experiments/H2AgentLab/Plugins/**'
      - 'tests/H2Notes.Tests/H2AdapterTrialTests.cs'
      - 'tests/H2Notes.Tests/H2AgentFinalHandoffAuditTests.cs'
      - 'tests/H2Notes.Tests/Program.cs'
      - 'docs/H2_AGENT_RELIABILITY_IMPLEMENTATION_TASKS.md'
      - 'docs/agent-reliability/AR-090/FINAL_HANDOFF_REPORT.md'
      - 'tools/agent-reliability/validate_ar071.ps1'
permissions:
  contents: read
concurrency:
  group: h2-ar071-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  adapter-trial:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate AR-071 E1-E2 and retained regressions
        shell: pwsh
        run: tools/agent-reliability/validate_ar071.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR071-E1-E2-Evidence
          path: artifacts/ar071/
          if-no-files-found: error
          retention-days: 14
