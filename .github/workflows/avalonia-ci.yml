name: Avalonia CI

on:
  push:
    branches:
      - main
      - feature/nas-multi-device-sync
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Avalonia solution
        run: dotnet restore .\H2Notes.Avalonia.slnx

      - name: Build Avalonia solution
        run: dotnet build .\H2Notes.Avalonia.slnx -c Release --no-restore

      - name: Run H2 Notes tests
        run: dotnet run --project .\tests\H2Notes.Tests\H2Notes.Tests.csproj -c Release --no-build

      - name: Upload Avalonia build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H2Notes-Avalonia-Release
          path: src/H2Notes.Avalonia/bin/Release/net10.0/
          if-no-files-found: warn
