name: AR-064 reviewed foundation delivery
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: [.github/workflows/h2-ar064-foundation-delivery.yml]
permissions:
  contents: write
concurrency:
  group: ar064-source-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'HoangHung997/NotePad'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/h2-agent-reliability-ar-000
          fetch-depth: 0
      - name: Apply exact reviewed sources without replacing concurrent work
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64,datetime,hashlib,json,os,pathlib,re,subprocess,urllib.request,zlib
          out=pathlib.Path('artifacts/ar064-delivery');out.mkdir(parents=True,exist_ok=True)
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          head=git('rev-parse','HEAD')
          assert head==os.environ['GITHUB_SHA'],'Concurrent branch change; do not overwrite'
          assert git('rev-parse','HEAD^')=='3fea09c069e5421c68a2e880f909fb38aa708c21','Unexpected baseline'
          assert not git('status','--porcelain'),'Dirty checkout'
          def blob(sha):
              req=urllib.request.Request('https://api.github.com/repos/HoangHung997/NotePad/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response: item=json.load(response)
              value=base64.b64decode(item['content']);assert hashlib.sha1(b'blob '+str(len(value)).encode()+b'\0'+value).hexdigest()==sha
              return value
          # Standard compressed patch transport, not an executable package. The decoded patch,
          # exact bytes and allowed paths are checked and saved for inspection before applying.
          encoded=blob('895013d9895d134696defdafb8713f19665df9ed')+blob('29b5c6dc2a9b0dae953e4018ce01aa54d4ec14bb')
          packed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(packed).hexdigest()=='45ae46cd987f49a193f90a064a4dba9817ab61b5c6c71bcd80e04878963d3b8b'
          decoder=zlib.decompressobj();patch=decoder.decompress(packed,100000)
          assert decoder.eof and not decoder.unused_data and len(patch)==79434
          assert hashlib.sha256(patch).hexdigest()=='606435d8e907b7301911a120ea6686d0f35a18b30dc253b99839065d6d61ceaf'
          patchfile=out/'reviewed.patch';patchfile.write_bytes(patch)
          allowed={'experiments/H2AgentLab/Plugins/PluginManager.Lifecycle.cs','experiments/H2AgentLab/Plugins/PluginManager.cs','experiments/H2AgentLab/Providers/CapabilityProviderManager.cs','experiments/H2AgentLab/Providers/CapabilityProviderToolRegistryAdapter.cs','experiments/H2AgentLab/Tools/ToolRegistry.cs','tests/H2Notes.Tests/H2AgentChatSurfaceTests.cs','tests/H2Notes.Tests/H2AgentPluginLifecycleTests.cs','tests/H2Notes.Tests/Program.cs'}
          names=set(re.findall(r'^\+\+\+ b/(.+)$',patch.decode(),re.M));assert names==allowed
          subprocess.run(['git','apply','--check','--index',str(patchfile)],check=True)
          subprocess.run(['git','apply','--index',str(patchfile)],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==allowed
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','fix(AR-064): atomic registry updates, revoked plugin/provider executors and awaited fixture cleanup'],check=True)
          code=git('rev-parse','HEAD')
          p=pathlib.Path('docs/H2_AGENT_RELIABILITY_IMPLEMENTATION_TASKS.md');text=p.read_text(encoding='utf-8-sig')
          match=re.search(r'## 7\. SESSION HANDOFF.*?```yaml\s*(\{.*?\})\s*```',text,re.S);assert match,'Canonical handoff not found'
          handoff=json.loads(match.group(1));assert handoff['active_task']=='AR-064'
          handoff.update(phase='AR-064_FOUNDATION_AWAITING_CI',implementation_status='ACTIVE / PARTIAL',acceptance_status='NOT_RUN',last_code_commit=code,owner_session='chatgpt-ar064-resume-2026-09-23',working_tree='Isolated delivery checkout clean after commit; user-PC working tree NOT_ACCESSIBLE.',uncommitted_files=[],checkpoint_saved_at_utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),completed_this_session=[])
          handoff['remaining_in_active_task']=['Build and execute new lifecycle corpus plus chat cleanup regression; retain all AR and Agent suites.','Complete product-used plugin/provider package composition, version pinning, real local package execution and RC-28 before acceptance. Foundation alone is not DONE.']
          handoff['last_validation_result']='NEW_CODE_NOT_RUN; prior HEAD full CI 35836793456 had 1001 pass / 1 chat fixture cleanup failure'
          handoff['last_test_commands']=[{'command':'Windows build + AR-064 / chat / retained AR / independent Agent suites + full CI','sha':code,'result':'NOT_RUN'}]
          handoff['next_exact_action']='Continue only AR-064 on existing branch/PR #3. Add/run read-only validation on exact new source, repair every failure, finish production lifecycle and real trusted local package RC-28; do not close native gates or merge main.'
          text=text[:match.start(1)]+json.dumps(handoff,ensure_ascii=False,indent=2)+text[match.end(1):]
          text=text.replace('### [ ] AR-064 —','### [~] AR-064 —')
          lines=text.splitlines();lines=[line.rsplit('NOT_STARTED',1)[0]+'ACTIVE / PARTIAL |' if line.startswith('| AR-064 |') and 'NOT_STARTED' in line else line for line in lines]
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          subprocess.run(['git','add',str(p)],check=True)
          subprocess.run(['git','commit','-m','docs(AR-064): save actual foundation source SHA and pending production/CI gates'],check=True)
          assert not git('status','--porcelain'),'Unexpected uncommitted source'
          remote=git('ls-remote','origin','refs/heads/feature/h2-agent-reliability-ar-000').split()[0]
          assert remote==head,'Concurrent remote update; keep local commits without force-push'
          subprocess.run(['git','push','origin','HEAD:refs/heads/feature/h2-agent-reliability-ar-000'],check=True)
          (out/'saved.json').write_text(json.dumps({'baseline':'3fea09c069e5421c68a2e880f909fb38aa708c21','code_sha':code,'saved_head':git('rev-parse','HEAD'),'state':'ACTIVE / PARTIAL / NOT_RUN','paths':sorted(allowed)},indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR064-Source-Delivery
          path: artifacts/ar064-delivery/
          if-no-files-found: error
          retention-days: 14
