name: AR-010 shared runtime validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h2-ar010-validation.yml'
      - 'tools/agent-reliability/ar010_*'
permissions:
  contents: read
concurrency:
  group: h2-ar010-validation
  cancel-in-progress: false
jobs:
  delivery:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    outputs:
      code_sha: ${{ steps.apply.outputs.code_sha }}
    env:
      AR_BRANCH: feature/h2-agent-reliability-ar-000
      AR_HEAD: ${{ github.event.pull_request.head.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Apply only the exact reviewed AR-010 source and tests
        id: apply
        run: python3 tools/agent-reliability/ar010_apply.py
      - name: Dispatch existing full Avalonia CI on saved branch
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/heads/$AR_BRANCH | cut -f1)" = '${{ steps.apply.outputs.code_sha }}'
          gh api --method POST repos/HoangHung997/NotePad/actions/workflows/avalonia-ci.yml/dispatches -f ref="$AR_BRANCH"
      - name: Retain delivery identity and any scoped patch
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ar010-delivery"
          git rev-parse HEAD > "$RUNNER_TEMP/ar010-delivery/checkout-sha.txt"
          git status --porcelain > "$RUNNER_TEMP/ar010-delivery/working-tree.txt"
          git diff HEAD --binary > "$RUNNER_TEMP/ar010-delivery/uncommitted.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR010-Delivery
          path: ${{ runner.temp }}/ar010-delivery/
          if-no-files-found: error
          retention-days: 14
  runtime-tests:
    needs: delivery
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.delivery.outputs.code_sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Record identity and build actual solution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'ar010-evidence'
          New-Item -ItemType Directory -Force $out | Out-Null
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne '${{ needs.delivery.outputs.code_sha }}') { throw 'Unexpected tested source SHA' }
          if (git status --porcelain) { throw 'Dirty test checkout' }
          @{code_sha=$sha; working_tree='CLEAN'; evidence='E1/E2 only'; model='Scripted transport, no external model'; native_office='NOT_RUN'; E4='AWAITING_ENVIRONMENT'; E5='DEFERRED_BY_USER'} | ConvertTo-Json | Set-Content (Join-Path $out 'identity.json')
          dotnet restore H2Notes.Avalonia.slnx 2>&1 | Tee-Object -FilePath (Join-Path $out 'restore.log')
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object -FilePath (Join-Path $out 'build.log')
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Repeat concrete Global Project Lab and cancellation corpus
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'ar010-evidence'
          foreach ($iteration in 1..3) {
            $env:H2_AR010_EVIDENCE_DIR = Join-Path $out ('iteration-' + $iteration)
            New-Item -ItemType Directory -Force $env:H2_AR010_EVIDENCE_DIR | Out-Null
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter AR-010 2>&1 | Tee-Object -FilePath (Join-Path $env:H2_AR010_EVIDENCE_DIR 'tests.log')
            if ($LASTEXITCODE -ne 0) { throw ('AR-010 failed iteration ' + $iteration) }
          }
          dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter AR-001 2>&1 | Tee-Object -FilePath (Join-Path $out 'ar001-regression.log')
          if ($LASTEXITCODE -ne 0) { throw 'AR-001 regression failed' }
      - name: Run every required Agent suite with aggregate failure status
        shell: pwsh
        run: |
          & tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'ar010-evidence/all-agent-suites')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR010-E1-E2-Evidence
          path: ${{ runner.temp }}/ar010-evidence/
          if-no-files-found: error
          retention-days: 14
