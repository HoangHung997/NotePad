name: AR-063 CAD closed-live scope validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h2-ar063-validation.yml'
      - 'experiments/H2AgentLab/Cad/**'
      - 'experiments/H2AgentLab/Integration/H2AutoCadFileTools.cs'
      - 'experiments/H2AgentLab/Integration/H2AutoCadLiveTools.cs'
      - 'experiments/H2AgentLab/Integration/H2ProductionToolSession*.cs'
      - 'experiments/H2AgentLab/Integration/H2ProductionAgentAdapter*.cs'
      - 'experiments/H2AgentLab/Acceptance/MbAutoCadAcceptanceTests.cs'
      - 'tests/H2Notes.Tests/H2AutoCadLiveBridgeTests.cs'
      - 'tests/H2Notes.Tests/H2ProductAcceptanceScenarioTests.cs'
      - 'tests/H2Notes.Tests/Program.cs'
      - 'tools/agent-reliability/validate_ar063.ps1'
permissions:
  contents: read
concurrency:
  group: h2-ar063-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  cad-scope:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate AR-063 E1-E2 and retained regressions
        shell: pwsh
        run: tools/agent-reliability/validate_ar063.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR063-E1-E2-Evidence
          path: artifacts/ar063/
          if-no-files-found: error
          retention-days: 14
