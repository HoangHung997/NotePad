name: AR-010 one-time documentation checkpoint
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/h2-ar010-handoff.yml']
permissions:
  contents: read
concurrency:
  group: h2-ar010-doc-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000' && github.actor == 'HoangHung997'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      AR_HEAD: ${{ github.event.pull_request.head.sha }}
      AR_BRANCH: feature/h2-agent-reliability-ar-000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 8
      - name: Run the pinned documentation-only finalizer with safe byte capture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'REPAIR'
          import os, subprocess, textwrap
          from pathlib import Path
          # Reuse the already-reviewed exact script, not an arbitrary current-branch script.
          ref = '2367fe0601157f54862da8dbc749111716b13bd9:.github/workflows/h2-ar010-handoff.yml'
          sha = subprocess.check_output(['git', 'rev-parse', ref], text=True).strip()
          if sha != '91d9ff0376ec7420b82d74516cc6f7a5721c69e7': raise RuntimeError('Pinned documentation script changed')
          raw = subprocess.check_output(['git', 'show', ref], text=True)
          script = textwrap.dedent(raw.split("          python3 - <<'PY'\n", 1)[1].split('\n          PY\n', 1)[0])
          old = "['gh', 'api', 'repos/HoangHung997/NotePad/actions/jobs/106650670642/logs']"
          if script.count(old) != 1: raise RuntimeError('Unexpected log-capture anchor')
          # gh protects terminals against control sequences. These bytes are captured into a
          # Python pipe, hashed and saved as evidence; never printed, interpreted or executed.
          script = script.replace(old, "['gh', 'api', 'repos/HoangHung997/NotePad/actions/jobs/106650670642/logs', '--allow-escape-sequences']", 1)
          script = script.replace('--filter AR-010 (3 iterations)', '--filter AR-010')
          anchor = 'text = TRACKER.read_text()'
          if script.count(anchor) != 1: raise RuntimeError('Unexpected manifest anchor')
          script = script.replace(anchor, "manifest['documentation_attempts'] = [{'run': 35699526800, 'result': 'FAILED_BEFORE_WRITES', 'cause': 'gh refused raw job logs containing ANSI controls; no runtime/test change or acceptance downgrade.', 'repair': 'Capture bytes through Python PIPE with documented flag; never print raw controls.'}]\n" + anchor, 1)
          out = Path(os.environ['RUNNER_TEMP']) / 'ar010-handoff'; out.mkdir(exist_ok=True)
          (out / 'finalizer-origin.txt').write_text(ref + '\n' + sha + '\n')
          exec(compile(script, 'pinned_ar010_documentation_finalizer', 'exec'), {})
          REPAIR
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR010-Saved-Handoff
          path: ${{ runner.temp }}/ar010-handoff/
          if-no-files-found: error
          retention-days: 14
