name: AR-011 one-time observed regression repair
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/h2-ar011-review.yml']
permissions:
  contents: read
concurrency:
  group: ar011-reviewed-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    env:
      AR_HEAD: ${{ github.event.pull_request.head.sha }}
      AR_BRANCH: feature/h2-agent-reliability-ar-000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply reviewed eight-file text delta only
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, zlib
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def require(ok, message):
              if not ok: raise RuntimeError(message)
          head=os.environ['AR_HEAD']; branch=os.environ['AR_BRANCH']; base='4459be5d0e2a0c22e466c1b5a52785a64ce2a2e5'
          require(git('rev-parse','HEAD')==head and not git('status','--porcelain'),'Wrong/dirty checkout')
          if 'legacy denial retains its code' in Path('tests/H2Notes.Tests/H2AgentToolOutcomeTests.cs').read_text():
              print('Review repair already saved; no replay or checkpoint overwrite.'); raise SystemExit(0)
          require(git('ls-remote','origin','refs/heads/'+branch).split()[0]==head,'Branch advanced; reconcile first')
          require(git('ls-remote','origin','refs/heads/main').split()[0]=='1283bc13e07c3cd47d04886166de3dfc595422c0','Main advanced')
          require(set(git('diff','--name-only',base,'HEAD').splitlines())=={'.github/workflows/h2-ar011-review.yml'},'Other work appeared')
          encoded=''
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          require(len(raw)<20000 and hashlib.sha256(raw).hexdigest()=='0a8fe4f030d3ea6d2ff9deff02548ed01856e74609e4df46f46a961ab022119d','Reviewed delta mismatch')
          entries=json.loads(raw);require(len(entries)==8,'Wrong source inventory');writes={}
          for e in entries:
              p=Path(e['path']);require(not p.is_absolute() and '..' not in p.parts and p.parts[0] in ['src','experiments','tests','docs'],'Out of scope')
              before=p.read_bytes();require(hashlib.sha256(before).hexdigest()==e['before'],'Source drift: '+str(p))
              lines=before.decode().splitlines(keepends=True)
              for start,end,text in reversed(e['edits']):lines[start:end]=[text]
              after=''.join(lines).encode();require(hashlib.sha256(after).hexdigest()==e['after'],'Postimage mismatch')
              writes[str(p)]=after
          for p,data in writes.items():Path(p).write_bytes(data)
          subprocess.run(['git','add','--',*writes],check=True)
          require(set(git('diff','--cached','--name-only').splitlines())==set(writes),'Unexpected staged files')
          git('diff','--cached','--check')
          out=Path(os.environ['RUNNER_TEMP'])/'ar011-review';out.mkdir(exist_ok=True)
          out.joinpath('source.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          require(git('ls-remote','origin','refs/heads/'+branch).split()[0]==head,'Concurrent work; retain patch')
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','fix(AR-011): retain denial reasons and align ticker with observed effects')
          git('push','origin','HEAD:refs/heads/'+branch)
          code=git('rev-parse','HEAD');require(not git('status','--porcelain'),'Dirty final tree')
          require(git('ls-remote','origin','refs/heads/'+branch).split()[0]==code,'Push not verified')
          out.joinpath('identity.json').write_text(json.dumps({'code_sha':code,'working_tree':'CLEAN','files':list(writes),'acceptance':'NOT_RUN'},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('code='+code+'\n')
          print('Saved reviewed repair',code)
          PY
      - name: Dispatch full required CI without weakening any assertion
        if: steps.repair.outputs.code != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/HoangHung997/NotePad/actions/workflows/avalonia-ci.yml/dispatches -f ref="$AR_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR011-Reviewed-Repair
          path: ${{ runner.temp }}/ar011-review/
          if-no-files-found: warn
          retention-days: 14
