name: AR-012 review controls
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/h2-ar012-review.yml']
permissions:
  contents: read
concurrency:
  group: h2-ar012-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  delivery:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    env:
      AR_HEAD: ${{ github.event.pull_request.head.sha }}
      AR_BRANCH: feature/h2-agent-reliability-ar-000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply pinned review with exact payload and source guards
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          if 'captured selection identity never exposes plaintext' in Path('tests/H2Notes.Tests/H2AgentLiveBindingTests.cs').read_text():
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('sha='+os.environ['AR_HEAD']+'\n')
              print('Review already transferred; this job does not overwrite later work.')
              raise SystemExit(0)
          # Pinned, previously reviewed transfer code. Correct one transport character only;
          # the decompressed patch SHA256 and exact source preimages are still mandatory.
          original=subprocess.check_output(['git','show','3b367cd608994110df6e18da57515de664d72cd9:.github/workflows/h2-ar012-review.yml'],text=True)
          script=original.split("          python3 - <<'PY'\n",1)[1].split('\n          PY\n',1)[0]
          script='\n'.join(line[10:] for line in script.splitlines())
          if script.count('bW1tf7e')!=1:raise RuntimeError('Unexpected pinned transfer bytes')
          script=script.replace('bW1tf7e','bW1vf7e',1)
          marker="subprocess.run(['git','add','--',*paths],check=True);"
          if script.count(marker)!=1:raise RuntimeError('Unexpected staging boundary')
          extra="""desktop='experiments/H2AgentLab/Integration/H2ProductionToolSession.Desktop.cs'
          target=Path(desktop);content=target.read_text()
          old='if (!(_captureValidator ?? H2CapturedWindowIdentity.IsCurrent)(captured))'
          require(content.count(old)==1,'Desktop preimage changed')
          content=content.replace(old,'if (!H2CapturedWindowIdentity.IsCurrent(captured))',1)
          target.write_text(content);paths.append(desktop)
          """
          script=script.replace(marker,extra+marker,1)
          exec(compile(script,'pinned-ar012-review','exec'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('changed=true\n')
          PY
      - name: Dispatch existing full required CI
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run avalonia-ci.yml --ref "$AR_BRANCH"
  tests:
    needs: delivery
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.delivery.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build exact source and record identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar012-review | Out-Null
          if(git status --porcelain){throw 'Dirty checkout'}
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';level='E1/E2 controlled fixtures only; desktop IPC is fixture mode, no native Office/model'} | ConvertTo-Json | Set-Content artifacts/ar012-review/identity.json
          dotnet restore H2Notes.Avalonia.slnx
          if($LASTEXITCODE){throw 'Restore failed'}
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar012-review/build.log
          if($LASTEXITCODE){throw 'Build failed'}
      - name: Repeat AR-012 and retained regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fail=@()
          foreach($name in 'AR-012-1','AR-012-2','AR-012-3','AR-011','AR-010','AR-001'){
            $task=$name.Substring(0,6);$log="artifacts/ar012-review/$name.log"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $task 2>&1 | Tee-Object $log
            if($LASTEXITCODE -ne 0 -or (Get-Content $log -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed'){$fail+=$name}
          }
          if($fail.Count){throw ('Failed corpus: '+($fail -join ', '))}
      - name: All mandatory Agent suites
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar012-review/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR012-Review-E1-E2-Evidence
          path: artifacts/ar012-review/
          if-no-files-found: error
          retention-days: 14
