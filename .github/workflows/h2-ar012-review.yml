name: AR-012 review controls
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/h2-ar012-review.yml']
permissions:
  contents: read
concurrency:
  group: h2-ar012-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  delivery:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    outputs:
      sha: ${{ steps.apply.outputs.sha }}
    env:
      AR_HEAD: ${{ github.event.pull_request.head.sha }}
      AR_BRANCH: feature/h2-agent-reliability-ar-000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply only three exact reviewed files
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib,os,subprocess
          from pathlib import Path
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          def require(value,message):
              if not value:raise RuntimeError(message)
          head=os.environ['AR_HEAD'];branch=os.environ['AR_BRANCH'];base='3f9694abed4e8066544e98075f1e748dc432a02c'
          require(git('rev-parse','HEAD')==head and not git('status','--porcelain'),'Unexpected/dirty tree')
          require(git('ls-remote','origin','refs/heads/'+branch).split()[0]==head,'Concurrent branch update')
          require(git('ls-remote','origin','refs/heads/main').split()[0]=='1283bc13e07c3cd47d04886166de3dfc595422c0','Main advanced')
          require(not git('diff','--name-only',base,'HEAD','--','src','experiments','tests','docs'),'Source changed; reconcile first')
          data=''
          patch=gzip.decompress(base64.b64decode(data));require(hashlib.sha256(patch).hexdigest()=='4ef35557e81468b9bc313d5c66dedcb72a286ba75fdf2219ae9f4cb6e83178cb','Patch hash mismatch')
          paths=['experiments/H2AgentLab/Integration/H2ProductionToolSession.cs','src/H2Notes.Core/H2AgentResourceBinding.cs','tests/H2Notes.Tests/H2AgentLiveBindingTests.cs']
          require({line.split(' b/',1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')}==set(paths),'Patch scope changed')
          subprocess.run(['git','apply','--check'],input=patch,check=True);subprocess.run(['git','apply'],input=patch,check=True)
          subprocess.run(['git','add','--',*paths],check=True);subprocess.run(['git','diff','--cached','--check'],check=True)
          require(set(git('diff','--cached','--name-only').splitlines())==set(paths),'Unexpected staged files')
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','test(AR-012): verify permitted selection and desktop IPC with private identity tokens')
          require(git('ls-remote','origin','refs/heads/'+branch).split()[0]==head,'Concurrent update; keep local diff')
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          saved=git('rev-parse','HEAD');require(not git('status','--porcelain'),'Dirty final tree')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('sha='+saved+'\n')
          print('Saved reviewed candidate:',saved)
          PY
      - name: Dispatch existing full required CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run avalonia-ci.yml --ref "$AR_BRANCH"
  tests:
    needs: delivery
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.delivery.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build exact source and record identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar012-review | Out-Null
          if(git status --porcelain){throw 'Dirty checkout'}
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';level='E1/E2 controlled fixtures only; desktop IPC is fixture mode, no native Office/model'} | ConvertTo-Json | Set-Content artifacts/ar012-review/identity.json
          dotnet restore H2Notes.Avalonia.slnx
          if($LASTEXITCODE){throw 'Restore failed'}
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar012-review/build.log
          if($LASTEXITCODE){throw 'Build failed'}
      - name: Repeat AR-012 and retained regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fail=@()
          foreach($name in 'AR-012-1','AR-012-2','AR-012-3','AR-011','AR-010','AR-001'){
            $task=$name.Substring(0,6);$log="artifacts/ar012-review/$name.log"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $task 2>&1 | Tee-Object $log
            if($LASTEXITCODE -ne 0 -or (Get-Content $log -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed'){$fail+=$name}
          }
          if($fail.Count){throw ('Failed corpus: '+($fail -join ', '))}
      - name: All mandatory Agent suites
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar012-review/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR012-Review-E1-E2-Evidence
          path: artifacts/ar012-review/
          if-no-files-found: error
          retention-days: 14
