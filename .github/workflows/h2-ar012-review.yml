name: AR-012 bounded Word revision review
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/h2-ar012-review.yml']
permissions:
  contents: read
concurrency:
  group: h2-ar012-word-review
  cancel-in-progress: false
jobs:
  delivery:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    outputs:
      code_sha: ${{ steps.apply.outputs.code_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply four reviewed files only from exact preimages
        id: apply
        env:
          AR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib, subprocess, textwrap
          raw = subprocess.check_output(["git", "show", "231f0d6522658b58f56808e0f0b67c68829f1011:.github/workflows/h2-ar012-review.yml"])
          if hashlib.sha1(("blob " + str(len(raw)) + "\0").encode() + raw).hexdigest() != "afab1637f66f012c9c6be5766fc7c30e212ebef7":
              raise RuntimeError("Pinned transfer source changed")
          body = raw.decode("utf-8").split("          python3 - <<'PYTHON'\n", 1)[1].split("\n          PYTHON", 1)[0]
          # Correct only the verified transcription error; the original decompressed patch SHA and
          # four-file preimage/branch guards are unchanged and must pass before any repository write.
          if body.count("HWKjYF4b3aU") != 1: raise RuntimeError("Unexpected transfer correction")
          body = body.replace("HWKjYF4b3aU", "HWKjYF93aU")
          exec(compile(textwrap.dedent(body), "pinned-ar012-delivery", "exec"))
          PYTHON
      - name: Dispatch unchanged full required CI on the saved source
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.apply.outputs.code_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feature/h2-agent-reliability-ar-000 | cut -f1)" = "$CODE"
          gh api -X POST repos/HoangHung997/NotePad/actions/workflows/avalonia-ci.yml/dispatches -f ref=feature/h2-agent-reliability-ar-000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR012-Word-Review-Delivery
          path: ${{ runner.temp }}/ar012-delivery/
          if-no-files-found: error
          retention-days: 14
  tests:
    needs: delivery
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.delivery.outputs.code_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Reproduce old Word preflight classification with new negative controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar012-review | Out-Null
          if(git status --porcelain){throw 'Dirty initial checkout'}
          $path='experiments/H2AgentLab/Integration/H2OfficeRuntimeTools.cs'
          $saved=[IO.File]::ReadAllBytes($path)
          $old=Join-Path $env:RUNNER_TEMP 'ar012-old-office.cs'
          $env:AR_OLD_FILE=$old
          python -c "import os,subprocess;from pathlib import Path;Path(os.environ['AR_OLD_FILE']).write_bytes(subprocess.check_output(['git','show','3ee09035e06bb8a02a483d684e141419769b5160:experiments/H2AgentLab/Integration/H2OfficeRuntimeTools.cs']))"
          if($LASTEXITCODE){throw 'Old code not found'}
          try {
            [IO.File]::WriteAllBytes($path,[IO.File]::ReadAllBytes($old))
            @{new_tests_code_sha=(git rev-parse HEAD);old_runtime_sha='3ee09035e06bb8a02a483d684e141419769b5160';dirty_file=$path;intent='TEST_ONLY_NEGATIVE_CONTROL'} | ConvertTo-Json | Set-Content artifacts/ar012-review/negative-identity.json
            dotnet restore H2Notes.Avalonia.slnx
            if($LASTEXITCODE){throw 'Restore failed'}
            dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar012-review/negative-build.log
            if($LASTEXITCODE){throw 'Negative build failed'}
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter 'AR-012 Word revision' 2>&1 | Tee-Object artifacts/ar012-review/negative.log
            $exit=$LASTEXITCODE
            $text=Get-Content artifacts/ar012-review/negative.log -Raw
            if($exit -eq 0 -or $text -notmatch 'RESULT: 2 passed, 3 failed'){throw 'Expected three stale-preflight failures were not reproduced'}
            foreach($operation in 'word.replace_range','word.apply_format','word.insert_text') {
              if(!$text.Contains('FAIL AR-012 Word revision stale preflight has proven no effect for '+$operation)){throw 'Expected operation did not fail'}
            }
          } finally { [IO.File]::WriteAllBytes($path,$saved) }
          if(git status --porcelain){throw 'Positive source was not restored clean'}
      - name: Test the exact repaired source and retain accepted corpora
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(git status --porcelain){throw 'Dirty positive checkout'}
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';os=[Environment]::OSVersion.VersionString;evidence='E1/E2 controlled Office client, real temporary files, scripted transport; native E3/E4/E5 NOT_RUN'} | ConvertTo-Json | Set-Content artifacts/ar012-review/identity.json
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore -t:Rebuild 2>&1 | Tee-Object artifacts/ar012-review/build.log
          if($LASTEXITCODE){throw 'Positive rebuild failed'}
          $failed=@()
          foreach($name in 'AR-012-1','AR-012-2','AR-012-3','AR-011','AR-010','AR-001') {
            $task=$name.Substring(0,6);$log="artifacts/ar012-review/$name.log"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $task 2>&1 | Tee-Object $log
            if($LASTEXITCODE -ne 0 -or (Get-Content $log -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed'){$failed += $name}
          }
          if($failed.Count){throw ('Failed positive corpora: '+($failed -join ', '))}
      - name: Run every mandatory Agent suite with aggregate failure status
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar012-review/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR012-Word-Review-Evidence
          path: artifacts/ar012-review/
          if-no-files-found: error
          retention-days: 14
