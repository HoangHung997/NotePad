name: AR-012 one-time acceptance checkpoint
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/h2-ar012-review.yml']
permissions:
  contents: read
concurrency:
  group: h2-ar012-word-review
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact-source evidence and save three docs only
        env:
          AR_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib, json, os, re, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          REPO = 'HoangHung997/NotePad'
          BRANCH = 'feature/h2-agent-reliability-ar-000'
          MAIN = '1283bc13e07c3cd47d04886166de3dfc595422c0'
          CODE = 'ed46ab820c5b084c64a11c5c171d2ca0dbee5adf'
          OLD = '3ee09035e06bb8a02a483d684e141419769b5160'
          FULL = 35724401082
          FOCUSED = 35724340135
          TRACKER = Path('docs/H2_AGENT_RELIABILITY_IMPLEMENTATION_TASKS.md')
          REPORT = Path('docs/agent-reliability/AR-012/implementation.md')
          ACCEPT = Path('docs/agent-reliability/AR-012/acceptance.json')
          PATHS = [str(TRACKER), str(REPORT), str(ACCEPT)]
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def require(condition, message):
              if not condition: raise RuntimeError(message)
          def api(path):
              require(path.startswith('/actions/'), 'Read only same-repository Actions evidence')
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + REPO + path], text=True))
          def raw_log(job_id):
              data = subprocess.check_output(['gh', 'api', 'repos/' + REPO + '/actions/jobs/' + str(job_id) + '/logs', '--allow-escape-sequences'])
              require(0 < len(data) < 5_000_000, 'Unexpected log size')
              return data
          head = os.environ['AR_HEAD']
          require(os.environ['GITHUB_REPOSITORY'] == REPO, 'Wrong repository')
          require(git('rev-parse', 'HEAD') == head and not git('status', '--porcelain'), 'Wrong/dirty checkout')
          require(git('ls-remote', 'origin', 'refs/heads/main').split()[0] == MAIN, 'Main advanced; reconcile')
          require(git('ls-remote', 'origin', 'refs/heads/' + BRANCH).split()[0] == head, 'Branch advanced; reconcile')
          require(set(git('diff', '--name-only', CODE, 'HEAD').splitlines()) == {'.github/workflows/h2-ar012-review.yml'}, 'Unexpected change after tested code')
          require(hashlib.sha256(TRACKER.read_bytes()).hexdigest() == 'ec107ccc38c4a380622344dc54a07d1ad8c6c949a2fbe412e327dd66fec7a634', 'Checkpoint changed')
          require(hashlib.sha256(REPORT.read_bytes()).hexdigest() == '6e0e9902f4b3b1a630fdf7f3ac18d14ff76ea5c7aa406dc5b57c2105a96dd1a1', 'Report changed')
          require(not ACCEPT.exists(), 'Acceptance already recorded')
          full = api('/actions/runs/' + str(FULL))
          require(full['head_sha'] == CODE and full['status'] == 'completed' and full['conclusion'] == 'success', 'Exact-source full CI not successful')
          jobs = api('/actions/runs/' + str(FULL) + '/jobs?per_page=100')
          require(jobs['total_count'] == len(jobs['jobs']) == 1, 'Incomplete full-CI job inventory')
          job = jobs['jobs'][0]
          require(job['id'] == 106734498448 and job['conclusion'] == 'success', 'Wrong full-CI job')
          require(all(s['status'] == 'completed' and s['conclusion'] == 'success' for s in job['steps'] if 4 <= s['number'] <= 93), 'Required steps skipped/failed')
          for name in ['Run H2 Notes tests', 'Run H2 Agent Lab v2 architecture guard', 'Run H2 Agent Lab v2 provider transport resilience matrix', 'Publish self-contained Windows x64', 'Verify packaged Agent helpers start and answer IPC', 'Upload Avalonia portable build']:
              require(any(s['name'] == name and s['conclusion'] == 'success' for s in job['steps']), 'Missing required step: ' + name)
          focused = api('/actions/runs/' + str(FOCUSED))
          require(focused['head_sha'] == '87a74258bbc0ec1bb9faaea62e24a20a7504bb2c' and focused['status'] == 'completed' and focused['conclusion'] == 'success', 'Focused review did not succeed')
          focused_jobs = api('/actions/runs/' + str(FOCUSED) + '/jobs?per_page=100')
          require(focused_jobs['total_count'] == len(focused_jobs['jobs']) == 2, 'Incomplete focused job inventory')
          require(all(j['conclusion'] == 'success' and all(s['conclusion'] == 'success' for s in j['steps']) for j in focused_jobs['jobs']), 'Focused step failed or skipped')
          artifact = api('/actions/artifacts/10693511176')
          require(not artifact['expired'] and artifact['digest'] == 'sha256:a5e4de1a41d72247faeba39036ec8c7bd43cc468d00f0625e9a21ff0ac32a6e3' and artifact['size_in_bytes'] == 391458, 'Reviewed evidence differs')
          PACKAGE_ID = 10692536947
          PACKAGE_BYTES = 110004345
          PACKAGE_SHA = '91668e79da989ecd75dca9b329125ce41ef931dd55c3b19dc37e350baefce9c2'
          package = api('/actions/artifacts/' + str(PACKAGE_ID))
          require(package['workflow_run']['head_sha'] == CODE and not package['expired'] and package['size_in_bytes'] == PACKAGE_BYTES and package['digest'] == 'sha256:' + PACKAGE_SHA, 'Reviewed package differs')
          out = Path(os.environ['RUNNER_TEMP']) / 'ar012-acceptance'; out.mkdir(exist_ok=True)
          log = raw_log(job['id']); text_log = log.decode('utf-8-sig')
          require(CODE in text_log, 'Actual code absent from full-CI checkout log')
          counts = re.findall(r'RESULT: (\d+) passed, (\d+) failed', text_log)
          require(counts and int(counts[0][0]) > 639 and counts[0][1] == '0', 'Full H2 test result missing or failed')
          (out / 'full-ci.log').write_bytes(log)
          next_action = ('On existing feature/h2-agent-reliability-ar-000 and PR #3, reconcile latest main/checkpoint/tree/checks first. '
              'Start AR-020 only: re-read native Office discovery, AR SPEC sections 7/8.1 and the AR-020 task; inspect configured Windows Office/helper environment without adding credentials/endpoints. '
              'Implement/probe instance-window-view discovery, PID/start identity, unsaved/Save As continuity, metadata-only enumeration and typed busy/modal/capture failures in the existing OfficeHost path. '
              'Preserve all AR-012/011/010/001 corpora and full CI. E3 acceptance requires actual native Word/Excel instances/views and marker readback; absent environment means AWAITING_ENVIRONMENT, not fixture PASS. '
              'Do not merge main, change NAS protocol, create a parallel store/engine or certify multi-PC.')
          limitations = [
              'E1/E2 include concrete production adapter/permission/runtime/Office wrappers with controlled IOfficeAutomationClient, scripted no-network model transport, real temporary file effects, headless UI projection and DesktopHost fixture-mode IPC.',
              'E3 native Office/provider/model and E4 real H2 UI+model+tools remain NOT_RUN / AWAITING_ENVIRONMENT. Headless chip checks are not visual acceptance.',
              'AR-083 remains DEFERRED_BY_USER; NAS package/local harness are not physical E5. One-PC native tests remain mandatory.',
              'Native Office multi-instance PID/window/view enumeration and genuinely separate content/UI revisions remain AR-020/021. Missing provider identity fields are not invented.',
              'Exact-file/parent/sibling and reparse preflight are not race-free handle-based OS I/O. Unproven mapped/UNC alias equivalence is rejected, not certified. Arbitrary FullAccess shell/Python is not an OS sandbox.',
              'Document/session grounding and captured-selection preconditions do not certify every native cell/range, layout, paging, durable-job/restart or cross-PC operation. AR-021/022/023/031/040/041 and MB-124–127/H2M-133 remain open.',
              'No personal document, paid model, new user credential/endpoint or external user message was used. User-PC working tree remains NOT_ACCESSIBLE.'
          ]
          traceability = [
              {'requirement':'Exact explicit/linked file scope and prefix collision','code':['src/H2Notes.Core/H2AgentTargetScope.cs','src/H2Notes.Core/H2AgentResourceBinding.cs','experiments/H2AgentLab/Integration/H2ProductionToolSession.cs'],'tests':'AR-012 RC-04 + concrete external file/read-only/FullAccess negative tests'},
              {'requirement':'Global captured-active vs Project generic-open; no model-selected ambiguity','code':['src/H2Notes.Core/H2AgentResourceBinding.cs','experiments/H2AgentLab/Integration/H2OfficeRuntimeTools.cs'],'tests':'RC-03/04/05/24 production Office cases'},
              {'requirement':'Provider/session/path checks before dispatch and after readback','code':['experiments/H2AgentLab/Integration/H2OfficeRuntimeTools.cs'],'tests':'connection/session/Save As/unsaved/language evidence/unknown readback cases'},
              {'requirement':'Immutable execution identity separate from history correlation','code':['experiments/H2AgentLab/Integration/H2ProductionAgentAdapter.cs'],'tests':'queued Global task attached to a project keeps original execution identity'},
              {'requirement':'Separate content/UI binding metadata and selected desktop identity','code':['src/H2Notes.Core/H2AgentResourceBinding.cs','experiments/H2AgentLab/Desktop/SelectedDesktopWindowController.cs'],'tests':'RC-07/24 deterministic identity and actual fixture helper IPC'},
              {'requirement':'External target chip and shared Global/Project projection','code':['src/H2Notes.Avalonia/Controls/AgentTurnView.cs','src/H2Notes.Core/H2AgentThread.cs'],'tests':'real headless turn renderer, ticker and activity replay'},
              {'requirement':'Unsafe path/reparse fail closed','code':['src/H2Notes.Core/H2AgentTargetScope.cs'],'tests':'Windows junction escape, reserved/device/ADS/trailing/prefix cases'},
              {'requirement':'Stale Word revision proven before dispatch vs lost response after effect','code':['experiments/H2AgentLab/Integration/H2OfficeRuntimeTools.cs'],'tests':'5 Word revision cases, 3 expected old-code failures, valid readback and post-write unknown controls'}
          ]
          for item in traceability:
              for path in item['code']: require(Path(path).is_file(), 'Missing traceability owner: ' + path)
          now = datetime.now(timezone.utc).isoformat()
          manifest = {
              'task':'AR-012','spec_version':'H2-AR-SPEC-1.0','status':'DONE','implementation_status':'IMPLEMENTED','acceptance_status':'E2_PASS',
              'branch':BRANCH,'pr':3,'tested_code_sha':CODE,'main_sha':MAIN,'captured_at_utc':now,'working_tree_at_test':'CLEAN',
              'full_ci':{'id':FULL,'head_sha':CODE,'url':full['html_url'],'job_id':job['id'],'conclusion':'success','steps':job['steps'],'h2_tests':{'passed':int(counts[0][0]),'failed':0},'log_sha256':hashlib.sha256(log).hexdigest()},
              'focused':{'id':FOCUSED,'trigger_head':focused['head_sha'],'actual_tested_sha':CODE,'jobs':focused_jobs['jobs'],'artifact_id':artifact['id'],'artifact_sha256':artifact['digest'][7:],'zip_entries':620,'AR012':'44/44 x3','AR011':'25/25','AR010':'11/11','AR001':'13/13','Agent_suites':'74/74','os':'Microsoft Windows NT 10.0.26100.0','compiler':'33 warnings / 0 errors in positive rebuild','verification':'Downloaded artifact; SHA256 and all ZIP CRC verified; identity.json, all six positive logs, negative identity/log and 74-entry suite-results.json read back.'},
              'negative_control':{'old_runtime_sha':OLD,'new_test_sha':CODE,'dirty_file':'experiments/H2AgentLab/Integration/H2OfficeRuntimeTools.cs','intent':'TEST_ONLY_NEGATIVE_CONTROL','passed':2,'expected_failures':3,'cases':['word.replace_range','word.apply_format','word.insert_text'],'old_observation':'stale_resource incorrectly carried Execution/Unknown/ReconcileRequired before writes','repaired_observation':'Preflight/None/Reobserve and zero writes; actual post-write lost response remains Unknown','positive_source_restored_clean':True},
              'package':{'artifact_id':package['id'],'sha256':PACKAGE_SHA,'bytes':PACKAGE_BYTES,'zip_entries':482,'review':'Downloaded exact ZIP, verified SHA256/all entry CRC and nonempty app+Office/Desktop helpers. Packaged helper startup/IPC actually passed full CI; not native document acceptance.'},
              'traceability':traceability,'evidence_levels':{'E1':'PASS','E2':'PASS','E3':'NOT_RUN / AWAITING_ENVIRONMENT','E4':'NOT_RUN / AWAITING_ENVIRONMENT','E5':'DEFERRED_BY_USER (AR-083)'},
              'commands':['dotnet restore H2Notes.Avalonia.slnx','dotnet build H2Notes.Avalonia.slnx -c Release --no-restore','dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build','dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter AR-012 (three repetitions)','same test runner --filter AR-011 / AR-010 / AR-001','tools/agent-reliability/run_agent_suites.ps1','Existing full Avalonia CI suite/publish/packaged-helper smoke commands'],
              'prior_evidence_preserved':[{'code_sha':OLD,'run_id':35720746799,'AR012':'39/39 x3','artifact_id':10690789503,'artifact_sha256':'f300e623a1bf876490c01cdbee2d8ddee453a7fa94119a4870a42e5a70a71dbd'}],
              'delivery':{'run_id':FOCUSED,'artifact_id':10692685881,'artifact_sha256':'b61d9cf1e07eeb12fb1cca2ad6678610ed71e74371847fe64f2a95b6b08754ed','scope':'4 preimage/hash checked files, byte-identical delivered patch, non-force same-branch push; one encoded transfer typo corrected without changing patch/preimage hash guards'},
              'limitations':limitations,'next_task':'AR-020 NOT_STARTED','next_exact_action':next_action}
          text = TRACKER.read_text(encoding='utf-8')
          start=text.index('```yaml\n',text.index('## 7. SESSION HANDOFF'))+len('```yaml\n');end=text.index('\n```',start)
          state=json.loads(text[start:end]); require(state['active_task']=='AR-012' and state['implementation_status']=='ACTIVE','Active task changed')
          accepted={'id':'AR-012','implementation_status':'IMPLEMENTED','acceptance_status':'E2_PASS','code_sha':CODE,'full_ci_run':FULL}
          state['previous_completed_task']=state.get('last_completed_task')
          state.update({'phase':'AR-012_ACCEPTED_NEXT_AR-020','active_task':'AR-020','implementation_status':'NOT_STARTED','acceptance_status':'NOT_RUN','last_code_commit':CODE,'last_runtime_source_commit':CODE,'last_validated_code_commit':CODE,'last_validation_result':'FULL_REQUIRED_CI_E2_AND_WORD_NEGATIVE_CONTROLS_PASS','completed_this_session':[accepted],'last_completed_task':accepted,'checkpoint_saved_at_utc':now,'finalization_checked_head':head,'previous_saved_checkpoint_commit':CODE,'working_tree':'Exact positive Windows checkout CLEAN after test-only negative control; delivery patch verified byte-for-byte. This checkpoint stages three docs only and verifies clean tree/non-force push/remote HEAD. Offline review snapshot matches delivered code but is not the remote Git history. User-PC tree NOT_ACCESSIBLE.','uncommitted_files':[],'known_failures':['No observed AR-012/011/010/001 or mandatory suite failure at the accepted code SHA.',*limitations[1:]],'remaining_in_active_task':['AR-020 implementation and real native Office discovery acceptance have not started.'],'next_exact_action':next_action,'next_task_if_active_done':'AR-021','pending_user_decisions':[],'additional_ci_after_recorded_run':'Documentation/finalizer cleanup may trigger later CI. Do not transfer accepted exact-source PASS to an unobserved SHA.'})
          state['last_test_commands']=[{'command':c,'code_sha':CODE,'result':'PASS','evidence':'AR-012 acceptance.json: full run '+str(FULL)+' / focused run '+str(FOCUSED)} for c in manifest['commands']]
          state['ci_runs'].extend([{'id':FULL,'code_sha':CODE,'result':'SUCCESS','h2_tests':manifest['full_ci']['h2_tests'],'publish_helper_smoke':'PASS'}, {'id':FOCUSED,'actual_tested_sha':CODE,'result':'SUCCESS','AR012':'44/44 x3','retained':'25/25 + 11/11 + 13/13','Agent_suites':'74/74','negative':'2 passed / 3 expected old-runtime failures','artifact_id':artifact['id'],'artifact_sha256':artifact['digest'][7:]}])
          state['evidence_locations']=list(dict.fromkeys(state.get('evidence_locations',[])+[str(ACCEPT),str(REPORT)]))
          text=text[:start]+json.dumps(state,ensure_ascii=False,indent=2)+text[end:]
          row='| AR-012 | Scope + resource binding nền | 011 | E1/E2 | ACTIVE |'
          require(text.count(row)==1 and text.count('### [~] AR-012')==1,'Task anchors changed')
          text=text.replace(row,row.replace('ACTIVE','DONE'),1).replace('### [~] AR-012','### [x] AR-012',1)
          summary='\n**AR-012 acceptance — 2026-09-22:** IMPLEMENTED / E2_PASS / DONE at `'+CODE+'`; full CI `'+str(FULL)+'`, Windows publish and packaged-helper IPC PASS; 44/44 binding cases x3, AR-011/010/001 and 74/74 Agent suites. Old Word wrapper reproduces 3 stale-preflight errors; clean repaired source passes. [Evidence](agent-reliability/AR-012/acceptance.json). E3/E4 NOT_RUN, AR-083 DEFERRED_BY_USER; no other task closed.\n\n'
          require(text.count('### [ ] AR-020')==1,'Next task changed')
          text=text.replace('### [ ] AR-020',summary+'### [ ] AR-020',1)
          TRACKER.write_text(text,encoding='utf-8')
          report=REPORT.read_text(encoding='utf-8')
          report=report.replace('Status: ACTIVE / NOT_RUN for the new integration until exact-source Windows evidence is reviewed.','Status: IMPLEMENTED / E2_PASS / DONE on `'+CODE+'`.',1)
          report=report.replace('Current scope is still AR-012 only. New tests/CI must be reviewed at their actual source SHA before final acceptance. E3/E4 NOT_RUN; AR-083 DEFERRED_BY_USER.','The review above describes the pre-acceptance work. Its final exact-source results are recorded below; native E3/E4 and the AR-083 deferral remain unchanged.',1)
          report+='\n## Accepted execution and traceability\n\nFull CI **'+str(FULL)+'**, job `'+str(job['id'])+'`, tested `'+CODE+'`: **'+counts[0][0]+' H2 tests / 0 failures**, all required Agent/provider/helper suites, Windows publish and packaged Office/Desktop helper IPC passed. Focused review **'+str(FOCUSED)+'** reproduced **2 passes / 3 expected failures** on the old Word wrapper, restored a clean repaired checkout and passed **44/44 AR-012 x3**, **25/25 AR-011**, **11/11 AR-010**, **13/13 AR-001** and **74/74 Agent suites**. Downloaded evidence SHA256/CRC and identity/results were read back; these counts are not inferred from source.\n\n'
          report+='| Requirement | Implemented owner | Executed evidence |\n|---|---|---|\n'
          for item in traceability: report+='| '+item['requirement']+' | '+', '.join('`'+p+'`' for p in item['code'])+' | '+item['tests']+' |\n'
          report+='\nExact CI steps, artifact hashes, commands, negative-control identity and limitations are in [acceptance.json](acceptance.json). No native document, full visual UI, alias/OS-race or multi-PC certification is implied. The old local draft is superseded by the remote checkpoint. Next: **AR-020 NOT_STARTED**, same branch/PR; no merge authorized.\n'
          REPORT.write_text(report,encoding='utf-8');ACCEPT.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          require('| AR-083 |' in text and '| E5 | DEFERRED_BY_USER |' in text,'E5 deferral changed')
          subprocess.run(['git','add','--',*PATHS],check=True)
          require(set(git('diff','--cached','--name-only').splitlines())==set(PATHS),'Unexpected staged files')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          (out/'documentation.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'Concurrent update; retain patch instead')
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','commit','-m','docs(AR-012): accept scoped binding evidence and hand off native discovery'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+BRANCH],check=True)
          saved=git('rev-parse','HEAD');require(not git('status','--porcelain') and git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==saved,'Saved checkpoint not verified')
          (out/'saved.json').write_text(json.dumps({'checkpoint_sha':saved,'code_sha':CODE,'working_tree':'CLEAN','paths':PATHS},indent=2))
          print('Verified saved checkpoint:',saved,'; H2 result:',counts[0],'; AR-020 NOT_STARTED.')
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR012-Saved-Acceptance
          path: ${{ runner.temp }}/ar012-acceptance/
          if-no-files-found: error
          retention-days: 14
