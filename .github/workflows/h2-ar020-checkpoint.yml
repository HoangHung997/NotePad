name: AR-020 one-time implementation checkpoint (E3 pending)
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/h2-ar020-checkpoint.yml']
permissions:
  contents: read
concurrency:
  group: h2-ar020-doc-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      AR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Run pinned three-document checkpoint with Windows log parser repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, subprocess, textwrap
          pinned='3b559a9558f9a0d500aa7e001c4dc3ced2713324'
          path='.github/workflows/h2-ar020-checkpoint.yml'
          original=subprocess.check_output(['git','show',pinned+':'+path])
          blob=hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest()
          if blob!='cbe0febc86157c2116ce53bdc34466c5a132a21a':
              raise RuntimeError('Pinned documentation finalizer differs')
          body=original.decode('utf-8')
          start="          python3 - <<'PY'\n"
          end='\n          PY\n'
          if body.count(start)!=1 or body.count(end)!=1:
              raise RuntimeError('Pinned script boundaries changed')
          script=textwrap.dedent(body.split(start,1)[1].split(end,1)[0])
          replacements={
              "require(git('rev-parse','HEAD^')==TESTED,'Other work appeared; do not overwrite its checkpoint')":
              "require(git('rev-parse','HEAD^')=='3b559a9558f9a0d500aa7e001c4dc3ced2713324','Other work appeared; do not overwrite its checkpoint')",
              "if '[command]' in line and 'git log -1 --format=%H' in line:":
              "if '[command]' in line and ' log -1 --format=%H' in line:",
              "original=TRACKER.read_text(encoding='utf-8');start=original.index('```yaml\\n',original.index('## 7. SESSION HANDOFF'))+len('```yaml\\n');end=original.index('\\n```',start)":
              "manifest['checkpoint_tooling_attempts']=[{'run_id':35736891775,'result':'FAILED_BEFORE_DOCUMENT_WRITES','reason':'Parser expected bare git instead of the Windows quoted git.exe path','repair':'Parse the actual log command suffix, then verify checkout source equality; no CI acceptance assertion removed.'}]\nmanifest['full_ci']['solution_build_warnings']=33\noriginal=TRACKER.read_text(encoding='utf-8');start=original.index('```yaml\\n',original.index('## 7. SESSION HANDOFF'))+len('```yaml\\n');end=original.index('\\n```',start)"
          }
          for before,after in replacements.items():
              if script.count(before)!=1: raise RuntimeError('Expected exact finalizer replacement missing')
              script=script.replace(before,after,1)
          exec(compile(script,'AR020-pinned-documentation-checkpoint','exec'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR020-Saved-Implementation-Checkpoint
          path: ${{ runner.temp }}/ar020-checkpoint/
          if-no-files-found: error
          retention-days: 14
