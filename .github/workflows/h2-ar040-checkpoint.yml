name: AR-040 verified process acceptance checkpoint
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: [.github/workflows/h2-ar040-checkpoint.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: h2-ar040-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'HoangHung997/NotePad'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact source and completed evidence before saving three documents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYCODE'
          # One-use, docs-only checkpoint. Run only in an authorized clean repository checkout.
          import io, json, hashlib, os, pathlib, re, subprocess, urllib.request, urllib.error, zipfile
          from datetime import datetime, timezone
          REPO = 'HoangHung997/NotePad'
          BRANCH = 'feature/h2-agent-reliability-ar-000'
          CODE = '462ab1dec0d0c723920283b0b3b9142b46d6796a'
          RUNTIME = '5d17d348416c3ffcb27bad33318a091914837ef5'
          MAIN = '1283bc13e07c3cd47d04886166de3dfc595422c0'
          FOCUSED, FULL = 35816609055, 35816612945
          OUT = pathlib.Path('artifacts/ar040-checkpoint'); OUT.mkdir(parents=True, exist_ok=True)
          API = 'https://api.github.com/repos/' + REPO
          def require(condition, message):
              if not condition: raise RuntimeError(message)
          def git(*args):
              return subprocess.check_output(['git', *args], timeout=45).decode('utf-8').strip()
          def put(path, value):
              path = pathlib.Path(path); path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          def sha(data): return hashlib.sha256(data).hexdigest()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          opener = urllib.request.build_opener(NoRedirect)
          def api_bytes(suffix, limit=16*1024*1024):
              request = urllib.request.Request(API + suffix, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'H2-AR040-evidence-checkpoint'})
              try: response = opener.open(request, timeout=30)
              except urllib.error.HTTPError as error:
                  if error.code not in (301,302,303,307,308): raise
                  url = error.headers['Location']
                  require(urllib.parse.urlsplit(url).scheme == 'https', 'Non-HTTPS artifact redirect')
                  # Never forward a repository credential to the signed artifact/log host.
                  response = urllib.request.urlopen(urllib.request.Request(url), timeout=45)
              with response:
                  data = response.read(limit+1)
              require(len(data) <= limit, 'Evidence response exceeded fixed byte budget')
              return data
          def api(suffix): return json.loads(api_bytes(suffix))
          def zip_reader(data):
              z = zipfile.ZipFile(io.BytesIO(data)); names = z.namelist()
              require(len(names) == len(set(names)) and len(names) < 5000, 'Ambiguous/oversized evidence archive')
              require(sum(x.file_size for x in z.infolist()) <= 128*1024*1024, 'Uncompressed evidence exceeds budget')
              require(z.testzip() is None, 'Evidence CRC failed')
              return z
          def member_json(z, name): return json.loads(z.read(name).decode('utf-8-sig'))
          def member_text(z, name): return z.read(name).decode('utf-8-sig')
          def verified_run(run_id):
              run = api('/actions/runs/' + str(run_id))
              require(run['head_sha'] == CODE and run['head_branch'] == BRANCH
                  and run['status'] == 'completed' and run['conclusion'] == 'success', 'CI not successful on the required SHA')
              all_jobs = api('/actions/runs/' + str(run_id) + '/jobs?per_page=100')
              jobs = all_jobs['jobs']; require(all_jobs['total_count'] == len(jobs) == 1, 'Unexpected job pagination/shape')
              job = jobs[0]
              require(job['status'] == 'completed' and job['conclusion'] == 'success', 'Required job not successful')
              require(all(s['status']=='completed' and s['conclusion']=='success' for s in job['steps']), 'A required CI step was skipped or failed')
              return {'id':run_id, 'code_sha':CODE, 'event':run['event'], 'conclusion':run['conclusion'],
                  'job_id':job['id'], 'steps':[{'name':s['name'], 'conclusion':s['conclusion']} for s in job['steps']]}
          head = git('rev-parse','HEAD')
          require(head == os.environ['GITHUB_SHA'], 'Unexpected checkpoint checkout')
          require(git('status','--porcelain') == '', 'Dirty checkout')
          require(git('rev-parse','HEAD^') == CODE, 'Checkpoint must be based directly on the reviewed code')
          require(git('diff','--name-only',CODE,head) == '.github/workflows/h2-ar040-checkpoint.yml', 'Unexpected intervening changes')
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0] == head, 'Remote branch advanced')
          require(git('ls-remote','origin','refs/heads/main').split()[0] == MAIN, 'Main changed; re-review required')
          focused = verified_run(FOCUSED); full = verified_run(FULL)
          artifacts = api('/actions/runs/'+str(FOCUSED)+'/artifacts?per_page=100')['artifacts']
          match = [a for a in artifacts if a['name']=='AR040-Process-Regression-Evidence' and not a['expired']]
          require(len(match)==1, 'Missing/ambiguous focused artifact'); artifact = match[0]
          raw = api_bytes('/actions/artifacts/'+str(artifact['id'])+'/zip')
          require(len(raw)==artifact['size_in_bytes'] and 'sha256:'+sha(raw)==artifact['digest'], 'Focused artifact digest mismatch')
          z=zip_reader(raw); identity=member_json(z,'identity.json')
          require(identity['code_sha']==CODE and identity['working_tree']=='CLEAN', 'Focused source identity mismatch')
          results={}
          expected={'AR-040-1':57,'AR-040-2':57,'AR-040-3':57,'AR-033':42,'AR-032':19,'AR-031':39,'AR-030':39,'AR-020':36,'AR-012':44,'AR-011':25,'AR-010':11,'AR-001':13}
          for name,count in expected.items():
              text=member_text(z,name+'.log')
              require(re.findall(r'RESULT: (\d+) passed, (\d+) failed',text)==[(str(count),'0')], 'Wrong result count: '+name)
              require(not re.search(r'^FAIL ',text,re.M), 'Hidden case failure: '+name)
              results[name]={'passed':count,'failed':0}
          require(member_json(z,'corpora-result.json')['failed']==[], 'Aggregate corpora failure')
          suites=member_json(z,'agent-suites/suite-results.json')
          require(suites['code_sha']==CODE and len(suites['suites'])==74 and all(s['exit_code']==0 for s in suites['suites']), 'Agent suite failure')
          receipt=member_json(z,'source-receipt.json'); sources=zip_reader(z.read('committed-source.zip'))
          require(len(receipt)==len(sources.namelist()), 'Source receipt cardinality mismatch')
          for item in receipt:
              path=item['path']; data=sources.read(path)
              require(sha(data)==item['sha256'] and hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==item['blob'], 'Source hash mismatch: '+path)
              require(git('rev-parse',CODE+':'+path)==item['blob'], 'Committed source differs: '+path)
          build=member_text(z,'build.log'); warnings=re.findall(r'\b(\d+) Warning\(s\)',build)
          require('0 Error(s)' in build and warnings, 'Build receipt incomplete')
          readbacks=[]
          for repeat in range(1,4):
              prefix='AR-040-'+str(repeat)+'/'
              large=member_json(z,prefix+'production-large-output-readback.json')
              require(large['stdoutCharacters']==1000000 and large['stdoutSha256'].lower()==sha(b'Z'*1000000)
                  and large['stderr']=='stderr-ĐÚNG', 'Large output not exact')
              large_job=large['terminal']['job']
              require(large_job['Status']=='Succeeded' and large_job['StdoutObservedCharacters']==1200000
                  and not large_job['OutputComplete'], 'Large output completeness was flattened')
              progress=member_json(z,prefix+'production-progress-stderr-readback.json')
              require(progress['stderr']==progress['Output'] and 'H2-FIXTURE-PROGRESS' in progress['stderr']
                  and 'H2-STDERR-ĐÚNG' in progress['stderr'] and progress['terminal']['job']['OutputComplete'], 'Native diagnostic data lost')
              for project in ['False','True']:
                  rr=member_json(z,prefix+'production-roundtrip-'+project+'.json')
                  require(rr['summary']['Status']==3 and rr['restored']['Status']==3 and rr['Polls']>=2, 'Production lifecycle did not complete')
                  ops=[o for o in rr['restored']['Recovery']['Operations'] if o['ToolName']=='start_command_job']
                  require(len(ops)==1 and ops[0]['Job']['JobId']==rr['JobId'] and len(ops[0]['Job']['OutputArtifacts'])==2
                      and ops[0]['Job']['RootExited'] and ops[0]['Job']['AllProcessesExited'] and ops[0]['Job']['StreamsDrained'], 'Ownership/readback mismatch')
              readbacks.append({'repetition':repeat,'large_stdout_observed':1200000,'large_stdout_retained':1000000,
                  'large_stderr_exact':True,'native_progress_retained':True,'global_project_roundtrip_verified':True})
          full_raw=api_bytes('/actions/jobs/'+str(full['job_id'])+'/logs')
          (OUT/'full-ci.log').write_bytes(full_raw)
          log=full_raw.decode('utf-8-sig'); require('RESULT: 915 passed, 0 failed.' in log and not re.search(r'Z FAIL ',log), 'Full H2 test result mismatch')
          merge=re.search(r'HEAD is now at [0-9a-f]+ Merge '+CODE+r' into '+MAIN,log)
          require(merge, 'Full CI PR checkout identity not found')
          sha_matches=re.findall(r'^\S+Z ([0-9a-f]{40})\s*$',log,re.M)
          require(len(sha_matches)==1, 'Ambiguous full checkout SHA'); full_sha=sha_matches[0]
          subprocess.run(['git','fetch','--no-tags','origin',full_sha],check=True,timeout=45)
          relevant=['src','experiments','tests','tools','global.json','Directory.Build.props','Directory.Build.targets','.github/workflows/avalonia-ci.yml']
          require(git('diff','--name-only',CODE,full_sha,'--',*relevant)=='', 'Full/focused application sources differ')
          require(re.search(r'\{"ok":true,"office":\{[^\n]*"FixtureMode":false[^\n]*"desktop":\{[^\n]*"FixtureMode":false',log), 'Packaged helpers not verified')
          full['actual_checkout_sha']=full_sha; full['source_equivalence']='Application/test/tools and full CI workflow match focused commit'; full['full_log_sha256']=sha(full_raw); full['h2_tests']={'passed':915,'failed':0}
          full_artifacts=api('/actions/runs/'+str(FULL)+'/artifacts?per_page=100')['artifacts']
          package=[a for a in full_artifacts if a['name']=='H2Notes-Avalonia-Portable-win-x64' and not a['expired']]
          require(len(package)==1 and package[0]['size_in_bytes']>100000000, 'No nonempty portable build')
          package={k:package[0][k] for k in ['id','name','size_in_bytes','digest']}
          now=datetime.now(timezone.utc).isoformat()
          acceptance={'schema_version':1,'task':'AR-040','implementation_status':'IMPLEMENTED','acceptance_status':'E2_PASS','done':True,
           'saved_at_utc':now,'repository':REPO,'branch':BRANCH,'pr':3,'base_integration_sha':'8b1505c62e7764286b4185876098ed6e0dafaf04',
           'runtime_repair_sha':RUNTIME,'tested_code_sha':CODE,'focused':focused,'full':full,
           'focused_artifact':{k:artifact[k] for k in ['id','name','size_in_bytes','digest']},'portable':package,
           'source_receipt_files':len(receipt),'source_identity':'Every supplied file matches SHA256, Git blob and exact tested commit',
           'tests':results,'agent_suites':{'passed':74,'failed':0},'compiler_warnings':int(warnings[-1]),'readback_checks':readbacks,
           'evidence_levels':{'E1':'Namespace/owner/invocation/revision policy','E2':'Production Global/Project registry with actual owned Windows subprocesses, temporary files, pipes, ArtifactStore and journal; model transport scripted',
           'E3':'NOT_RUN; native GUI not required by AR-040 process acceptance; AR-020/033 remain pending','E4':'NOT_RUN','E5':'AR-083 DEFERRED_BY_USER'},
           'historical_failures':[{'sha':'8b1505c62e7764286b4185876098ed6e0dafaf04','run_id':35813690068,'passed':43,'failed':11,'repetitions':3,'artifact_id':10730734029,'digest':'72b62f2cd66bea4bfacd71b089476feb66791674275317a12b4a98616f071629','cause':'Conflicting shell namespace metadata blocked production composition'},
           {'sha':RUNTIME,'run_id':35815606847,'passed':53,'failed':1,'repetitions':3,'artifact_id':10731951890,'digest':'f0755145e252ad281a40d0957dad47d788fcef5c6c1866177b0a9bbf7ab38da9','full_run_id':35815609566,'full_passed':911,'full_failed':1,'cause':'Exact-output fixture also received native PowerShell progress; production stderr was not stripped'}],
           'limits':['CancelOnHostExit, not a surviving worker. No PID adoption or automatic uncertain-write replay.',
           'Full-access-only shell is not a filesystem/network sandbox. No elevation or access to another task/process.',
           'Retained output is capped at 1000000 UTF-16 characters per stream; truncation is explicit. Exit zero proves process exit, not arbitrary user-goal semantics.',
           'No E3/E4 native Office/model/UI acceptance, E5 NAS certification or MB-124–127 closure.']}
          put('docs/agent-reliability/AR-040/acceptance.json',acceptance)
          report=f'''# AR-040 — owned jobs in the existing production runtime
          
          Status: **IMPLEMENTED / E2_PASS / DONE** for the process scope required by AR-040. The project is not complete. Native AR-020/033 E3, E4 and deferred AR-083 E5 remain open.
          
          ## Exact source and evidence
          
          Existing integration `8b1505c62e7764286b4185876098ed6e0dafaf04` was resumed, not overwritten by old conversation ZIP drafts. Namespace repair `{RUNTIME}` and registered test/fixture repair `{CODE}` were pushed through the authorized connector. [Machine-readable evidence](acceptance.json) records focused run {FOCUSED}, full run {FULL}, actual full checkout `{full_sha}`, artifact identities and per-suite results.
          
          AR-040: **57/57 in three repetitions**, retained AR-033/032/031/030/020/012/011/010/001 pass, **74/74 independent Agent suites** and **915 H2 tests / zero failures**. Full Windows publish and helper startup/IPC succeeded. Build warnings remain {warnings[-1]}; they are not claimed fixed. Full test-merge checkout is not a merge into main.
          
          ## Production paths and boundaries
          
          `H2LocalCommandTool` and `H2ProductionToolSession` register `start_command_job`, `poll_command_job`, `read_command_output`, `write_command_stdin`, `cancel_command_job`, `get_command_result` alongside the existing bounded `exec_command`. Global and Project use the same path. Host-owned TaskId, invocation, goal revision and expiring FullAccess grant define authority; model arguments cannot choose owner/PID or gain scoped shell access.
          
          `ProcessShellCapabilities` owns the bounded native job and process-start identity. Poll cancellation is separate from job lifetime. Both stdout/stderr are drained past retention limits. Stdin is explicit opt-in with bounded idempotent receipts. Cancellation/timeout observes root termination, Job Object accounting and pipe EOF; uncertain effects remain unknown. Windows Job Object handles apply CancelOnHostExit to owned descendants only. They are not a sandbox for external Office/service effects or a promise of exactly-once execution.
          
          The existing Agent journal stores native ownership before Resume and terminal receipts. The runtime observes the original start invocation at a safe boundary and invokes existing verification; separate poll calls or model prose cannot award proof. ArtifactStore retains exact bounded output with current hashes and completeness flags. Source-backed goals, unknown/partial effects and missing verifier evidence continue to block completion. No alternate engine, durable process database, daemon or ProjectRecord Agent state was added. Restart replay remains AR-041.
          
          ## Repairs and negative evidence
          
          The first real Windows integration run failed 11 AR-040 cases in each repetition because `shell` had two different metadata descriptions. The registry's rejection was correct; the command descriptor was aligned without relaxing registry validation. Two registered composition tests cover both registration orders and require conflicting metadata to remain rejected without modifying the registry.
          
          The next run passed 53/54 but its exact-output fixture expected only `stderr-ĐÚNG`, whereas native PowerShell also wrote progress diagnostics. The fixed fixture suppresses progress **only in that fixture script**, keeps exact 1000000 `Z` characters and exact stderr assertions, and records output/hash before assertion. A separate actual-PowerShell test explicitly emits progress and verifies that the paged output, retained artifact and observed character count agree and preserve both diagnostic and Unicode markers. Production never strips stderr or treats it as discardable noise. Earlier failures remain failures in the historical records, not relabelled control successes.
          
          E1 contains the host policy tests; E2 uses scripted model transport, real disposable PowerShell processes/files/pipes and production archive round trips. The tests do not call a real model or use personal documents/new endpoints/credentials. Native Office acceptance and physical two-PC acceptance are not inferred from these results.
          
          ## Handoff
          
          Continue only independent **AR-050** under tracker section 2.2 after reconciling refs, working tree and SESSION HANDOFF. Its AR-010/032 dependencies are accepted; AR-041 remains not started because its native prerequisites are not complete. Measure every actual serialized model request with provider-specific limits before send, including continuation/repair/steering; test RC-17/18 through the existing transports with scripted payloads. Do not invent model limits or switch configured endpoints. No AR-050 code is part of this checkpoint.
          '''
          pathlib.Path('docs/agent-reliability/AR-040/implementation.md').write_text(report,encoding='utf-8')
          p=pathlib.Path('docs/H2_AGENT_RELIABILITY_IMPLEMENTATION_TASKS.md'); text=p.read_text(encoding='utf-8')
          row='| AR-040 | Job/process session dài | 011/031 | E2 + process thật | NOT_STARTED |'
          require(text.count(row)==1,'Task table changed')
          text=text.replace(row,row.replace('NOT_STARTED','DONE'))
          heading='### [ ] AR-040 — Phiên tiến trình/job dài có ID thật'
          require(text.count(heading)==1,'Task heading changed');text=text.replace(heading,heading.replace('[ ]','[x]'))
          note=f'**AR-040 accepted 2026-09-23:** IMPLEMENTED / E2_PASS / DONE on `{CODE}`; focused {FOCUSED} **57/57 x3**, all retained AR regressions and **74/74** Agent suites; full {FULL} **915/915**, publish/helper IPC PASS. Existing production Global/Project tools use real owned Windows processes, journal and ArtifactStore with scripted model transport. [Evidence](agent-reliability/AR-040/acceptance.json). Native AR-020/033 and E4 remain pending; AR-083 DEFERRED_BY_USER. AR-050 is the next independent core task; AR-041 native prerequisites remain open.\n\n'
          require('### [ ] AR-041 —' in text,'Next task heading missing');text=text.replace('### [ ] AR-041 —',note+'### [ ] AR-041 —',1)
          m=re.search(r'(?s)(## 7\. SESSION HANDOFF.*?```yaml\n)(.*?)(\n```)',text);require(m is not None,'Missing session handoff')
          d=json.loads(m[2]);require(d['active_task']=='AR-040' and d['implementation_branch']==BRANCH,'Another active task owns this branch')
          next_action='Reconcile main, existing feature branch, PR #3 and working tree; begin only AR-050. Extend existing per-request hooks/transport serialization budgets before Start/Continue/repair/steering sends; measure actual messages/tools/images/files plus output reserve/margin with sourced limits; test RC-17/18 and retained AR corpora on the exact saved code. No new engine/store or real provider call without existing authorization. Keep AR-020/033 native E3 pending and AR-083 DEFERRED_BY_USER; AR-041 remains not started pending prerequisites.'
          d.update(phase='AR-040_ACCEPTED_NEXT_AR-050',active_task='AR-050',implementation_status='NOT_STARTED',acceptance_status='NOT_RUN',
           owner_session='chatgpt-ar040-repair-2026-09-23',last_code_commit=CODE,last_validated_code_commit=CODE,last_runtime_source_commit=RUNTIME,
           last_test_commit=CODE,last_full_ci_checkout_sha=full_sha,capture_checked_head=head,finalization_checked_head=head,
           working_tree='Focused CI checkout CLEAN. Docs-only checkpoint verifies refs and normal push. Local review is a verified offline source snapshot, not the user-PC checkout; user-PC tree NOT_ACCESSIBLE.',
           uncommitted_files=[],checkpoint_saved_at_utc=now,completed_this_session=['AR-040'],implemented_this_session=['Reconciled existing production integration; repaired shell namespace conflict; added exact-output/diagnostic and registration-order tests; verified full E1/E2 acceptance.'],
           remaining_in_active_task=['AR-050 NOT_STARTED. Implement actual serialized per-request budgeting under the approved spec.'],last_validation_result='AR040_57_PASS_X3; ALL_RETAINED_AR_PASS; AGENT74_PASS; FULL915_PASS; NATIVE_GATES_UNCHANGED',
           next_exact_action=next_action,next_task_if_active_done='Evaluate AR-051 dependencies and evidence; do not bypass native gates.',
           next_ready_independent_task='AR-050',independent_dependency_assessment={'id':'AR-050','dependencies':['AR-010 accepted','AR-032 accepted'],'basis':'Tracker section 2.2; no dependency on native AR-020/033 E3'},
           candidate_base=CODE,last_completed_task={'id':'AR-040','implementation_status':'IMPLEMENTED','acceptance_status':'E2_PASS','code_sha':CODE},
           resolved_in_this_session=['Conflicting shell namespace metadata blocks production composition: repaired and tested in both orders.', 'Large-output fixture isolated from native progress; exact stdout/stderr and separate progress retention tests passed.'],
           last_test_commands=[{'command':'H2Notes.Tests --filter AR-040 x3 + retained AR suites','run_id':FOCUSED,'sha':CODE,'result':'57/57 x3; retained corpora pass'},
           {'command':'run_agent_suites.ps1','run_id':FOCUSED,'sha':CODE,'result':'74/74'},
           {'command':'Avalonia CI + publish + helper IPC','run_id':FULL,'sha':full_sha,'result':'915/915; all steps successful'}],
           external_blockers=['AR-020/033 real native E3 remain AWAITING_ENVIRONMENT; E4 NOT_RUN. AR-050 independent core is not blocked.'])
          d.setdefault('ci_runs',[]).extend([{'id':FOCUSED,'code_sha':CODE,'result':'SUCCESS','owner':'AR-040','artifact_id':artifact['id']},
           {'id':FULL,'code_sha':CODE,'checkout_sha':full_sha,'result':'SUCCESS','owner':'AR-040'}])
          d.setdefault('historical_failure_notes_retained',[])
          if isinstance(d['historical_failure_notes_retained'],list): d['historical_failure_notes_retained'].extend(acceptance['historical_failures'])
          for item in ['docs/agent-reliability/AR-040/acceptance.json','docs/agent-reliability/AR-040/implementation.md']:
           if item not in d['evidence_locations']: d['evidence_locations'].append(item)
          text=text[:m.start(2)]+json.dumps(d,ensure_ascii=False,indent=2)+text[m.end(2):];p.write_text(text,encoding='utf-8')
          put(OUT/'SESSION-HANDOFF.json',d);put(OUT/'verified.json',acceptance)
          expected_paths=['docs/H2_AGENT_RELIABILITY_IMPLEMENTATION_TASKS.md','docs/agent-reliability/AR-040/acceptance.json','docs/agent-reliability/AR-040/implementation.md']
          require(set(subprocess.check_output(['git','status','--porcelain'],timeout=15).decode('utf-8').splitlines()) == {' M '+x for x in expected_paths if x.endswith('TASKS.md') or x.endswith('implementation.md')} | {'?? docs/agent-reliability/AR-040/acceptance.json'},'Unexpected changed files')
          subprocess.run(['git','add','--',*expected_paths],check=True)
          require(set(git('diff','--cached','--name-only').splitlines())==set(expected_paths),'Unexpected staged file')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'Remote changed before documentation commit')
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com',
           'commit','-m','docs(AR-040): accept verified production jobs and hand off independent AR-050'],check=True)
          commit=git('rev-parse','HEAD')
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+BRANCH],check=True,timeout=45)
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==commit,'Remote checkpoint mismatch')
          put(OUT/'saved.json',{'checkpoint_commit':commit,'previous_head':head,'code_sha':CODE,'files':expected_paths,'remote_verified':True})
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR040-Verified-Checkpoint
          path: artifacts/ar040-checkpoint/
          if-no-files-found: error
          retention-days: 14
