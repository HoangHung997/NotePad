name: AR-064 plugin provider lifecycle validation
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths:
      - experiments/H2AgentLab/**
      - src/H2Notes.Core/**
      - src/H2Notes.Avalonia/**
      - tests/H2Notes.Tests/**
      - .github/workflows/h2-ar064-validation.yml
permissions:
  contents: read
concurrency:
  group: h2-ar064-validation
  cancel-in-progress: false
jobs:
  validation:
    if: github.repository == 'HoangHung997/NotePad'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record exact source and build
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar064 | Out-Null
          if (git status --porcelain) { throw 'Dirty checkout' }
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';E1='Atomic registry and provider selection / revocation';E2='Real temporary ZIP package/activation/artifact files with declared fixture executors';E3='NOT_RUN until concrete production package scenario';E4='NOT_RUN';E5='AR-083 DEFERRED_BY_USER';network='No model, credential or external service calls'} | ConvertTo-Json | Set-Content artifacts/ar064/identity.json
          python -c "import hashlib,json,pathlib,subprocess,zipfile; paths=subprocess.check_output(['git','ls-files'],text=True).splitlines(); selected=[p for p in paths if pathlib.Path(p).suffix.lower() in ['.cs','.csproj','.props','.targets','.md','.json','.yml','.yaml','.ps1','.slnx','.py']]; z=zipfile.ZipFile('artifacts/ar064/committed-source.zip','w',zipfile.ZIP_DEFLATED); rows=[]; [(z.writestr(p,b),rows.append({'path':p,'sha256':hashlib.sha256(b).hexdigest(),'blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()})) for p in selected for b in [subprocess.check_output(['git','show','HEAD:'+p])]]; z.close(); pathlib.Path('artifacts/ar064/source-receipt.json').write_text(json.dumps(rows,indent=2))"
          if ($LASTEXITCODE) { throw 'Source receipt failed' }
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE) { throw 'Restore failed' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar064/build.log
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Repeat lifecycle and chat then retain all AR regressions
        id: corpus
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$failed=@();$results=@()
          $cases=@('AR-064-1','AR-064-2','AR-064-3','CHAT-1','CHAT-2','CHAT-3','AR-051','AR-050','AR-040','AR-033','AR-032','AR-031','AR-030','AR-020','AR-012','AR-011','AR-010','AR-001')
          foreach($name in $cases) {
            $env:H2_AR064_EVIDENCE_DIR=Join-Path $PWD "artifacts/ar064/$name"
            $filter=if($name.StartsWith('CHAT')){'Agent chat'}else{$name.Substring(0,6)}
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $filter 2>&1 | Tee-Object "artifacts/ar064/$name.log"
            $exit=$LASTEXITCODE;$log=Get-Content "artifacts/ar064/$name.log" -Raw
            $match=[regex]::Match($log,'RESULT: (\d+) passed, (\d+) failed')
            $results+=@{name=$name;exit_code=$exit;result=$match.Value}
            if ($exit -ne 0 -or $log -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed') { $failed+=$name }
          }
          @{failed=$failed;results=$results} | ConvertTo-Json -Depth 8 | Set-Content artifacts/ar064/corpora-result.json
          if ($failed.Count) { throw ('Failed corpora: '+($failed -join ',')) }
      - name: Independently execute required Agent suites
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar064/agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR064-Lifecycle-Evidence
          path: artifacts/ar064/
          if-no-files-found: error
          retention-days: 14
