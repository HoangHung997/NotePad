name: AR-066 trusted source revision integration
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: [.github/workflows/h2-ar066-source-revision-delivery.yml]
permissions:
  contents: write
concurrency:
  group: h2-ar066-source-revision-delivery
  cancel-in-progress: false
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Integrate reviewed forward source revision patch on exact preimages
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def digest(path): return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          branch='feature/h2-agent-reliability-ar-000'
          head=git('rev-parse','HEAD')
          assert head==os.environ['GITHUB_SHA'] and git('rev-parse','HEAD^')=='e8392999218375ee717c21f077a4ba144e38f696'
          assert not git('status','--porcelain'), 'Dirty checkout: preserve existing work'
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==head,'Branch advanced; reconcile before writing'
          hashes={
            'experiments/H2AgentLab/Integration/H2ProductionAgentAdapter.cs':('ef2a7909c1ee3744bddfe7e43cba5141cebda656235eb6ea5392d91c73bd57d5','f4563f07c946b95340fa176b2e41c19d87da79ced949787529ebc41083df6575'),
            'experiments/H2AgentLab/Integration/H2ProductionToolSession.LiveResource.cs':('fb84281575d29de66fbda611d39adb13dbedbe8e21d74850a8ae20de5da5e05f','f81e836a6528a797fd21b8f5362c2449f7dc33e853d35aaf0458af0ae196c674'),
            'tests/H2Notes.Tests/H2AgentSteeringWireTests.cs':('c50acf364d4b0522a99fce95b6a62e65ce0d35c37350fe158b79b3e6e77671ff','77b52abcca373322268660a6b8a07f0a9f099733f02456424a971a61f19448cb')}
          for path,(before,after) in hashes.items(): assert digest(path)==before,path+' preimage mismatch'
          patch='tools/agent-reliability/ar066-source-revision.patch'
          assert digest(patch)=='e56659eadf50c05815f758ccee65d89ca1597746550c441562fdf63f0707b4bd','Patch transfer mismatch'
          subprocess.run(['git','apply','--check',patch],check=True)
          subprocess.run(['git','apply',patch],check=True)
          for path,(before,after) in hashes.items(): assert digest(path)==after,path+' postimage mismatch'
          assert set(git('diff','--name-only').splitlines())==set(hashes),'Unexpected changed files'
          subprocess.run(['git','diff','--check'],check=True)
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==head,'Concurrent branch change'
          git('config','user.name','H2 AR-066 implementation')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','add','--',*hashes],check=True)
          subprocess.run(['git','commit','-m','fix(AR-066): retain live source requirements across trusted user revision batches'],check=True)
          code=git('rev-parse','HEAD')
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==code,'Reconcile uncertain push; do not repeat'
          out=pathlib.Path('artifacts/ar066-revision-delivery');out.mkdir(parents=True,exist_ok=True)
          (out/'saved.json').write_text(json.dumps({'task':'AR-066','staging_sha':head,'code_sha':code,'hashes':hashes,'acceptance':'NOT_RUN','old_source_control':'NOT_RUN_TOOL_SAFETY_BLOCKED; not retried'},indent=2))
          print('Forward source revision patch saved',code,'; acceptance not upgraded')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR066-Source-Revision-Delivery
          path: artifacts/ar066-revision-delivery/
          if-no-files-found: error
          retention-days: 14
