name: AR-051 reviewed source delivery
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: [.github/workflows/h2-ar051-implementation.yml]
permissions:
  contents: write
concurrency:
  group: h2-ar051-delivery
  cancel-in-progress: false
jobs:
  delivery:
    if: github.repository == 'HoangHung997/NotePad'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply exact compile repair without changing assertions
        shell: python
        run: |
          import os,subprocess,pathlib,hashlib,json
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          branch='feature/h2-agent-reliability-ar-000';head=git('rev-parse','HEAD')
          assert os.environ['GITHUB_REF_NAME']==branch and head==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')=='78daa6a24b39d4a77c5caa032d68f52f407cceef'
          assert not git('status','--porcelain')
          changes=[('tests/H2Notes.Tests/H2AgentWorkCompactionTests.cs','ac03442a291d4514db5b80b269a1709caef39042d9089c21d83684bf11fdea89','using H2Notes.Core;','using H2Notes.Core;\nusing H2Notes.Avalonia;','168503c03574b1464b9949dd58099f32ef5504a8122e307ba53676e4340a5d07'),('experiments/H2AgentLab/Integration/H2HistoryRuntimeTools.cs','d807089f0648062dd75e8c3a5de5026d357f822b05e5044a52713b9c60783b1a','expectedHash = proofs[0].Sha256;','expectedHash = proofs[0].Sha256!;','ac2827a2c40eb065c85d5248254c374863c4b9bc1d095c2537884fdd57aa53aa')]
          pending={}
          for path,before,old,new,after in changes:
            b=subprocess.check_output(['git','show','HEAD:'+path]);assert hashlib.sha256(b).hexdigest()==before,path
            text=b.decode('utf-8');assert text.count(old)==1
            content=text.replace(old,new).encode('utf-8');assert hashlib.sha256(content).hexdigest()==after
            pending[path]=content
          for path,b in pending.items():pathlib.Path(path).write_bytes(b)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*pending],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(pending)
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==head
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','fix(AR-051): import production scope mapper in compaction tests'],check=True)
          code=git('rev-parse','HEAD');assert not git('status','--porcelain')
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==code
          out=pathlib.Path('artifacts/ar051-delivery');out.mkdir(parents=True,exist_ok=True)
          (out/'saved.json').write_text(json.dumps({'code_sha':code,'files':list(pending),'status':'ACTIVE / NOT_RUN'},indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR051-Source-Delivery
          path: artifacts/ar051-delivery/
          if-no-files-found: error
          retention-days: 14
