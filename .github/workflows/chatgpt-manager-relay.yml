name: ChatGPT Manager CI Relay

on:
  workflow_run:
    workflows:
      - Avalonia CI
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  relay:
    if: ${{ github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Post CI handoff to associated PR
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let pulls = Array.isArray(run.pull_requests) ? run.pull_requests : [];
            if (pulls.length === 0 && run.head_sha) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: run.head_sha,
                per_page: 100
              });
              pulls = associated.data;
            }

            const openPulls = pulls.filter(pr => !pr.state || pr.state === 'open');
            if (openPulls.length === 0) {
              core.info(`No associated open pull request for workflow run ${run.id} / ${run.head_sha}.`);
              return;
            }

            for (const pr of openPulls) {
              const issue_number = pr.number;
              const marker = `ci_run: ${run.id}`;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100
              });

              if (comments.some(c =>
                typeof c.body === 'string' &&
                c.body.includes('CI_HANDOFF: READY_FOR_MANAGER') &&
                c.body.includes(marker))) {
                core.info(`CI handoff for run ${run.id} already exists on PR #${issue_number}.`);
                continue;
              }

              const body = [
                'CI_HANDOFF: READY_FOR_MANAGER',
                `source_sha: ${run.head_sha}`,
                `ci_run: ${run.id}`,
                `workflow: ${run.name}`,
                `event: ${run.event}`,
                `conclusion: ${run.conclusion || 'unknown'}`,
                `run_url: ${run.html_url}`,
                '',
                'ChatGPT Manager: verify this run belongs to the current PR head before using it as evidence. If the SHA is stale, ignore it.'
              ].join('\n');

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });

              core.info(`Posted CI handoff for run ${run.id} to PR #${issue_number}.`);
            }
