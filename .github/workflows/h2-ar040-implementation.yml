name: AR-040 drain foundation integration and validation
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: [.github/workflows/h2-ar040-implementation.yml]
permissions:
  contents: read
concurrency:
  group: h2-ar040-implementation
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'HoangHung997/NotePad'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    outputs:
      code: ${{ steps.save.outputs.code }}
    env:
      GH_TOKEN: ${{ github.token }}
      CHECKED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Save exactly the reviewed foundation on unchanged feature branch
        id: save
        shell: python
        run: |
          import base64,datetime,hashlib,json,os,pathlib,re,subprocess
          R='HoangHung997/NotePad'; B='feature/h2-agent-reliability-ar-000'
          BASE='bb73bd10e039ada96e09f43109dca7bcd63f00a3'; MAIN='1283bc13e07c3cd47d04886166de3dfc595422c0'
          WF='.github/workflows/h2-ar040-implementation.yml'; TRACKER='docs/H2_AGENT_RELIABILITY_IMPLEMENTATION_TASKS.md'
          def require(ok,msg):
              if not ok: raise RuntimeError(msg)
          def git(*a): return subprocess.check_output(['git',*a],text=True,timeout=90).strip()
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def fetch(sha):
              r=json.loads(subprocess.check_output(['gh','api','repos/'+R+'/git/blobs/'+sha],timeout=60))
              b=base64.b64decode(r['content']);require(blob(b)==sha and len(b)<100000,'Blob mismatch');return b
          head=os.environ['CHECKED_HEAD']
          require(os.environ['GITHUB_REF']=='refs/heads/'+B,'Wrong branch')
          require(git('rev-parse','HEAD')==head and not git('status','--porcelain'),'Wrong or dirty checkout')
          require(git('rev-parse','HEAD^')==BASE and git('diff','--name-only',BASE,head)==WF,'Concurrent work; reconcile')
          require(git('ls-remote','origin','refs/heads/main').split()[0]==MAIN,'Main changed')
          require(git('ls-remote','origin','refs/heads/'+B).split()[0]==head,'Branch changed')
          entries=[
            ('experiments/H2AgentLab/Computer/ProcessShellCapabilities.cs','9b57fa3ed03e5ff08ba99d9ae820be271deb0fd9','30b762720ab0ac55707d69deb200fdb72b7f2560'),
            ('experiments/H2AgentLab/Integration/H2LocalCommandTool.cs','8633920615ec20fe5592629fd19c78ee4dd9e1fb','8c9c900528ff4cf2dde129a68962332adadd7078'),
            ('tests/H2Notes.Tests/Program.cs','e5f3f56b6668c9d0bbd597eb260e74cf3dd4431d','314e61f445fdb2e77e4315da912327280e10336e')]
          additions=[
            ('experiments/H2AgentLab/Computer/BoundedProcessExecution.cs','52d75548215bd16b1116803bc6951f8215641333'),
            ('tests/H2Notes.Tests/H2AgentProcessDrainTests.cs','a26e6fd29b939a7291430cbccc0f9140bf1b85ae')]
          for p,old,new in entries: require(blob(pathlib.Path(p).read_bytes())==old,'Preimage '+p)
          for p,sha in additions: require(not pathlib.Path(p).exists(),'New path exists '+p)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ar040-source';out.mkdir()
          patch=out/'reviewed.patch';patch.write_bytes(fetch('9f2232c3d34e4c4db623f3ad4efd6794fbb3a58e'))
          subprocess.run(['git','apply','--index','--check',str(patch)],check=True)
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          for p,sha in additions: pathlib.Path(p).write_bytes(fetch(sha))
          for p,old,new in entries: require(blob(pathlib.Path(p).read_bytes())==new,'Postimage '+p)
          for p,sha in additions: require(blob(pathlib.Path(p).read_bytes())==sha,'New source differs '+p)
          path=pathlib.Path(TRACKER);text=path.read_text();require(blob(path.read_bytes())=='2ba1679102ce7161c875c1e10eb839030b6e1919','Tracker changed')
          m=re.search(r'```yaml\n(\{.*?\n\})\n```',text,re.S);require(m is not None,'Missing handoff')
          state=json.loads(m.group(1));require(state['active_task']=='AR-040' and state['implementation_status']=='NOT_STARTED','Task moved')
          state.update(phase='AR-040_ACTIVE_DRAIN_FOUNDATION',implementation_status='ACTIVE',acceptance_status='NOT_RUN',
            owner_session='chatgpt-ar040-resume-2026-09-23',checkpoint_saved_at_utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),
            working_tree='Clean CI checkout before reviewed integration; normal push verified. User-PC tree NOT_ACCESSIBLE.',
            uncommitted_files=[],foundation_source_parent=head,
            remaining_in_active_task=['Run drain tests and all regressions on saved code; fix every failure.','Implement stable long-job start/poll/read_output/cancel/result, stdin opt-in, lifetime/no-progress bounds and journal ownership in existing services.'],
            next_exact_action='Continue only AR-040 on existing branch/PR #3. Inspect this integration and full CI, repair actual failures, then complete long-job APIs in existing process service. Do not mark DONE for drain foundation alone. AR-020/033 E3 pending; AR-083 deferred.')
          text=text[:m.start(1)]+json.dumps(state,ensure_ascii=False,indent=2)+text[m.end(1):]
          text=text.replace('| AR-040 | Job/process dài có session thật | 011/031 | E2 + process thật | NOT_STARTED |','| AR-040 | Job/process dài có session thật | 011/031 | E2 + process thật | ACTIVE |')
          path.write_text(text,encoding='utf-8')
          review='docs/agent-reliability/AR-040/implementation.md';pathlib.Path(review).parent.mkdir(parents=True,exist_ok=True)
          pathlib.Path(review).write_text('# AR-040 — owned process lifecycle\n\nStatus: ACTIVE / PARTIAL / NOT_RUN at integration. Reuses the existing process service and local command tool. Shared bounded capture drains both pipes past retention caps, validates before dispatch and preserves cancellation/EOF/completeness separately. Twelve owned disposable subprocess cases are registered; no test PASS is claimed until logs are read.\n\nThe earlier local drain patch is integrated; do not reapply it. Long-job identity/poll/output/stdin, explicit owner lifetime and durable receipts remain to implement in AR-040. No E3/E4/E5 claim, model call, credential, personal document or new truth store. AR-020/033 E3 pending; AR-083 DEFERRED_BY_USER.\n',encoding='utf-8')
          allowed={p for p,old,new in entries}|{p for p,sha in additions}|{TRACKER,review}
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          require(set(git('diff','--cached','--name-only').splitlines())==allowed,'Unexpected stage')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          require(git('ls-remote','origin','refs/heads/'+B).split()[0]==head,'Concurrent branch work')
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','commit','-m','fix(AR-040): drain bounded output and preserve owned-process cancellation'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+B],check=True,timeout=120)
          code=git('rev-parse','HEAD');require(not git('status','--porcelain') and git('ls-remote','origin','refs/heads/'+B).split()[0]==code,'Save mismatch')
          (out/'saved.json').write_text(json.dumps({'code_sha':code,'entries':entries,'additions':additions,'tests':'NOT_RUN_AT_SAVE'},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('code='+code+'\n')
      - name: Run unchanged full CI on saved source
        run: gh api -X POST repos/HoangHung997/NotePad/actions/workflows/avalonia-ci.yml/dispatches -f ref=feature/h2-agent-reliability-ar-000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR040-Foundation-Delivery
          path: ${{ runner.temp }}/ar040-source/
          if-no-files-found: error
          retention-days: 14
  validate:
    needs: integrate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.code }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Exact source receipt and build
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';New-Item -ItemType Directory -Force artifacts/ar040 | Out-Null
          if (git status --porcelain) { throw 'Dirty checkout' }
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';task='AR-040 PARTIAL';E1='NOT_CLAIMED';E2='Owned subprocesses';E3='NOT_RUN';E4='NOT_RUN';E5='AR-083 DEFERRED_BY_USER'} | ConvertTo-Json | Set-Content artifacts/ar040/identity.json
          git ls-files -s | Set-Content artifacts/ar040/source-index.txt
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE) { throw 'Restore failed' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar040/build.log
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Repeat actual owned-process corpus and retained regressions
        id: corpus
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$failed=@()
          foreach($name in 'AR-040-1','AR-040-2','AR-040-3','AR-033','AR-032','AR-031','AR-030','AR-020','AR-012','AR-011','AR-010','AR-001') {
            $env:H2_AR040_EVIDENCE_DIR=Join-Path $PWD "artifacts/ar040/$name"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $name.Substring(0,6) 2>&1 | Tee-Object "artifacts/ar040/$name.log"
            $exit=$LASTEXITCODE;$expected=if($name.StartsWith('AR-040')){'RESULT: 12 passed, 0 failed'}else{'RESULT: [1-9][0-9]* passed, 0 failed'}
            if($exit -ne 0 -or (Get-Content "artifacts/ar040/$name.log" -Raw) -notmatch $expected){$failed+=$name}
          }
          @{failed=$failed;scope='Drain foundation, not whole AR-040 acceptance'}|ConvertTo-Json|Set-Content artifacts/ar040/corpus.json
          if($failed.Count){throw ('Failed: '+($failed -join ','))}
      - name: Independent required Agent suites
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar040/agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR040-Foundation-Evidence
          path: artifacts/ar040/
          if-no-files-found: error
          retention-days: 14
