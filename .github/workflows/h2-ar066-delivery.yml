name: AR-066 guarded core delivery
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: [.github/workflows/h2-ar066-delivery.yml]
permissions:
  contents: write
concurrency:
  group: h2-ar066-delivery
  cancel-in-progress: false
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify preimages and deliver only reviewed AR066 source and handoff
        run: python tools/agent-reliability/deliver_ar066_once.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR066-Delivery-Receipt
          path: artifacts/ar066-delivery/
          if-no-files-found: error
          retention-days: 14
