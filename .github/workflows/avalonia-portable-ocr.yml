name: Avalonia Full Portable OCR

on:
  push:
    branches:
      - feature/nas-multi-device-sync
    paths:
      - '.github/workflows/avalonia-portable-ocr.yml'
      - 'tools/ocr/**'
      - 'src/H2Notes.Core/PortableOcrRuntime.cs'
      - 'src/H2Notes.Core/AiPdf.cs'
      - 'src/H2Notes.Avalonia/H2Notes.Avalonia.csproj'
  workflow_dispatch:

jobs:
  build-portable:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python 3.12 for bundle build only
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and smoke all three offline OCR engines
        shell: pwsh
        run: .\tools\ocr\build-portable-runtime.ps1 -Root .\tools\ocr\runtime -Force

      - name: Publish self-contained Avalonia win-x64
        shell: pwsh
        run: dotnet publish .\src\H2Notes.Avalonia\H2Notes.Avalonia.csproj -c Release -r win-x64 --self-contained true -o .\artifacts\H2Notes-Avalonia-Full-Portable

      - name: Verify bundled runtime and executable
        shell: pwsh
        run: |
          if (!(Test-Path .\artifacts\H2Notes-Avalonia-Full-Portable\H2Notes.Avalonia.exe)) { throw 'Missing executable' }
          if (!(Test-Path .\artifacts\H2Notes-Avalonia-Full-Portable\ocr-runtime\runtime.json)) { throw 'Missing portable OCR runtime' }
          $runtime = Get-Content .\artifacts\H2Notes-Avalonia-Full-Portable\ocr-runtime\runtime.json -Raw | ConvertFrom-Json
          foreach ($name in @('got-ocr','docling','mineru')) {
            if (!$runtime.engines.$name.ready) { throw "OCR engine not ready: $name" }
          }

      - name: Upload full portable H2 Notes
        uses: actions/upload-artifact@v4
        with:
          name: H2Notes-Avalonia-Full-Portable-win-x64
          path: artifacts/H2Notes-Avalonia-Full-Portable/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
