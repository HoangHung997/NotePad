name: AR-012 scoped binding validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h2-ar012-validation.yml'
      - 'tools/agent-reliability/ar012-*'
      - 'src/**'
      - 'experiments/**'
      - 'tests/**'
permissions:
  contents: read
concurrency:
  group: h2-ar012-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  delivery:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    outputs:
      sha: ${{ steps.patch.outputs.sha }}
    env:
      AR_HEAD: ${{ github.event.pull_request.head.sha }}
      AR_BRANCH: feature/h2-agent-reliability-ar-000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Transfer prior local draft with exact preimages, no reset or overwrite
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, datetime, gzip, hashlib, json, os, subprocess
          from pathlib import Path
          def git(*a): return subprocess.check_output(['git', *a], text=True).strip()
          def require(ok, message):
              if not ok: raise RuntimeError(message)
          head=os.environ['AR_HEAD']; branch=os.environ['AR_BRANCH']
          require(git('rev-parse','HEAD')==head and not git('status','--porcelain'), 'Dirty or unexpected checkout')
          require(branch=='feature/h2-agent-reliability-ar-000', 'Wrong branch')
          if Path('src/H2Notes.Core/H2AgentResourceBinding.cs').exists():
              with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('sha='+head+'\n')
              print('Draft already transferred; only validate the current immutable checkout.')
              raise SystemExit(0)
          base='d5aa1003c912ca1a695d3d5c3eb4f0b8d6ab6bca'
          require(git('ls-remote','origin','refs/heads/main').split()[0]=='1283bc13e07c3cd47d04886166de3dfc595422c0','Main changed; reconcile first')
          require(git('ls-remote','origin','refs/heads/'+branch).split()[0]==head,'Branch changed; preserve other work')
          require(not git('diff','--name-only',base,'HEAD','--','src','experiments','tests','docs'), 'Code or checkpoint changed; reconcile first')
          data=''.join(Path('tools/agent-reliability/ar012-draft-'+str(i)+'.b64').read_text() for i in range(4))
          patch=gzip.decompress(base64.b64decode(data,validate=True))
          require(hashlib.sha256(patch).hexdigest()=='60168ea2645e0f96b1e5226716d56d19e2b833debfe29304d96afc1ee67cab06','Draft payload mismatch')
          require(len(patch)<100000,'Unbounded patch')
          source=['experiments/H2AgentLab/Integration/H2ProductionAgentAdapter.cs','experiments/H2AgentLab/Integration/H2ProductionToolSession.cs','experiments/H2AgentLab/LabSession.cs','src/H2Notes.Avalonia/App.axaml.cs','src/H2Notes.Core/H2AgentAdapter.cs','src/H2Notes.Core/H2AgentTargetScope.cs','src/H2Notes.Core/H2AgentResourceBinding.cs','tests/H2Notes.Tests/H2AgentResourceBindingTests.cs','tests/H2Notes.Tests/H2WorkAssistantRepairTests.cs','tests/H2Notes.Tests/Program.cs']
          require({line.split(' b/',1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')}==set(source),'Unexpected patch paths')
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          tracker=Path('docs/H2_AGENT_RELIABILITY_IMPLEMENTATION_TASKS.md'); text=tracker.read_text()
          start=text.index('```yaml\n',text.index('## 7. SESSION HANDOFF'))+len('```yaml\n');end=text.index('\n```',start)
          state=json.loads(text[start:end]);require(state['active_task']=='AR-012' and state['implementation_status']=='NOT_STARTED','Another active checkpoint exists')
          state.update(phase='AR-012_ACTIVE_RESUMED_DRAFT', implementation_status='ACTIVE',acceptance_status='NOT_RUN',owner_session='chatgpt-ar012-resume-2026-09-22',completed_this_session=[],uncommitted_files=[],checkpoint_saved_at_utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),working_tree='Resumed local draft applied in a clean GitHub checkout with exact preimages. Candidate is untested until Windows CI finishes; user-PC working tree NOT_ACCESSIBLE.',next_exact_action='Continue AR-012 only. Inspect actual build/focused results; finish ResolveOpen Office/desktop integration and real external-target UI projection. Add path/provider regressions and full required CI. Do not close AR-012 based on the untested local draft.',remaining_in_active_task=['Compile and execute the 19 resumed AR-012 cases; none previously ran.','Wire resolver into production Office and desktop; keep native discovery support gaps explicit.','Expose external binding in existing activity/chips and test path aliases/reparse behavior.','Review exact-source full CI/publish/helper evidence before acceptance.'])
          state['current_candidate_commit_lookup']='git log -1 --format=%H -- src/H2Notes.Core/H2AgentResourceBinding.cs'
          text=text[:start]+json.dumps(state,ensure_ascii=False,indent=2)+text[end:]
          text=text.replace('| AR-012 | Scope + resource binding nền | 011 | E1/E2 | NOT_STARTED |','| AR-012 | Scope + resource binding nền | 011 | E1/E2 | ACTIVE |',1).replace('### [ ] AR-012','### [~] AR-012',1)
          tracker.write_text(text)
          subprocess.run(['git','add','--',*source,str(tracker)],check=True)
          require(set(git('diff','--cached','--name-only').splitlines())==set(source+[str(tracker)]),'Unexpected staged files')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','commit','-m','feat(AR-012): resume scoped-binding draft for Windows validation'],check=True)
          require(git('ls-remote','origin','refs/heads/'+branch).split()[0]==head,'Concurrent update; no push')
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          saved=git('rev-parse','HEAD');require(not git('status','--porcelain'),'Unexpected uncommitted work')
          require(git('ls-remote','origin','refs/heads/'+branch).split()[0]==saved,'Remote mismatch')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('sha='+saved+'\nchanged=true\n')
          print('Saved AR-012 draft:',saved,'; acceptance NOT_RUN')
          PY
      - name: Run unchanged full required workflow on saved code
        if: steps.patch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run avalonia-ci.yml --ref "$AR_BRANCH"
  bindings:
    needs: delivery
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.delivery.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record exact source and compile
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar012 | Out-Null
          if (git status --porcelain) { throw 'Dirty test checkout' }
          @{code_sha=(git rev-parse HEAD); working_tree='CLEAN'; os=[Environment]::OSVersion.VersionString; level='E1/E2 fixtures only; native Office/model/H2 UI/E5 NOT_RUN'} | ConvertTo-Json | Set-Content artifacts/ar012/identity.json
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE) { throw 'Restore failed' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar012/build.log
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Execute binding and retained corpora without masking failure
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $failures=@()
          foreach ($task in 'AR-012','AR-011','AR-010','AR-001') {
            $log="artifacts/ar012/$task.log"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $task 2>&1 | Tee-Object $log
            $exit=$LASTEXITCODE
            if ($exit -ne 0 -or (Get-Content $log -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed') { $failures += $task }
          }
          if ($failures.Count) { throw ('Failed corpora: '+($failures -join ', ')) }
      - name: Independent required Agent suites
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar012/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR012-E1-E2-Evidence
          path: artifacts/ar012/
          if-no-files-found: error
          retention-days: 14
