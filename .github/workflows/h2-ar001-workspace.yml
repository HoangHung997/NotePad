name: AR-001 isolated implementation workspace
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h2-ar001-workspace.yml'
      - 'tools/agent-reliability/apply_ar001.py'
      - 'tools/agent-reliability/Ar001Contracts.cs.txt'
permissions:
  contents: read
concurrency:
  group: h2-ar001-workspace
  cancel-in-progress: false
jobs:
  workspace:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      AR_BRANCH: feature/h2-agent-reliability-ar-000
      AR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply guarded AR-001 source and test changes
        id: apply
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 tools/agent-reliability/apply_ar001.py
          if test -f "$RUNNER_TEMP/ar001-outputs.txt"; then
            test "$(git ls-remote origin "refs/heads/$AR_BRANCH" | cut -f1)" = "$AR_HEAD"
            mapfile -t outputs < "$RUNNER_TEMP/ar001-outputs.txt"
            test "${#outputs[@]}" -eq 19
            git add -- "${outputs[@]}"
            git diff --cached --check
            test "$(git diff --cached --name-only | wc -l)" -eq 19
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(AR-001): unify tool contracts and drain owned tasks before fixture cleanup'
            git push origin "HEAD:refs/heads/$AR_BRANCH"
            test -z "$(git status --porcelain)"
            test "$(git ls-remote origin "refs/heads/$AR_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "Committed source: $(git rev-parse HEAD)"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch existing full Avalonia CI on the saved branch
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request(
              'https://api.github.com/repos/HoangHung997/NotePad/actions/workflows/avalonia-ci.yml/dispatches',
              data=json.dumps({'ref':os.environ['AR_BRANCH']}).encode(), method='POST',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json',
                       'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=30) as result:
              if result.status != 204: raise SystemExit('Workflow dispatch was not accepted')
          print('Full existing Avalonia CI requested on committed AR-001 branch; no success is inferred.')
          PY
      - name: Export bounded tracked source and exact patch for review
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'ar001-workspace';root.mkdir(exist_ok=True)
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          suffixes={'.cs','.csproj','.slnx','.sln','.props','.targets','.axaml','.json','.md','.yml','.yaml','.py','.ps1','.sh','.cmd','.txt','.config'}
          manifest={'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'branch':os.environ['AR_BRANCH'],'files':{}}
          with zipfile.ZipFile(root/'source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in paths:
                  if not name: continue
                  path=Path(name)
                  if path.is_symlink() or not path.is_file() or path.stat().st_size>2000000: continue
                  if any(part in {'bin','obj','.git','.artifacts','audit-evidence'} for part in path.parts): continue
                  if path.suffix.lower() not in suffixes and name!='.gitignore': continue
                  data=path.read_bytes()
                  try: data.decode('utf-8-sig')
                  except UnicodeDecodeError: continue
                  archive.writestr(name,data)
                  manifest['files'][name]={'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)}
              archive.writestr('AR001_SOURCE_MANIFEST.json',json.dumps(manifest,indent=2))
          patch=subprocess.check_output(['git','diff','--binary','e573394963ea44398217721ed5f200f899234d31','--','src','experiments','tests','docs','.github/workflows/avalonia-ci.yml'])
          (root/'implementation.patch').write_bytes(patch)
          print('Exact checkout:',manifest['head'],'; source files:',len(manifest['files']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ar001-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ar001-workspace/
          if-no-files-found: error
          retention-days: 7
