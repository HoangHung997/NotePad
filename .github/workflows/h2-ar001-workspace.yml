name: AR-001 isolated implementation workspace
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h2-ar001-workspace.yml'
      - 'tools/agent-reliability/repair_ar001.py'
      - 'tests/H2Notes.Tests/H2AgentReliabilityContractTests.cs'
      - 'tests/H2Notes.Tests/H2WorkAssistantRepairTests.cs'
      - 'experiments/H2AgentLab/Integration/**'
      - 'experiments/H2AgentLab/Tools/ToolExecutionScheduler.cs'
permissions:
  contents: read
concurrency:
  group: h2-ar001-workspace
  cancel-in-progress: false
jobs:
  workspace:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    outputs:
      code_sha: ${{ steps.apply.outputs.code_sha }}
    env:
      AR_BRANCH: feature/h2-agent-reliability-ar-000
      AR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply exact observed AR-001 repair without overwriting other changes
        id: apply
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 tools/agent-reliability/repair_ar001.py
          if test -f "$RUNNER_TEMP/ar001-outputs.txt"; then
            test "$(git ls-remote origin "refs/heads/$AR_BRANCH" | cut -f1)" = "$AR_HEAD"
            mapfile -t outputs < "$RUNNER_TEMP/ar001-outputs.txt"
            test "${#outputs[@]}" -eq 4
            git add -- "${outputs[@]}"
            git diff --cached --check
            test "$(git diff --cached --name-only | wc -l)" -eq 4
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(AR-001): remove UI context dependency from executor and provider teardown'
            git push origin "HEAD:refs/heads/$AR_BRANCH"
            test -z "$(git status --porcelain)"
            test "$(git ls-remote origin "refs/heads/$AR_BRANCH" | cut -f1)" = "$(git rev-parse HEAD)"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
          echo "code_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Saved source: $(git rev-parse HEAD)"
      - name: Dispatch unchanged full Avalonia CI on saved source
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          request=urllib.request.Request('https://api.github.com/repos/HoangHung997/NotePad/actions/workflows/avalonia-ci.yml/dispatches',
              data=json.dumps({'ref':os.environ['AR_BRANCH']}).encode(),method='POST',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=30) as response:
              if response.status!=204: raise SystemExit('Full CI dispatch not accepted')
          print('Full CI dispatched; results must be checked, not inferred.')
          PY
      - name: Retain exact source checkpoint and patch
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ar001-delivery"
          git rev-parse HEAD > "$RUNNER_TEMP/ar001-delivery/code-sha.txt"
          git status --porcelain > "$RUNNER_TEMP/ar001-delivery/working-tree.txt"
          git diff --binary 88cc6241d9488e26e0652751a7c14c26df4aecb3 -- experiments tests docs > "$RUNNER_TEMP/ar001-delivery/repair.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR001-Repair-Delivery
          path: ${{ runner.temp }}/ar001-delivery/
          if-no-files-found: error
          retention-days: 14
  focused-tests:
    needs: workspace
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.workspace.outputs.code_sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Record exact source and build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ar001 | Out-Null
          git rev-parse HEAD | Set-Content artifacts/ar001/code-sha.txt
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar001/build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
      - name: Repeat RC-02 and teardown regression three times
        shell: pwsh
        run: |
          foreach ($iteration in 1..3) {
            $log = "artifacts/ar001/rc02-$iteration.txt"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter AR-001 2>&1 | Tee-Object $log
            if ($LASTEXITCODE -ne 0) { throw "AR-001 iteration $iteration failed." }
            if (-not (Select-String -Path $log -Pattern 'RESULT: [1-9][0-9]* passed, 0 failed')) { throw 'No nonempty passing corpus.' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR001-Focused-E1-E2-Evidence
          path: artifacts/ar001/
          if-no-files-found: error
          retention-days: 14
