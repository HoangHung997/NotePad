name: AR-011 one-time scoped delivery and validation
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/h2-ar011-delivery.yml', 'tools/agent-reliability/ar011-delivery-*.b64']
permissions:
  contents: read
concurrency:
  group: h2-ar011-scoped-delivery
  cancel-in-progress: false
jobs:
  delivery:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    outputs:
      code: ${{ steps.apply.outputs.code }}
    env:
      AR_HEAD: ${{ github.event.pull_request.head.sha }}
      AR_BRANCH: feature/h2-agent-reliability-ar-000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply hash-verified source only without overwriting other work
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def require(ok, message):
              if not ok: raise RuntimeError(message)
          base='4b2c3d138352191d4668a23df72f7b7d489d6820'
          branch=os.environ['AR_BRANCH']; head=os.environ['AR_HEAD']
          require(git('rev-parse','HEAD')==head and not git('status','--porcelain'), 'Wrong/dirty checkout')
          if Path('tests/H2Notes.Tests/H2AgentToolOutcomeTests.cs').exists():
              print('Delivery already present; no source or task checkpoint replay.')
              raise SystemExit(0)
          require(git('ls-remote','origin','refs/heads/'+branch).split()[0]==head, 'Branch advanced; reconcile first')
          require(git('ls-remote','origin','refs/heads/main').split()[0]=='1283bc13e07c3cd47d04886166de3dfc595422c0', 'Main advanced; reconcile first')
          allowed={'.github/workflows/h2-ar011-delivery.yml',*[f'tools/agent-reliability/ar011-delivery-{i}.b64' for i in range(4)]}
          require(set(git('diff','--name-only',base,'HEAD').splitlines())<=allowed, 'Other worker changes detected')
          encoded=''.join(Path(f'tools/agent-reliability/ar011-delivery-{i}.b64').read_text().strip() for i in range(4))
          require(len(encoded)==30680,'Incomplete reviewed transfer')
          raw=lzma.decompress(base64.b64decode(encoded,validate=True),memlimit=268435456)
          require(len(raw)<150000 and hashlib.sha256(raw).hexdigest()=='8dc26b2f151159ae39069a532a2dd560f7fd0dee949a42daa787c316ba80cdc4','Reviewed text manifest mismatch')
          entries=json.loads(raw); require(len(entries)==24,'Unexpected path inventory')
          writes={}
          for entry in entries:
              path=Path(entry['path'])
              require(not path.is_absolute() and '..' not in path.parts and path.parts[0] in ['src','experiments','tests','docs'], 'Out of scope path')
              require(path.suffix in ['.cs','.md'] and not path.is_symlink(), 'Not a scoped text source file')
              before=path.read_bytes() if path.exists() else None
              require((None if before is None else hashlib.sha256(before).hexdigest())==entry['before'],'Source drift: '+str(path))
              lines=(before or b'').decode('utf-8').splitlines(keepends=True)
              for start,end,text in reversed(entry['edits']): lines[start:end]=[text]
              after=''.join(lines).encode('utf-8')
              require(hashlib.sha256(after).hexdigest()==entry['after'],'Output differs: '+str(path))
              require(str(path) not in writes,'Duplicate source path')
              writes[str(path)]=after
          for name,data in writes.items():
              path=Path(name); path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(data)
          subprocess.run(['git','add','--',*writes],check=True)
          require(set(git('diff','--cached','--name-only').splitlines())==set(writes),'Unexpected staged source')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          out=Path(os.environ['RUNNER_TEMP'])/'ar011-delivery';out.mkdir(exist_ok=True)
          out.joinpath('source.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          require(git('ls-remote','origin','refs/heads/'+branch).split()[0]==head,'Concurrent work; keep patch and reconcile')
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','feat(AR-011): preserve typed effects readiness and outcome evidence through runtime')
          git('push','origin','HEAD:refs/heads/'+branch)
          code=git('rev-parse','HEAD');require(not git('status','--porcelain'),'Dirty delivery tree')
          require(git('ls-remote','origin','refs/heads/'+branch).split()[0]==code,'Remote source not verified')
          out.joinpath('identity.json').write_text(json.dumps({'tested_source_pending':code,'files':list(writes),'working_tree':'CLEAN','status':'AWAITING_CI'},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('code='+code+'\n')
          print('Saved exact implementation source:',code,'; acceptance NOT_RUN')
          PY
      - name: Dispatch existing full required CI on saved source
        if: steps.apply.outputs.code != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/HoangHung997/NotePad/actions/workflows/avalonia-ci.yml/dispatches -f ref="$AR_BRANCH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR011-Delivery-Evidence
          path: ${{ runner.temp }}/ar011-delivery/
          if-no-files-found: warn
          retention-days: 14
  validation:
    needs: delivery
    if: needs.delivery.outputs.code != ''
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.delivery.outputs.code }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record exact checkout and build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar011 | Out-Null
          if (git status --porcelain) { throw 'Dirty test checkout' }
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';evidence='E1/E2 fixtures only, native Office/model NOT_RUN'} | ConvertTo-Json | Set-Content artifacts/ar011/identity.json
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE) { throw 'Restore failed' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar011/build.log
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Repeat AR-011 and preserved AR regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($i in 1..3) {
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter AR-011 2>&1 | Tee-Object "artifacts/ar011/AR-011-$i.log"
            if ($LASTEXITCODE) { throw "AR-011 iteration $i failed" }
          }
          foreach ($id in 'AR-010','AR-001') {
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $id 2>&1 | Tee-Object "artifacts/ar011/$id.log"
            if ($LASTEXITCODE) { throw "$id regression failed" }
          }
      - name: Run every required Agent suite independently with final failure aggregation
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar011/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR011-E1-E2-Evidence
          path: artifacts/ar011/
          if-no-files-found: error
          retention-days: 14
