name: AR-030 outcome and revision validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h2-ar030-validation.yml'
      - 'src/**'
      - 'experiments/**'
      - 'tests/**'
permissions:
  contents: read
concurrency:
  group: h2-ar030-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  goals:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record exact identity and build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar030 | Out-Null
          if (git status --porcelain) { throw 'Dirty checkout' }
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';os=[Environment]::OSVersion.VersionString;E1='Immutable goal-state tests';E2='Concrete production/file execution; scripted transport and one explicitly injected criterion verifier';E3='NOT_RUN';E4='NOT_RUN';E5='AR-083 DEFERRED_BY_USER'} | ConvertTo-Json | Set-Content artifacts/ar030/identity.json
          dotnet --info | Set-Content artifacts/ar030/dotnet-info.txt
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE) { throw 'Restore failed' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar030/build.log
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Reproduce missing compound goals without disabling unrelated runtime safety
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='experiments/H2AgentLab/Tasking/AgentGoalState.cs'
          $original=[IO.File]::ReadAllBytes((Resolve-Path $path))
          try {
            $text=[Text.Encoding]::UTF8.GetString($original)
            $anchor='if(HasOutcomes || clauses.Length>1 && WorkVerb.IsMatch(text))'
            if (($text.Split($anchor).Count-1) -ne 1) { throw 'Mutation-control anchor drift' }
            [IO.File]::WriteAllText((Join-Path $PWD $path),$text.Replace($anchor,'if(false && (HasOutcomes || clauses.Length>1 && WorkVerb.IsMatch(text)))'))
            @{source_sha=(git rev-parse HEAD);kind='EXTRACTION_ONLY_MUTATION_CONTROL';path=$path;not_historical_checkout=$true} | ConvertTo-Json | Set-Content artifacts/ar030/negative-identity.json
            dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar030/negative-build.log
            if ($LASTEXITCODE) { throw 'A compile failure is not a valid negative control' }
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter 'AR-030 RC-11 production' 2>&1 | Tee-Object artifacts/ar030/negative.log
            $code=$LASTEXITCODE;$log=Get-Content artifacts/ar030/negative.log -Raw
            if ($code -eq 0 -or $log -notmatch 'RESULT: 0 passed, 2 failed' -or -not $log.Contains('Incomplete request completed.')) { throw 'Expected production false-completion counterexample missing' }
          } finally {
            [IO.File]::WriteAllBytes((Join-Path $PWD $path),$original)
          }
          if (git status --porcelain) { throw 'Positive checkout not restored clean' }
          'CLEAN: original checkout bytes restored' | Set-Content artifacts/ar030/restored.txt
      - name: Repeat exact positive source and retained regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar030/positive-build.log
          if ($LASTEXITCODE) { throw 'Positive rebuild failed' }
          $failed=@()
          foreach($name in 'AR-030-1','AR-030-2','AR-030-3','AR-020','AR-012','AR-011','AR-010','AR-001') {
            $task=$name.Substring(0,6)
            $env:H2_AR030_EVIDENCE_DIR=Join-Path $PWD "artifacts/ar030/$name"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $task 2>&1 | Tee-Object "artifacts/ar030/$name.log"
            if ($LASTEXITCODE -ne 0 -or (Get-Content "artifacts/ar030/$name.log" -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed') { $failed+=$name }
          }
          if ($failed.Count) { throw ('Failed corpora: '+($failed -join ',')) }
      - name: Run all mandatory independent Agent suites
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar030/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR030-E1-E2-Evidence
          path: artifacts/ar030/
          if-no-files-found: error
          retention-days: 14
