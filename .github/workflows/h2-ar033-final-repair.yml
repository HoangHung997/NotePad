name: AR-033 receipt and preservation validation
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: ['.github/workflows/h2-ar033-final-repair.yml']
permissions:
  contents: read
concurrency:
  group: h2-ar033-final-repair
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'HoangHung997/NotePad' && github.ref == 'refs/heads/feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    outputs:
      code: ${{ steps.save.outputs.code }}
    env:
      GH_TOKEN: ${{ github.token }}
      CHECKED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Save reviewed four-file refinement on unchanged branch
        id: save
        shell: python
        run: |
          import base64,gzip,hashlib,io,json,os,pathlib,subprocess
          REPO='HoangHung997/NotePad';BRANCH='feature/h2-agent-reliability-ar-000';BASE='5e142678157862ade7c117691a79dac08b3d0041'
          WF='.github/workflows/h2-ar033-final-repair.yml';MAIN='1283bc13e07c3cd47d04886166de3dfc595422c0'
          def require(ok,msg):
              if not ok: raise RuntimeError(msg)
          def git(*a): return subprocess.check_output(['git',*a],text=True,timeout=90).strip()
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          head=os.environ['CHECKED_HEAD']
          require(git('rev-parse','HEAD')==head and not git('status','--porcelain'),'Wrong or dirty checkout')
          require(git('rev-parse','HEAD^')==BASE and git('diff','--name-only',BASE,head)==WF,'Concurrent work; reconcile')
          require(git('ls-remote','origin','refs/heads/main').split()[0]==MAIN,'Main changed')
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'Branch changed')
          pinned='3c341410eb6cd5e8b5c4117512d4535c8350c3d8'
          r=json.loads(subprocess.check_output(['gh','api','repos/'+REPO+'/git/blobs/'+pinned],timeout=60))
          transfer=base64.b64decode(r['content']);require(blob(transfer)==pinned and len(transfer)==4712,'Transfer hash')
          compressed=base64.b64decode(transfer,validate=True);require(len(compressed)==3533,'Transfer size')
          with gzip.GzipFile(fileobj=io.BytesIO(compressed)) as f:
              patch=f.read(12195);require(len(patch)==12194 and f.read(1)==b'','Patch size')
          require(hashlib.sha256(patch).hexdigest()=='3067fc308afd9a6a450779c9c9d3bd419c2fc44d50def78eda5a3ec16a7df5f5','Patch identity')
          entries=[
              ('experiments/H2AgentLab/Runtime/AgentCompletionAssessment.cs','89f615718cbb82f9f7a16dfd3a6c087230e526d5','2fbfd682c5ac3880fe46297315c8ca5c34692be5'),
              ('experiments/H2AgentLab/Runtime/AgentRuntime.cs','462db94d63076e330bce41dfce7a32502e10f166','36c8678fb85518101b4d3649e9012de9d44e52a4'),
              ('experiments/H2AgentLab/Runtime/MbRepairRuntimeTests.cs','d314fcf1855dccaddd7caf39f8cdde13bdbdba41','17e0bfb21427854812dbeaa958642cd9ee63f718'),
              ('tests/H2Notes.Tests/H2AgentCompletionTests.cs','3397a23b30ef23650899f3f65d302f5a3d357530','c6e73453bdae74dcdc597433ffa559cfa590a37f')]
          for p,old,new in entries: require(blob(pathlib.Path(p).read_bytes())==old,'Preimage '+p)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ar033-final-source';out.mkdir()
          pf=out/'reviewed.patch';pf.write_bytes(patch)
          subprocess.run(['git','apply','--index','--check',str(pf)],check=True);subprocess.run(['git','apply','--index',str(pf)],check=True)
          for p,old,new in entries: require(blob(pathlib.Path(p).read_bytes())==new,'Postimage '+p)
          require(set(git('diff','--cached','--name-only').splitlines())=={e[0] for e in entries},'Stage differs')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'Concurrent work')
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','commit','-m','fix(AR-033): retain native receipts and require target-aware current proof'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+BRANCH],check=True,timeout=120)
          code=git('rev-parse','HEAD');require(not git('status','--porcelain') and git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==code,'Save differs')
          (out/'saved.json').write_text(json.dumps({'code_sha':code,'entries':entries,'tests':'NOT_RUN_AT_SAVE'},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('code='+code+'\n')
      - name: Dispatch unchanged full CI
        run: gh api -X POST repos/HoangHung997/NotePad/actions/workflows/avalonia-ci.yml/dispatches -f ref=feature/h2-agent-reliability-ar-000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR033-Final-Source
          path: ${{ runner.temp }}/ar033-final-source/
          if-no-files-found: error
          retention-days: 14
  validation:
    needs: integrate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.code }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Exact source receipt and build
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';New-Item -ItemType Directory -Force artifacts/ar033 | Out-Null
          if (git status --porcelain) { throw 'Dirty checkout' }
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';E1='Target proof preservation';E2='Production temp files and scripted transport; fixture verifier explicitly labelled';E3='NOT_RUN';E4='NOT_RUN';E5='AR-083 DEFERRED_BY_USER'} | ConvertTo-Json | Set-Content artifacts/ar033/identity.json
          python -c "import hashlib,json,pathlib,subprocess,zipfile; paths=subprocess.check_output(['git','ls-files'],text=True).splitlines(); selected=[p for p in paths if pathlib.Path(p).suffix.lower() in ['.cs','.csproj','.props','.targets','.md','.json','.yml','.yaml','.ps1','.slnx']]; z=zipfile.ZipFile('artifacts/ar033/committed-source.zip','w',zipfile.ZIP_DEFLATED); rows=[]; [(z.writestr(p,b),rows.append({'path':p,'sha256':hashlib.sha256(b).hexdigest(),'blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()})) for p in selected for b in [subprocess.check_output(['git','show','HEAD:'+p])]]; z.close(); pathlib.Path('artifacts/ar033/source-receipt.json').write_text(json.dumps(rows,indent=2))"
          if ($LASTEXITCODE) { throw 'Receipt failed' }
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE) { throw 'Restore failed' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar033/build.log
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Repeat completion and all retained corpora
        id: corpora
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$failed=@()
          foreach($name in 'AR-033-1','AR-033-2','AR-033-3','AR-032','AR-031','AR-030','AR-020','AR-012','AR-011','AR-010','AR-001') {
            $env:H2_AR033_EVIDENCE_DIR=Join-Path $PWD "artifacts/ar033/$name"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $name.Substring(0,6) 2>&1 | Tee-Object "artifacts/ar033/$name.log"
            if ($LASTEXITCODE -ne 0 -or (Get-Content "artifacts/ar033/$name.log" -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed') { $failed+=$name }
          }
          @{failed=$failed} | ConvertTo-Json | Set-Content artifacts/ar033/corpora-result.json
          if ($failed.Count) { throw ('Failed corpora: '+($failed -join ',')) }
      - name: Independent Agent suites
        if: success() || steps.corpora.outcome == 'failure'
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar033/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR033-Final-Evidence
          path: artifacts/ar033/
          if-no-files-found: error
          retention-days: 14
