name: AR-024 production Office slice validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h2-ar024-validation.yml'
      - 'tests/H2Notes.Tests/H2ProductAcceptanceScenarioTests.cs'
      - 'experiments/H2AgentLab/Integration/**'
      - 'experiments/H2AgentLab.OfficeHost/**'
      - 'experiments/H2AgentLab.OfficeProtocol/**'
      - 'src/H2Notes.Avalonia/**'
      - 'src/H2Notes.Core/**'
      - 'tools/agent-reliability/validate_ar024.ps1'
permissions:
  contents: read
concurrency:
  group: h2-ar024-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  production-office-slice:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate AR-024 E1-E2 production slice and retained regressions
        shell: pwsh
        run: tools/agent-reliability/validate_ar024.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR024-E1-E2-Evidence
          path: artifacts/ar024/
          if-no-files-found: error
          retention-days: 14
