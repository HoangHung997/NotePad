name: AR-066 reviewed source-consent integration
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: [.github/workflows/h2-ar066-consent-delivery.yml]
permissions:
  contents: write
concurrency:
  group: h2-ar066-consent-delivery
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/h2-agent-reliability-ar-000
          fetch-depth: 0
      - name: Verify all reviewed preimages and postimages before one normal push
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          def blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ar066-consent-delivery';out.mkdir()
          manifest=pathlib.Path('.github/ar066-consent/manifest.json')
          m=json.loads(manifest.read_text());(out/'manifest.json').write_bytes(manifest.read_bytes())
          before=git('rev-parse','HEAD')
          assert before==os.environ['GITHUB_SHA'] and git('rev-parse','HEAD^')==m['reviewed_base'], 'Changed HEAD: reconcile, do not replay delivery'
          assert not git('status','--porcelain'), 'Dirty isolated checkout'
          delivery=set(git('diff','--name-only',m['reviewed_base'],before).splitlines())
          expected={'.github/workflows/h2-ar066-consent-delivery.yml','.github/ar066-consent/manifest.json',m['patch_path']}|{x['staged_path'] for x in m['files'] if x['before_blob'] is None}
          assert delivery==expected, 'Unexpected staging changes'
          assert blob(pathlib.Path(m['patch_path']).read_bytes())==m['patch_blob'], 'Patch integrity mismatch'
          for x in m['files']:
            p=pathlib.Path(x['path'])
            if x['before_blob'] is None:
              assert not p.exists(), 'New source already exists'
              assert blob(pathlib.Path(x['staged_path']).read_bytes())==x['after_blob'], 'New source does not match review'
            else:
              assert git('rev-parse','HEAD:'+x['path'])==x['before_blob'] and blob(p.read_bytes())==x['before_blob'], 'Preimage changed'
          patch_paths={line.split('\t')[-1] for line in git('apply','--numstat',m['patch_path']).splitlines()}
          assert patch_paths=={x['path'] for x in m['files'] if x['before_blob'] is not None}
          git('apply','--check','--index',m['patch_path'])
          git('apply','--index','--whitespace=error',m['patch_path'])
          for x in m['files']:
            p=pathlib.Path(x['path'])
            if x['before_blob'] is None:
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(pathlib.Path(x['staged_path']).read_bytes())
            assert blob(p.read_bytes())==x['after_blob'], 'Postimage differs from reviewed source'
          git('add','--',*[x['path'] for x in m['files']])
          git('rm','-r','--','.github/ar066-consent','.github/workflows/h2-ar066-consent-delivery.yml')
          git('diff','--cached','--check')
          assert set(git('diff','--cached','--name-only').splitlines())==expected|{x['path'] for x in m['files']}
          assert git('ls-remote','origin','refs/heads/'+m['branch']).split()[0]==before, 'Another worker advanced branch'
          git('config','user.name','H2 AR-066 implementation')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','feat(AR-066): approve exact live and disk source roles through existing H2 approval and journal')
          after=git('rev-parse','HEAD')
          receipt={'task':'AR-066','before':before,'code_sha':after,'branch':m['branch'],'files':m['files'],'validation':'NOT_RUN: trigger exact-source Windows regression next','E3':'AWAITING_ENVIRONMENT','E4':'AWAITING_ENVIRONMENT'}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2))
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+m['branch']],check=True)
          assert git('ls-remote','origin','refs/heads/'+m['branch']).split()[0]==after
          assert not git('status','--porcelain')
          print('AR066 source integrated:',after,'; no application acceptance claimed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR066-Consent-Delivery
          path: ${{ runner.temp }}/ar066-consent-delivery/
          if-no-files-found: error
          retention-days: 14
