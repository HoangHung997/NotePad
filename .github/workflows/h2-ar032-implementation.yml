name: AR-032 scoped history validation
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: ['.github/workflows/h2-ar032-implementation.yml']
  pull_request:
    branches: [main]
    paths:
      - 'experiments/H2AgentLab/Integration/**'
      - 'tests/H2Notes.Tests/**'
      - '.github/workflows/h2-ar032-implementation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h2-ar032-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  history:
    if: >-
      github.repository == 'HoangHung997/NotePad' &&
      (github.ref == 'refs/heads/feature/h2-agent-reliability-ar-000' ||
       (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record exact source and build
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar032 | Out-Null
          if (git status --porcelain) { throw 'Dirty checkout' }
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';E1='Scoped source policy';E2='Actual local archive and production registry with scripted transport';E3='NOT_RUN';E4='NOT_RUN';E5='AR-083 DEFERRED_BY_USER'} | ConvertTo-Json | Set-Content artifacts/ar032/identity.json
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE) { throw 'Restore failed' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar032/build.log
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Run history corpus three times and retained regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$failed=@()
          foreach($name in 'AR-032-1','AR-032-2','AR-032-3','AR-031','AR-030','AR-020','AR-012','AR-011','AR-010','AR-001') {
            $env:H2_AR032_EVIDENCE_DIR=Join-Path $PWD "artifacts/ar032/$name"
            $env:H2_AR031_EVIDENCE_DIR=Join-Path $PWD "artifacts/ar032/$name"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $name.Substring(0,6) 2>&1 | Tee-Object "artifacts/ar032/$name.log"
            if ($LASTEXITCODE -ne 0 -or (Get-Content "artifacts/ar032/$name.log" -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed') { $failed+=$name }
          }
          @{failed=$failed} | ConvertTo-Json | Set-Content artifacts/ar032/corpora-result.json
          if ($failed.Count) { throw ('Failed corpora: '+($failed -join ',')) }
      - name: Run mandatory independent Agent suites
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar032/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR032-E1-E2-Evidence
          path: artifacts/ar032/
          if-no-files-found: error
          retention-days: 14
