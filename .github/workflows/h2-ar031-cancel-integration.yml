name: AR-031 cancellation repair and validation
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: ['.github/workflows/h2-ar031-cancel-integration.yml']
permissions:
  contents: read
concurrency:
  group: h2-ar031-cancel-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'HoangHung997/NotePad' && github.ref == 'refs/heads/feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    outputs:
      code: ${{ steps.save.outputs.code }}
    env:
      GH_TOKEN: ${{ github.token }}
      CHECKED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Save exact reviewed three-file repair without overwriting concurrent work
        id: save
        shell: python
        run: |
          import base64,hashlib,json,os,pathlib,subprocess
          REPO='HoangHung997/NotePad';BRANCH='feature/h2-agent-reliability-ar-000'
          BASE='9576af4aa1507daf833ef358c26fa7597351ad09';MAIN='1283bc13e07c3cd47d04886166de3dfc595422c0'
          WORKFLOW='.github/workflows/h2-ar031-cancel-integration.yml'
          def require(ok,msg):
              if not ok: raise RuntimeError(msg)
          def git(*args): return subprocess.check_output(['git',*args],text=True,timeout=60).strip()
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          head=os.environ['CHECKED_HEAD']
          require(git('rev-parse','HEAD')==head and not git('status','--porcelain'),'Wrong/dirty checkout')
          require(git('rev-parse','HEAD^')==BASE and git('diff','--name-only',BASE,head)==WORKFLOW,'Other work appeared; reconcile instead of reset')
          require(git('ls-remote','origin','refs/heads/main').split()[0]==MAIN,'Main advanced')
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'Branch advanced')
          expected='9ef554c118c1751d3f7203fbe5fe392c044406a3'
          reply=json.loads(subprocess.check_output(['gh','api','repos/'+REPO+'/git/blobs/'+expected],timeout=60))
          patch=base64.b64decode(reply['content'])
          require(len(patch)==12871 and blob(patch)==expected and hashlib.sha256(patch).hexdigest()=='cdd77e3252878c7164a5f04b7302cd98d5f329592b2fd39dd5d58444d3abb548','Reviewed patch differs')
          paths=[
              ('experiments/H2AgentLab/Integration/H2ProductionAgentAdapter.cs','3b250246ef95ac91a0939ae5a468e5814f927d35','0875c1b55b243a6837b5925d4e8722098178b1a0'),
              ('tests/H2Notes.Tests/H2AgentArchiveCancellationTests.cs',None,'40e1bb656cd35dc34107aa7af798ffec99d5fbf0'),
              ('tests/H2Notes.Tests/H2AgentArchiveJournalTests.cs','ccf7f69e1ef32508ec5b60a4ae5cff54ea439b6c','3568474445ff78fe5dea4b190a0249f389c158ca')]
          for path,old,new in paths:
              p=pathlib.Path(path);require((blob(p.read_bytes()) if p.exists() else None)==old,'Source changed: '+path)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ar031-cancel-delivery';out.mkdir()
          patchfile=out/'reviewed.patch';patchfile.write_bytes(patch)
          subprocess.run(['git','apply','--index','--check',str(patchfile)],check=True)
          subprocess.run(['git','apply','--index',str(patchfile)],check=True)
          for path,old,new in paths: require(blob(pathlib.Path(path).read_bytes())==new,'Postimage differs: '+path)
          require(set(git('diff','--cached','--name-only').splitlines())=={p[0] for p in paths},'Unexpected stage')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'Concurrent work')
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','commit','-m','fix(AR-031): cancel live work despite archive write failures'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+BRANCH],check=True,timeout=120)
          code=git('rev-parse','HEAD')
          require(not git('status','--porcelain') and git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==code,'Save not verified')
          (out/'saved.json').write_text(json.dumps({'code_sha':code,'base':BASE,'paths':paths,'working_tree':'CLEAN','tests':'NOT_RUN_AT_SAVE'},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('code='+code+'\n')
          print('Saved reviewed cancellation repair:',code)
      - name: Dispatch unchanged full Avalonia CI on the saved branch
        run: gh api -X POST repos/HoangHung997/NotePad/actions/workflows/avalonia-ci.yml/dispatches -f ref=feature/h2-agent-reliability-ar-000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR031-Cancellation-Source-Delivery
          path: ${{ runner.temp }}/ar031-cancel-delivery/
          if-no-files-found: error
          retention-days: 14
  validation:
    needs: integrate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.code }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record exact source and build
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar031-cancel | Out-Null
          if (git status --porcelain) { throw 'Dirty checkout' }
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';E1='Archive integrity fixtures';E2='Concrete local journal, production cancellation and controlled child processes; scripted transport';E3='NOT_RUN';E4='NOT_RUN';E5='AR-083 DEFERRED_BY_USER'} | ConvertTo-Json | Set-Content artifacts/ar031-cancel/identity.json
          python -c "import pathlib,subprocess,hashlib,json,zipfile;p=pathlib.Path('artifacts/ar031-cancel');names=[n for n in subprocess.check_output(['git','ls-files'],text=True).splitlines() if pathlib.Path(n).suffix in ('.cs','.csproj','.md','.slnx','.yml','.ps1','.py')];rows=[];z=zipfile.ZipFile(p/'committed-source.zip','w',zipfile.ZIP_DEFLATED);[(z.writestr(n,b),rows.append({'path':n,'sha256':hashlib.sha256(b).hexdigest(),'blob':hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()})) for n in names for b in [subprocess.check_output(['git','show','HEAD:'+n])]];z.close();(p/'source-receipt.json').write_text(json.dumps({'code_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':rows},indent=2))"
          if ($LASTEXITCODE) { throw 'Source receipt failed' }
          dotnet --info | Set-Content artifacts/ar031-cancel/dotnet-info.txt
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE) { throw 'Restore failed' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar031-cancel/build.log
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Reproduce cancellation defects with the actual prior adapter and unchanged new tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='experiments/H2AgentLab/Integration/H2ProductionAgentAdapter.cs'
          $saved=[IO.File]::ReadAllBytes((Resolve-Path $p))
          try {
            python -c "import pathlib,subprocess;pathlib.Path('experiments/H2AgentLab/Integration/H2ProductionAgentAdapter.cs').write_bytes(subprocess.check_output(['git','show','9576af4aa1507daf833ef358c26fa7597351ad09:experiments/H2AgentLab/Integration/H2ProductionAgentAdapter.cs']))"
            if ($LASTEXITCODE) { throw 'Pinned old source missing' }
            @{code_sha=(git rev-parse HEAD);prior_adapter='9576af4aa1507daf833ef358c26fa7597351ad09';kind='PRIOR_ADAPTER_WITH_NEW_TESTS'} | ConvertTo-Json | Set-Content artifacts/ar031-cancel/negative-identity.json
            dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar031-cancel/negative-build.log
            if ($LASTEXITCODE) { throw 'Compile failure is not valid negative evidence' }
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter 'AR-031 cancellation' 2>&1 | Tee-Object artifacts/ar031-cancel/negative.log
            $exit=$LASTEXITCODE;$text=Get-Content artifacts/ar031-cancel/negative.log -Raw
            if ($exit -eq 0 -or $text -notmatch 'RESULT: 1 passed, 3 failed') { throw 'Prior adapter did not reproduce the expected cancellation defects; inspect real logs' }
            foreach($name in @('journal write failure cannot leave transport running','still stops execution already marked Blocked by archive failure','callback error does not replace the primary storage error')) {
              if (-not $text.Contains('FAIL AR-031 cancellation '+$name)) { throw ('Missing prior-source failure: '+$name) }
            }
          } finally {
            [IO.File]::WriteAllBytes((Join-Path $PWD $p),$saved)
            if ([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([IO.File]::ReadAllBytes((Resolve-Path $p)))) -ne [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($saved))) { throw 'Exact source restore failed' }
          }
          if (git status --porcelain) { throw 'Negative control left dirty checkout' }
          'CLEAN: exact original bytes/hash restored' | Set-Content artifacts/ar031-cancel/restored.txt
      - name: Rebuild positive source and run all corpora even after a negative-control discrepancy
        id: corpora
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if (git status --porcelain) { throw 'Positive source is not clean' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar031-cancel/positive-build.log
          if ($LASTEXITCODE) { throw 'Positive rebuild failed' }
          $failed=@()
          foreach($name in 'AR-031-1','AR-031-2','AR-031-3','AR-030','AR-020','AR-012','AR-011','AR-010','AR-001') {
            $env:H2_AR031_EVIDENCE_DIR=Join-Path $PWD "artifacts/ar031-cancel/$name"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $name.Substring(0,6) 2>&1 | Tee-Object "artifacts/ar031-cancel/$name.log"
            if ($LASTEXITCODE -ne 0 -or (Get-Content "artifacts/ar031-cancel/$name.log" -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed') { $failed+=$name }
          }
          @{failed=$failed} | ConvertTo-Json | Set-Content artifacts/ar031-cancel/corpora-result.json
          if ($failed.Count) { throw ('Failed corpora: '+($failed -join ',')) }
      - name: Run every mandatory independent Agent suite
        if: always() && steps.build.outcome == 'success'
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar031-cancel/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR031-Cancellation-E1-E2-Evidence
          path: artifacts/ar031-cancel/
          if-no-files-found: error
          retention-days: 14
