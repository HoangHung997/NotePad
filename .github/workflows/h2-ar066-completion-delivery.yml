name: AR-066 reviewed live-source completion guard
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: [.github/workflows/h2-ar066-completion-delivery.yml]
permissions:
  contents: write
concurrency:
  group: h2-ar066-completion-delivery
  cancel-in-progress: false
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Integrate reviewed forward patch only on its exact unchanged source
        shell: python
        run: |
          import hashlib,json,os,pathlib,subprocess
          def git(*a): return subprocess.check_output(['git',*a],text=True).strip()
          def hashfile(p): return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          branch='feature/h2-agent-reliability-ar-000'
          head=git('rev-parse','HEAD')
          assert head==os.environ['GITHUB_SHA'] and git('rev-parse','HEAD^')=='8fc599fafdb0704ca067e357af36a608ed13583e'
          assert not git('status','--porcelain'), 'Dirty checkout: do not overwrite'
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==head, 'Branch advanced: reconcile'
          pairs={
            'experiments/H2AgentLab/Integration/H2OfficeRuntimeTools.cs':('9f94616a4920326b8896c9b92a590b42294988e4612c8fec7e61f687f181a48f','0477d34a5a36ab86fe2237577efe918d0c652a3c50263af3bd950ab9826e3d03'),
            'experiments/H2AgentLab/Integration/H2ProductionToolSession.Domains.cs':('28c4b223b89aba722bb4ad0960c719ef565b4c8862c2668822832a4a78761108','9eda48ecb7a8602077a4d095b258bb61045f7e11494f946c9ccb4c3f067a0ae5'),
            'experiments/H2AgentLab/Integration/H2ProductionToolSession.LiveResource.cs':('8b258208a5721ed6b2da2bf88008788e506b0a65eae5aeb6efcc3896bb1c0a91','fb84281575d29de66fbda611d39adb13dbedbe8e21d74850a8ae20de5da5e05f'),
            'experiments/H2AgentLab/Runtime/AgentRuntimeFactory.cs':('06903614d54484fc516b7a52e79642d25f8338645028add2d7a33900e1bdcad7','9118119a21ce21fcf27b4f52bb53ffb3efa3501e10c4f761f9cc745def2bd5c6'),
            'tests/H2Notes.Tests/H2AgentLiveResourceTests.cs':('3c94dd77e04d47a1b736a78394667c9a250dafd8666c6d6a385817c5b92dbfc4','eaf7eead4a57070155973919b2610f7e7fddf1832b279bb7d1456d133cd3c817'),
            'tests/H2Notes.Tests/H2AgentSteeringWireTests.cs':('4d6386a479e58adefc548f3a33b9cd02b5b72aac42d9612b04320aad3ecf9e9f','c50acf364d4b0522a99fce95b6a62e65ce0d35c37350fe158b79b3e6e77671ff')}
          for p,(before,after) in pairs.items(): assert hashfile(p)==before,p+' preimage changed'
          patch='tools/agent-reliability/ar066-completion.patch'
          assert hashfile(patch)=='b1843ad94b86f59844ae540f7c5f2db30860c498810805783ef4ca34f8852b14'
          subprocess.run(['git','apply','--check',patch],check=True)
          subprocess.run(['git','apply',patch],check=True)
          for p,(before,after) in pairs.items(): assert hashfile(p)==after,p+' postimage mismatch'
          assert set(git('diff','--name-only').splitlines())==set(pairs), 'Unexpected paths'
          subprocess.run(['git','diff','--check'],check=True)
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==head,'Concurrent source change'
          git('config','user.name','H2 AR-066 implementation')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','add','--',*pairs],check=True)
          subprocess.run(['git','commit','-m','fix(AR-066): require validated live observation before completion and reject incomplete native readback'],check=True)
          code=git('rev-parse','HEAD')
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          assert git('ls-remote','origin','refs/heads/'+branch).split()[0]==code,'Reconcile uncertain push result'
          out=pathlib.Path('artifacts/ar066-completion-delivery');out.mkdir(parents=True,exist_ok=True)
          (out/'saved.json').write_text(json.dumps({'task':'AR-066','staging_sha':head,'code_sha':code,'hashes':pairs,'acceptance':'NOT_RUN','old_source_control':'NOT_RUN_TOOL_SAFETY_BLOCKED; not retried'},indent=2))
          print('Forward patch saved',code,'; tests not yet accepted')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR066-Completion-Delivery-Receipt
          path: artifacts/ar066-completion-delivery/
          if-no-files-found: error
          retention-days: 14
