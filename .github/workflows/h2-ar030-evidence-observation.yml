name: AR-030 failing evidence documentation checkpoint
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/h2-ar030-evidence-observation.yml']
permissions:
  contents: read
concurrency:
  group: h2-ar030-evidence-documentation
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CHECKED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact failing CI and save only three documentation files
        shell: python
        run: |
          import base64,hashlib,json,subprocess
          expected='88a29d2d5f56c04284f17f9b4b549dd8380b7ebf'
          response=json.loads(subprocess.check_output(['gh','api','repos/HoangHung997/NotePad/git/blobs/'+expected],timeout=60))
          content=base64.b64decode(response['content'])
          actual=hashlib.sha1(b'blob '+str(len(content)).encode()+b'\0'+content).hexdigest()
          if actual!=expected or len(content)>20000:
              raise RuntimeError('Reviewed documentation script identity differs')
          # Pinned, reviewed docs-only code, not model output, logs or a runtime repair.
          exec(compile(content,'reviewed-ar030-documentation.py','exec'))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR030-Executed-Evidence-Failure-Checkpoint
          path: ${{ runner.temp }}/ar030-observation/
          if-no-files-found: error
          retention-days: 14
