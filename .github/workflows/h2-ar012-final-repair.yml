name: AR-012 final binding review
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/h2-ar012-final-repair.yml']
permissions:
  contents: read
concurrency:
  group: h2-ar012-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  delivery:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    outputs:
      sha: ${{ steps.repair.outputs.sha }}
    env:
      AR_HEAD: ${{ github.event.pull_request.head.sha }}
      AR_BRANCH: feature/h2-agent-reliability-ar-000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply four exact reviewed changes, preserve all other work
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, subprocess
          from pathlib import Path
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          def require(value, message):
              if not value: raise RuntimeError(message)
          head=os.environ['AR_HEAD']; branch=os.environ['AR_BRANCH']; base='71330c609023cf94c3c55820f669f9305bc17551'
          require(branch=='feature/h2-agent-reliability-ar-000' and git('rev-parse','HEAD')==head, 'Unexpected checkout')
          require(not git('status','--porcelain'),'Dirty tree; preserve changes')
          require(git('ls-remote','origin','refs/heads/main').split()[0]=='1283bc13e07c3cd47d04886166de3dfc595422c0','Main advanced')
          require(git('ls-remote','origin','refs/heads/'+branch).split()[0]==head,'Branch advanced')
          require(not git('diff','--name-only',base,'HEAD','--','src','experiments','tests','docs'),'Code/checkpoint changed; reconcile first')
          expected={
              'experiments/H2AgentLab/Integration/H2OfficeRuntimeTools.cs':('8f94d5eb0a1974146a1b7566857ed47f7401c08626363e2e85d704b8e6a2bb23','5daa9e115386d4d49f745d9ca550ccb12cc60821328666762c606472ddda28a5'),
              'experiments/H2AgentLab/Integration/H2ProductionToolSession.cs':('38d6724fcfe890a7c7177f6c6ba31d6f823b37fb66952f095f5236389950f808','7c943a1e9efb1203eb86ab340c84150a31cd03ed320a7e884d3041c1f2d66759'),
              'experiments/H2AgentLab/Tools/ToolOutcome.cs':('d76b1715ac79aac93452442dbf9d5b355d0b9e196d7a04c224eeb33c736f401f','0a6cf997a821a7d0ad8a800b613359f80f52c786c52fc6e6ea21d399e5587688'),
              'tests/H2Notes.Tests/H2AgentLiveBindingTests.cs':('79cd9a4ddc1dd90b63309bbc86efd6d87aed5af4f81d7ec17ba6938c4496b9c8','e8c042fe05726b6a981c18112744bcd41aedc786094e86634c4df5853a16c537')}
          for p,(before,_) in expected.items(): require(hashlib.sha256(Path(p).read_bytes()).hexdigest()==before,'Preimage changed: '+p)
          def change(p,a,b):
              path=Path(p);s=path.read_text();require(s.count(a)==1,'Expected unique replacement: '+p);path.write_text(s.replace(a,b,1))
          change('tests/H2Notes.Tests/H2AgentLiveBindingTests.cs','await Task.Yield();if(index<calls.Length)','await Task.Delay(1,ct).ConfigureAwait(false);if(index<calls.Length)')
          change('tests/H2Notes.Tests/H2AgentLiveBindingTests.cs','Rejected(result,"outside_resource_scope"); Check(office.Reads.Count == 0','Rejected(result,"target_not_grounded"); Check(office.Reads.Count == 0')
          change('experiments/H2AgentLab/Integration/H2OfficeRuntimeTools.cs','if (!target.Resolved) throw new ToolPreflightException(target.Code);','if (!target.Resolved) throw new ToolPreflightException(target.Code == "outside_resource_scope" ? "target_not_grounded" : target.Code);')
          change('experiments/H2AgentLab/Integration/H2ProductionToolSession.cs','return AgentRuntimePermissionDecision.Deny("outside_resource_scope",\n                "Chỉ chọn workspace','return AgentRuntimePermissionDecision.Deny("target_not_grounded",\n                "Chỉ chọn workspace')
          change('experiments/H2AgentLab/Tools/ToolOutcome.cs','"stale_resource" or "resource_not_found" or "ambiguous_target" => ToolRetryClass.Reobserve,','"stale_resource" or "resource_not_found" or "ambiguous_target" or "target_not_grounded" => ToolRetryClass.Reobserve,')
          change('experiments/H2AgentLab/Tools/ToolOutcome.cs','"invalid_arguments" or "unknown_tool" or "tool_not_loaded" or "repeated_failed_mutation"','"target_not_grounded" or "invalid_arguments" or "unknown_tool" or "tool_not_loaded" or "repeated_failed_mutation"')
          change('experiments/H2AgentLab/Tools/ToolOutcome.cs','"ambiguous_target" => "More than one target matches; select an exact resource.",','"ambiguous_target" => "More than one target matches; select an exact resource.",\n            "target_not_grounded" => "The target does not match a host-selected project, linked, explicit or captured resource. Select the exact target; more permission alone does not resolve it.",')
          change('experiments/H2AgentLab/Integration/H2OfficeRuntimeTools.cs','else if (result is WordLiveSnapshot w) ValidateSnapshot(target, w.SessionId, w.FullName, w.SelectionText, mutating);','else if (result is WordLiveSnapshot w) ValidateSnapshot(target, w.SessionId, w.FullName, w.SelectionText, mutating);\n                else if (result is WordLanguageEvidenceResult language && language.SessionId != session)\n                    throw new ToolPreflightException("stale_resource");')
          change('experiments/H2AgentLab/Integration/H2OfficeRuntimeTools.cs','if (saved.SessionId != session) throw new OfficeHostClientException','if (saved.SessionId != session || !H2AgentTargetScope.PathComparer.Equals(saved.DestinationPath, destination)) throw new OfficeHostClientException')
          change('tests/H2Notes.Tests/H2AgentLiveBindingTests.cs','public string? WrongReadSession;public string? RenameAfterWrite;','public string? WrongReadSession;public string? WrongLanguageSession;public string? RenameAfterWrite;')
          change('tests/H2Notes.Tests/H2AgentLiveBindingTests.cs','public Task<WordLanguageEvidenceResult> InspectWordLanguageAsync(WordLanguageEvidenceRequest r,CancellationToken ct=default)=>throw new NotSupportedException();','public Task<WordLanguageEvidenceResult> InspectWordLanguageAsync(WordLanguageEvidenceRequest r,CancellationToken ct=default)\n        {ct.ThrowIfCancellationRequested();Reads.Add(r.SessionId);return Task.FromResult(new WordLanguageEvidenceResult(WrongLanguageSession??r.SessionId,"v1",[],[],[],"CONTROLLED-LANGUAGE-MARKER"));}')
          change('tests/H2Notes.Tests/H2AgentLiveBindingTests.cs','        test("AR-012 stale captured native process blocks production reads despite Full Access",','''        test("AR-012 language evidence from a different Word session is not exposed", () => Temp(root =>
                  {
                      var office=new OfficeFixture(root);var path=Path.Combine(root,"A.docx");office.AddWord("a",path,"DOC-A");office.WrongLanguageSession="b";
                      var wire=new Wire(Search("word.extract_legal_citations"),Call("language","word.extract_legal_citations",new{session_id="a",state_token="v1"}));
                      var result=Execute(root,null,"Read citations from the open document",new(root,null),office,wire);
                      Rejected(result,"stale_resource");Check(wire.Results.All(r=>!r.Content.Contains("CONTROLLED-LANGUAGE-MARKER")),"Wrong-session language evidence was exposed.");
                  }));
                  test("AR-012 grounding rejection remains distinct from permission denial in UI metadata", () =>
                  {
                      var call=new H2AgentLab.ToolCall("call","fixture",JsonSerializer.SerializeToElement(new{}));
                      var output=H2AgentLab.Tools.ToolOutcomeBridge.Failure(call,null,"target_not_grounded",H2AgentLab.Tools.ToolErrorPhase.Preflight,H2AgentLab.Tools.ToolMutationEffect.None);
                      var projected=H2ToolOutcomeProjection.ToProduct(output.Outcome);
                      Check(projected.ErrorCode=="target_not_grounded" && projected.Effect==H2ToolMutationEffect.None,
                          "Grounding was conflated with permission or mutation.");
                      Check(output.Outcome.Error!.RetryClass==H2AgentLab.Tools.ToolRetryClass.Reobserve,"Grounding advice retries without selecting target.");
                  });
                  test("AR-012 stale captured native process blocks production reads despite Full Access",''')
          for p,(_,after) in expected.items(): require(hashlib.sha256(Path(p).read_bytes()).hexdigest()==after,'Postimage changed: '+p)
          subprocess.run(['git','add','--',*expected],check=True)
          require(set(git('diff','--cached','--name-only').splitlines())==set(expected),'Unexpected staged changes')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('commit','-m','fix(AR-012): preserve grounding errors and complete result identity guards')
          require(git('ls-remote','origin','refs/heads/'+branch).split()[0]==head,'Concurrent update; no push')
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          saved=git('rev-parse','HEAD');require(not git('status','--porcelain'),'Dirty final tree')
          require(git('ls-remote','origin','refs/heads/'+branch).split()[0]==saved,'Remote verification failed')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('sha='+saved+'\n')
          print('Saved exact AR-012 repaired candidate:',saved,'; tests not yet run')
          PY
      - name: Dispatch unchanged full required CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run avalonia-ci.yml --ref "$AR_BRANCH"
  tests:
    needs: delivery
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.delivery.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build exact source and record identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar012-final | Out-Null
          if(git status --porcelain){throw 'Dirty checkout'}
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';os=[Environment]::OSVersion.VersionString;level='E1/E2 controlled fixtures, no native Office/model acceptance'} | ConvertTo-Json | Set-Content artifacts/ar012-final/identity.json
          dotnet restore H2Notes.Avalonia.slnx
          if($LASTEXITCODE){throw 'Restore failed'}
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar012-final/build.log
          if($LASTEXITCODE){throw 'Build failed'}
      - name: Repeat bindings and retain previous corpora
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fail=@()
          foreach($name in 'AR-012-1','AR-012-2','AR-012-3','AR-011','AR-010','AR-001'){
            $task=$name.Substring(0,6);$log="artifacts/ar012-final/$name.log"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $task 2>&1 | Tee-Object $log
            if($LASTEXITCODE -ne 0 -or (Get-Content $log -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed'){$fail+=$name}
          }
          if($fail.Count){throw ('Failed corpus: '+($fail -join ', '))}
      - name: All mandatory Agent suites
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar012-final/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR012-Final-E1-E2-Evidence
          path: artifacts/ar012-final/
          if-no-files-found: error
          retention-days: 14
