name: AR-080 long-work production corpus validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h2-ar080-validation.yml'
      - 'tests/H2Notes.Tests/H2AgentLongWorkProductionCorpusTests.cs'
      - 'tests/H2Notes.Tests/Program.cs'
      - 'experiments/H2AgentLab/Integration/**'
      - 'experiments/H2AgentLab/Runtime/**'
      - 'experiments/H2AgentLab/Session/**'
      - 'experiments/H2AgentLab/Transport/**'
      - 'experiments/H2AgentLab/Tasking/**'
      - 'experiments/H2AgentLab/Tools/**'
      - 'experiments/H2AgentLab/ScriptWorkspace*.cs'
      - 'src/H2Notes.Core/**'
      - 'tools/agent-reliability/validate_ar080.ps1'
permissions:
  contents: read
concurrency:
  group: h2-ar080-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  long-work-corpus:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate AR-080 E1-E2 corpus and retained regressions
        shell: pwsh
        run: tools/agent-reliability/validate_ar080.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR080-E1-E2-Evidence
          path: artifacts/ar080/
          if-no-files-found: error
          retention-days: 14
