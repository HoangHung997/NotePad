name: AR-062 artifact publication validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h2-ar062-validation.yml'
      - 'experiments/H2AgentLab/ScriptWorkspace.cs'
      - 'experiments/H2AgentLab/ScriptWorkspace.Verification.cs'
      - 'experiments/H2AgentLab/AgentTools.cs'
      - 'experiments/H2AgentLab/Tools/NormalRuntimeToolRegistry.cs'
      - 'experiments/H2AgentLab/Runtime/AgentRuntimeDomainVerification.cs'
      - 'experiments/H2AgentLab/runtime-guide.md'
      - 'tests/H2Notes.Tests/H2ArtifactPublicationTests.cs'
      - 'tests/H2Notes.Tests/Program.cs'
      - 'tools/agent-reliability/validate_ar062.ps1'
permissions:
  contents: read
concurrency:
  group: h2-ar062-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  artifact-publication:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate AR-062 E1-E2 and retained regressions
        shell: pwsh
        run: tools/agent-reliability/validate_ar062.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR062-E1-E2-Evidence
          path: artifacts/ar062/
          if-no-files-found: error
          retention-days: 14
