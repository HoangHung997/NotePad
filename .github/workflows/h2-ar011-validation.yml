name: AR-011 outcome contract validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h2-ar011-validation.yml'
      - 'src/**'
      - 'experiments/**'
      - 'tests/**'
permissions:
  contents: read
concurrency:
  group: h2-ar011-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.inventory.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Capture exact tracked source and clean tree identity
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/ar011-source"
          git archive --format=zip -o "$RUNNER_TEMP/ar011-source/source.zip" HEAD README.md docs src experiments tests tools .github H2Notes.Avalonia.slnx
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'ar011-source'
          p.joinpath('identity.json').write_text(json.dumps({'code_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'working_tree':'CLEAN','evidence':'SOURCE_ONLY_NOT_TEST_PASS'},indent=2))
          PY
          if test -f tests/H2Notes.Tests/H2AgentToolOutcomeTests.cs; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: AR011-Exact-Source
          path: ${{ runner.temp }}/ar011-source/
          if-no-files-found: error
          retention-days: 7
  outcomes:
    needs: source
    if: needs.source.outputs.ready == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record identity and build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out='artifacts/ar011'
          New-Item -ItemType Directory -Force $out | Out-Null
          if (git status --porcelain) { throw 'Dirty test checkout' }
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';evidence='E1/E2 fixtures, no model/network/native Office acceptance'} | ConvertTo-Json | Set-Content "$out/identity.json"
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE) { throw 'restore failed' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore
          if ($LASTEXITCODE) { throw 'build failed' }
      - name: Repeat outcome semantics and retained regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($iteration in 1..3) {
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter AR-011 2>&1 | Tee-Object "artifacts/ar011/outcomes-$iteration.log"
            if ($LASTEXITCODE) { throw "AR-011 failed, iteration $iteration" }
          }
          foreach ($task in 'AR-010','AR-001') {
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $task 2>&1 | Tee-Object "artifacts/ar011/$task.log"
            if ($LASTEXITCODE) { throw "$task regression failed" }
          }
      - name: Run independent required Agent suites without masking failures
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar011/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR011-E1-E2-Evidence
          path: artifacts/ar011/
          if-no-files-found: error
          retention-days: 14
