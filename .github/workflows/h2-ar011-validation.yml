name: AR-011 outcome contract validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/h2-ar011-validation.yml'
      - 'src/**'
      - 'experiments/**'
      - 'tests/**'
permissions:
  contents: read
concurrency:
  group: h2-ar011-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  source-review:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Preserve bounded tracked text source with explicit omissions
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'ar011-source'
          out.mkdir()
          git = lambda *a: subprocess.check_output(['git', *a])
          omitted = []
          extensions = {'.cs', '.csproj', '.md', '.yml', '.yaml', '.props', '.targets', '.slnx', '.sln', '.axaml', '.py', '.ps1', '.json', '.txt', '.config', '.xml', '.cmd', '.resx'}
          with zipfile.ZipFile(out / 'source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for raw in git('ls-files', '-z').split(b'\0'):
                  if not raw: continue
                  path = Path(raw.decode('utf-8'))
                  if path.suffix.lower() not in extensions or path.is_symlink() or path.stat().st_size > 2000000:
                      omitted.append(str(path)); continue
                  data = path.read_bytes()
                  try: data.decode('utf-8-sig')
                  except UnicodeDecodeError:
                      omitted.append(str(path)); continue
                  archive.writestr(str(path), data)
          assert (out / 'source.zip').stat().st_size < 20000000, 'Text-only source snapshot exceeded budget'
          (out / 'tree.txt').write_bytes(git('ls-tree', '-r', 'HEAD'))
          (out / 'identity.json').write_text(json.dumps({'code_sha': git('rev-parse', 'HEAD').decode().strip(), 'tree_sha': git('rev-parse', 'HEAD^{tree}').decode().strip(), 'working_tree': 'CLEAN', 'scope': 'Tracked UTF-8 text only; not a complete build checkout', 'omitted': omitted, 'sha256': hashlib.sha256((out / 'source.zip').read_bytes()).hexdigest()}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AR011-Exact-Source
          path: ${{ runner.temp }}/ar011-source/
          if-no-files-found: error
          retention-days: 7
  outcomes:
    if: github.repository == 'HoangHung997/NotePad' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/h2-agent-reliability-ar-000'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record exact identity and build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out='artifacts/ar011'
          New-Item -ItemType Directory -Force $out | Out-Null
          if (git status --porcelain) { throw 'Dirty test checkout' }
          if (-not (Test-Path tests/H2Notes.Tests/H2AgentToolOutcomeTests.cs)) { throw 'Required AR-011 corpus missing' }
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';os=[Environment]::OSVersion.VersionString;evidence='E1/E2 fixtures, no model/network/native Office acceptance'} | ConvertTo-Json | Set-Content "$out/identity.json"
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE) { throw 'Restore failed' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object "$out/build.log"
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Repeat outcome semantics and retained regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach ($iteration in 1..3) {
            $log="artifacts/ar011/outcomes-$iteration.log"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter AR-011 2>&1 | Tee-Object $log
            if ($LASTEXITCODE) { throw "AR-011 failed, iteration $iteration" }
            if ((Get-Content $log -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed') { throw 'Empty or missing test result is not PASS' }
          }
          foreach ($task in 'AR-010','AR-001') {
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $task 2>&1 | Tee-Object "artifacts/ar011/$task.log"
            if ($LASTEXITCODE) { throw "$task regression failed" }
          }
      - name: Run independent required Agent suites without masking failures
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar011/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR011-E1-E2-Evidence
          path: artifacts/ar011/
          if-no-files-found: error
          retention-days: 14
