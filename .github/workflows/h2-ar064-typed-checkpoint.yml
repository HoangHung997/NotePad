name: AR-064 verified partial checkpoint before critical repairs
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: [.github/workflows/h2-ar064-typed-checkpoint.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: h2-ar064-typed-checkpoint
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.repository == 'HoangHung997/NotePad'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/h2-agent-reliability-ar-000
          fetch-depth: 0
      - name: Verify reviewed program and command-scoped receipt parser
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          sha='386e4a8f5a56db34dbb69a1a623cfc9148934aad'
          req=urllib.request.Request('https://api.github.com/repos/HoangHung997/NotePad/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as response: value=json.loads(response.read(100000))
          data=base64.b64decode(value['content'])
          assert value['sha']==sha and hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          assert hashlib.sha256(data).hexdigest()=='00918218b15117d366ad5ce4b6692cb2c4a07a0230559150aca77c3d5191a2f4'
          source=data.decode("utf-8")
          patches=[("text('rev-parse','HEAD^')==CODE", "text('rev-parse','HEAD^')=='56e3051aa43fc2756463e1631d3e4b61978ea8d8'"), ('def main():', "def parse_full_test_log(decoded):\n    groups=list(re.finditer(r'(?m)^\\d{4}-[^\\r\\n]*?Z ##\\[group\\]Run ([^\\r\\n]*)',decoded))\n    indexes=[i for i,g in enumerate(groups) if 'dotnet run --project' in g[1]\n        and 'tests/H2Notes.Tests/H2Notes.Tests.csproj' in g[1].replace('\\\\','/')]\n    if len(indexes)!=1:\n        raise AssertionError('Expected exactly one concrete H2Notes.Tests command group, got '+str(len(indexes)))\n    i=indexes[0]\n    section=decoded[groups[i].start():groups[i+1].start() if i+1<len(groups) else len(decoded)]\n    matches=re.findall(r'(?m)^\\d{4}-[^\\r\\n]*?Z RESULT: (\\d+) passed, (\\d+) failed\\.?[^\\r\\n]*',section)\n    names=re.findall(r'(?m)^\\d{4}-[^\\r\\n]*?Z PASS ([^\\r\\n]*)',section)\n    if len(matches)!=1 or matches[0][1]!='0' or int(matches[0][0])!=len(names) or not names:\n        raise AssertionError('H2Notes test summary disagrees with executed case lines: '+repr((matches,len(names))))\n    if re.search(r'(?m)^\\d{4}-[^\\r\\n]*?Z FAIL ',section):\n        raise AssertionError('H2Notes.Tests contains a failed case')\n    return matches,names,section\n\ndef main():"), (" results=re.findall(r'RESULT: (\\d+) passed, (\\d+) failed',decoded)\n assert results==[('1077','0')]", " # Keep read-only evidence even if a receipt assertion stops this documentation checkpoint.\n out=root/'artifacts/ar064-typed-checkpoint';out.mkdir(parents=True,exist_ok=True)\n (out/'full-ci.log').write_bytes(full_log)\n whole_results=re.findall(r'RESULT: (\\d+) passed, (\\d+) failed',decoded)\n (out/'full-result-diagnostics.json').write_text(json.dumps({'whole_log_summaries':whole_results,'log_sha256':sha(full_log)},indent=2),encoding='utf-8')\n print('Whole-log result summaries:',whole_results)\n results,executed_names,test_section=parse_full_test_log(decoded)\n with zipfile.ZipFile(io.BytesIO(raw)) as focused_zip:\n  focused_names=re.findall(r'^PASS (AR-064[^\\r\\n]*)',focused_zip.read('AR-064-1.log').decode('utf-8-sig'),re.M)\n full_names=[name for name in executed_names if name.startswith('AR-064')]\n (out/'full-ar064-inventory.json').write_text(json.dumps({'focused':focused_names,'full':full_names},indent=2),encoding='utf-8')\n assert len(focused_names)==75 and len(full_names)==75 and sorted(full_names)==sorted(focused_names)\n full_ar064_inventory={'count':len(full_names),'matches_focused':True,'names':full_names}\n print('H2Notes.Tests exact summary:',results,'case lines:',len(executed_names),'AR064:',len(full_names))"), ("'full':{'run':FULL,'job':full_job['id'],'status':'SUCCESS','actual_checkout':merge,'source_equal':True,", "'full':{'run':FULL,'job':full_job['id'],'status':'SUCCESS','actual_checkout':merge,'source_equal':True,'ar064_inventory':full_ar064_inventory,'whole_log_summaries':whole_results,"), ("'previous_failures':['35845044820 cancelled before complete corpus'", "'previous_failures':['35866508066 and 35867273075 docs-only checkpoints rejected the whole-log RESULT list before any documentation writes. The corrected parser isolates the H2Notes.Tests command and verifies its summary against every executed PASS line and all 75 focused AR064 names. Product assertions and tests are unchanged.','35845044820 cancelled before complete corpus'")]
          for old,new in patches:
              assert source.count(old)==1
              source=source.replace(old,new,1)
          data=source.encode('utf-8')
          assert hashlib.sha256(data).hexdigest()=='2f0151fa49e4224f806a3bcc6e772421a0a5dcf658a365f977bfc1f0dc0649d0'
          pathlib.Path(os.environ['RUNNER_TEMP'],'ar064-checkpoint.py').write_bytes(data)
          PY
      - name: Verify every case name, source, control, full CI and refs then save only three documents
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/ar064-checkpoint.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR064-Typed-Verified-Checkpoint
          path: artifacts/ar064-typed-checkpoint/
          if-no-files-found: error
          retention-days: 14
