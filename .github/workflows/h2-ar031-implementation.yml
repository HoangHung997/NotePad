name: AR-031 journal implementation and validation
on:
  push:
    branches: [feature/h2-agent-reliability-ar-000]
    paths: ['.github/workflows/h2-ar031-implementation.yml']
permissions:
  contents: read
concurrency:
  group: h2-ar031-implementation
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'HoangHung997/NotePad' && github.ref == 'refs/heads/feature/h2-agent-reliability-ar-000'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    outputs:
      code: ${{ steps.save.outputs.code }}
    env:
      GH_TOKEN: ${{ github.token }}
      CHECKED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply reviewed boundary repair on exact owned branch
        id: save
        shell: python
        run: |
          import base64,hashlib,json,os,pathlib,subprocess
          REPO='HoangHung997/NotePad';BRANCH='feature/h2-agent-reliability-ar-000'
          BASE='b49d7ae9930926031581bf1fb1aa72bf2cfbdceb';MAIN='1283bc13e07c3cd47d04886166de3dfc595422c0'
          WORKFLOW='.github/workflows/h2-ar031-implementation.yml'
          def require(ok,msg):
              if not ok: raise RuntimeError(msg)
          def git(*args): return subprocess.check_output(['git',*args],text=True,timeout=90).strip()
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          head=os.environ['CHECKED_HEAD']
          require(git('rev-parse','HEAD')==head and not git('status','--porcelain'),'Wrong/dirty checkout')
          require(git('rev-parse','HEAD^')==BASE and git('diff','--name-only',BASE,head)==WORKFLOW,'Concurrent work; reconcile')
          require(git('ls-remote','origin','refs/heads/main').split()[0]==MAIN,'Main advanced')
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'Branch advanced')
          sha='f2c647183dc28e9a09794e7a28b1b8a146ec4849'
          response=json.loads(subprocess.check_output(['gh','api','repos/'+REPO+'/git/blobs/'+sha],timeout=60))
          patch=base64.b64decode(response['content'])
          require(blob(patch)==sha and len(patch)==17772 and hashlib.sha256(patch).hexdigest()=='1d21040ff69ee23a8c0aefe7e3978e5dfce658f1669c05a0111ad3cffcffb295','Reviewed patch differs')
          entries=[
              ('experiments/H2AgentLab/Integration/AgentIntegrationTaskArchive.cs','d8828cc5b4709c509e8ad2182fafe3f81659034f','18dc332320077502a34d55ec744027fe4cf2798c'),
              ('tests/H2Notes.Tests/H2AgentArchiveJournalTests.cs','6f52147a45c7921ac3126dfd381e963782246fd4','ccf7f69e1ef32508ec5b60a4ae5cff54ea439b6c'),
              ('tests/H2Notes.Tests/H2AgentArchiveBoundaryTests.cs',None,'2977b2e799390d1d3079a2304efbebf00c9d54df')]
          for path,old,new in entries:
              p=pathlib.Path(path);require((blob(p.read_bytes()) if p.exists() else None)==old,'Preimage differs: '+path)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ar031-source';out.mkdir()
          patchfile=out/'boundary.patch';patchfile.write_bytes(patch)
          subprocess.run(['git','apply','--index','--check',str(patchfile)],check=True)
          subprocess.run(['git','apply','--index',str(patchfile)],check=True)
          for path,old,new in entries: require(blob(pathlib.Path(path).read_bytes())==new,'Postimage differs: '+path)
          require(set(git('diff','--cached','--name-only').splitlines())=={e[0] for e in entries},'Unexpected stage')
          subprocess.run(['git','diff','--cached','--check'],check=True)
          require(git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==head,'Concurrent branch work')
          git('config','user.name','github-actions[bot]');git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','commit','-m','fix(AR-031): preserve corrupt-prefix uncertainty and bound archive admission'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+BRANCH],check=True,timeout=120)
          code=git('rev-parse','HEAD');require(not git('status','--porcelain') and git('ls-remote','origin','refs/heads/'+BRANCH).split()[0]==code,'Save not verified')
          (out/'source.json').write_text(json.dumps({'code_sha':code,'prior_head':BASE,'paths':[e[0] for e in entries],'tests':'NOT_RUN_YET','working_tree':'CLEAN'},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('code='+code+'\n')
          print('Saved AR-031 repair:',code)
      - name: Dispatch unchanged full Avalonia workflow
        run: gh api -X POST repos/HoangHung997/NotePad/actions/workflows/avalonia-ci.yml/dispatches -f ref=feature/h2-agent-reliability-ar-000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR031-Source-Delivery
          path: ${{ runner.temp }}/ar031-source/
          if-no-files-found: error
          retention-days: 14
  validation:
    needs: integrate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.code }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record exact identity and build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/ar031 | Out-Null
          if (git status --porcelain) { throw 'Dirty checkout' }
          @{code_sha=(git rev-parse HEAD);working_tree='CLEAN';E1='Archive schema hash retention tests';E2='Concrete local journal and production file runtime with scripted transport; controlled child-process exits';E3='NOT_RUN';E4='NOT_RUN';E5='AR-083 DEFERRED_BY_USER'} | ConvertTo-Json | Set-Content artifacts/ar031/identity.json
          dotnet --info | Set-Content artifacts/ar031/dotnet-info.txt
          dotnet restore H2Notes.Avalonia.slnx
          if ($LASTEXITCODE) { throw 'Restore failed' }
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar031/build.log
          if ($LASTEXITCODE) { throw 'Build failed' }
      - name: Reproduce prior archive admission and recovery-boundary defects
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $path='experiments/H2AgentLab/Integration/AgentIntegrationTaskArchive.cs'
          $original=[IO.File]::ReadAllBytes((Resolve-Path $path))
          try {
            python -c "import pathlib,subprocess,sys;p=sys.argv[1];pathlib.Path(p).write_bytes(subprocess.check_output(['git','show','b49d7ae9930926031581bf1fb1aa72bf2cfbdceb:'+p]))" $path
            if ($LASTEXITCODE) { throw 'Prior source missing' }
            @{test_sha=(git rev-parse HEAD);prior_archive_sha='b49d7ae9930926031581bf1fb1aa72bf2cfbdceb';substituted=$path} | ConvertTo-Json | Set-Content artifacts/ar031/negative-identity.json
            dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar031/negative-build.log
            if ($LASTEXITCODE) { throw 'Compile failure is not a valid counterexample' }
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter 'AR-031 boundary' 2>&1 | Tee-Object artifacts/ar031/negative.log
            $exit=$LASTEXITCODE;$text=Get-Content artifacts/ar031/negative.log -Raw
            if ($exit -eq 0 -or $text -notmatch 'RESULT: 2 passed, 4 failed') { throw 'Expected archive boundary failures did not reproduce' }
            foreach($message in 'Full archive still admits new work.','A completed prefix was presented as current completion after source loss.','A duplicate source event identity survived validated replay.','Oversized legacy sources were retained into a partial migration before quota preflight.') {
              if (-not $text.Contains($message)) { throw ('Expected diagnostic missing: '+$message) }
            }
          } finally {
            [IO.File]::WriteAllBytes((Join-Path $PWD $path),$original)
          }
          if (git status --porcelain) { throw 'Positive source not restored clean' }
          'CLEAN: original source bytes restored' | Set-Content artifacts/ar031/restored.txt
          dotnet build H2Notes.Avalonia.slnx -c Release --no-restore 2>&1 | Tee-Object artifacts/ar031/positive-build.log
          if ($LASTEXITCODE) { throw 'Positive rebuild failed' }
      - name: Run archive crashes and all retained corpora
        id: corpora
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $failed=@()
          foreach($name in 'AR-031-1','AR-031-2','AR-031-3','AR-030','AR-020','AR-012','AR-011','AR-010','AR-001') {
            $env:H2_AR031_EVIDENCE_DIR=Join-Path $PWD "artifacts/ar031/$name"
            dotnet run --project tests/H2Notes.Tests/H2Notes.Tests.csproj -c Release --no-build -- --filter $name.Substring(0,6) 2>&1 | Tee-Object "artifacts/ar031/$name.log"
            if ($LASTEXITCODE -ne 0 -or (Get-Content "artifacts/ar031/$name.log" -Raw) -notmatch 'RESULT: [1-9][0-9]* passed, 0 failed') { $failed+=$name }
          }
          @{failed=$failed} | ConvertTo-Json | Set-Content artifacts/ar031/corpora-result.json
          if ($failed.Count) { throw ('Failed corpora: '+($failed -join ',')) }
      - name: Run mandatory independent Agent suites even if a corpus failed
        if: success() || steps.corpora.outcome == 'failure'
        shell: pwsh
        run: tools/agent-reliability/run_agent_suites.ps1 -OutputDirectory artifacts/ar031/all-agent-suites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AR031-E1-E2-Evidence
          path: artifacts/ar031/
          if-no-files-found: error
          retention-days: 14
